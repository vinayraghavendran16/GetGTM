    '</div></div>';

  // 09 Terms & Ways of Working
  html += '<div class="sect"><span class="sect-num">09</span><h2>Terms & Ways of Working</h2><div class="sect-line"></div>' +
    '<ul style="margin:0;padding-left:16px;font-size:11px;line-height:1.8">' +
    '<li><strong>Brand representation.</strong> All outreach runs from ' + escapeHTML(c.name) + "'s own domains, mailboxes, and LinkedIn accounts.</li>" +
    '<li><strong>Email infrastructure.</strong> New mailboxes require a 12-14 day warm-up before full-volume sending begins.</li>' +
    '<li><strong>LinkedIn access.</strong> Requires 2-3 LinkedIn accounts, preferably from ' + escapeHTML(c.name) + "'s founder or customer-facing team.</li>" +
    '<li><strong>Full visibility.</strong> Target lists, sequences, activity, replies, and credit utilisation are all visible inside Heddl.app.</li>' +

  // 10 Acceptance

// Builds the Campaigns report HTML, filtered to whatever ui.campaignFilters currently says. Returns
// the HTML string only - no PDF triggering here - so both the standalone Campaigns PDF button and the
// combined client Master Report can share this one source of truth for that section's content.
function buildCampaignsReportHTML() {
  var allCampaigns = (state.campaigns || []).slice().sort((a,b) => (b.createdDate||"").localeCompare(a.createdDate||""));
  var f = ui.campaignFilters || { client: "" };
  var campaigns = allCampaigns.filter(function(c) { return !f.client || c.client === f.client; });

  var totalContacts = campaigns.reduce(function(s, c) { return s + (c.totalContacts || 0); }, 0);
  var totalAccepted = campaigns.reduce(function(s, c) { return s + (c.accepted || 0); }, 0);
  var totalReplies = campaigns.reduce(function(s, c) { return s + (c.replies || 0); }, 0);
  var replyRate = totalContacts ? Math.round(totalReplies / totalContacts * 100 * 10) / 10 : 0;

  function metricCard(label, value, color) {
    return '<div style="flex:1;border:0.5px solid #e5e7eb;border-radius:6px;padding:10px 12px">' +
      '<div style="font-size:9px;text-transform:uppercase;letter-spacing:0.3px;color:#94a3b8;margin-bottom:4px">' + escapeHTML(label) + '</div>' +
      '<div style="font-size:18px;font-weight:700;color:' + color + '">' + value + '</div>' +
      '</div>';
  }
  var metricsHtml = '<div style="display:flex;gap:10px;margin-bottom:18px">' +
    metricCard("Total campaigns", campaigns.length, "#111") +
    metricCard("Total contacts reached", totalContacts.toLocaleString(), "#111") +
    metricCard("Connections accepted", totalAccepted.toLocaleString(), "#7c3aed") +
    metricCard("Total replies", totalReplies, "#15803d") +
    metricCard("Reply rate", replyRate + "%", "#475569") +
    '</div>';

  var logoHtml = (f.client && CLIENT_LOGOS[f.client]) ? '<img src="' + CLIENT_LOGOS[f.client] + '" style="height:40px;margin-bottom:10px">' : '';
  var generatedStamp = 'GetGTM Report generated on ' + new Date().toLocaleDateString("en-US", {year:"numeric",month:"long",day:"numeric"}) + ' at ' + new Date().toLocaleTimeString("en-US", {hour:"2-digit",minute:"2-digit"});

  // Screenshots get a short numbered reference in the main table (not the raw URL - a long URL forced
  // to wrap across multiple lines inside a narrow cell breaks most PDF viewers' automatic link
  // detection, since they only recognize an unbroken run of URL text). The full, unwrapped, single-
  // line URL for each reference lives on its own dedicated page at the end. Same fix as Response PDF.
  var campaignRefMap = [];
  var refByIndex = {};
  campaigns.forEach(function(c, i) {
    if (c.screenshotUrl) {
      var refNum = campaignRefMap.length + 1;
      campaignRefMap.push({ ref: refNum, name: c.name, client: c.client, url: c.screenshotUrl });
      refByIndex[i] = refNum;
    }
  });

  var rows = campaigns.map(function(c, i) {
    var screenshotCell = refByIndex[i]
      ? '<span style="color:#2563eb;font-weight:700">Ref #' + refByIndex[i] + '</span>'
      : '<span style="color:#94a3b8">-</span>';
    return '<tr>' +
      '<td style="padding:6px 8px;border-bottom:0.5px solid #e5e7eb;font-size:9px"><strong>' + escapeHTML(c.name || "-") + '</strong></td>' +
      '<td style="padding:6px 8px;border-bottom:0.5px solid #e5e7eb;font-size:9px">' + escapeHTML(c.client || "-") + '</td>' +
      '<td style="padding:6px 8px;border-bottom:0.5px solid #e5e7eb;font-size:9px">' + escapeHTML(c.status || "-") + '</td>' +
      '<td style="padding:6px 8px;border-bottom:0.5px solid #e5e7eb;font-size:9px;white-space:nowrap">' + escapeHTML(c.createdDate || "-") + '</td>' +
      '<td style="padding:6px 8px;border-bottom:0.5px solid #e5e7eb;font-size:9px">' + (c.totalContacts || 0) + '</td>' +
      '<td style="padding:6px 8px;border-bottom:0.5px solid #e5e7eb;font-size:9px">' + (c.accepted || 0) + '</td>' +
      '<td style="padding:6px 8px;border-bottom:0.5px solid #e5e7eb;font-size:9px">' + (c.messagesSent || 0) + '</td>' +
      '<td style="padding:6px 8px;border-bottom:0.5px solid #e5e7eb;font-size:9px">' + (c.emailsSent || 0) + '</td>' +
      '<td style="padding:6px 8px;border-bottom:0.5px solid #e5e7eb;font-size:9px;font-weight:700;color:#15803d">' + (c.replies || 0) + '</td>' +
      '<td style="padding:6px 8px;border-bottom:0.5px solid #e5e7eb;font-size:9px">' + (c.reactions || 0) + '</td>' +
      '<td style="padding:6px 8px;border-bottom:0.5px solid #e5e7eb;font-size:9px;max-width:160px">' + escapeHTML(c.notes || "") + '</td>' +
      '<td style="padding:6px 8px;border-bottom:0.5px solid #e5e7eb;font-size:9px;text-align:center">' + screenshotCell + '</td>' +
      '</tr>';
  }).join("");

  var referencesPageHtml = campaignRefMap.length === 0 ? '' :
    '<div style="page-break-before:always;padding-top:10px">' +
    '<h2 style="font-size:14px;margin:0 0 12px;color:#111">Screenshot References</h2>' +
    campaignRefMap.map(function(item) {
      // One reference per line, full page width, no wrapping - so PDF viewers reliably auto-link.
      return '<div style="font-size:9px;margin-bottom:6px;line-height:1.4">' +
        '<span style="font-weight:700;color:#2563eb">Ref #' + item.ref + '</span> - ' +
        escapeHTML(item.name) + ' (' + escapeHTML(item.client || '') + '): ' +
        '<span style="color:#2563eb">' + escapeHTML(item.url) + '</span>' +
        '</div>';
    }).join("") +
    '</div>';

  var html = '<div style="font-family:Helvetica,Arial,sans-serif;padding:24px;color:#111">' +
    logoHtml +
    '<h1 style="font-size:18px;margin:0 0 4px">Campaigns Report</h1>' +
    '<div style="font-size:11px;color:#64748b;margin-bottom:2px">' + escapeHTML(f.client || "All accounts") + '</div>' +
    '<div style="font-size:10px;color:#94a3b8;margin-bottom:16px">' + escapeHTML(generatedStamp) + ' - ' + campaigns.length + ' campaign' + (campaigns.length !== 1 ? 's' : '') + '</div>' +
    metricsHtml +
    '<table style="width:100%;border-collapse:collapse">' +
    '<thead><tr>' +
    '<th style="text-align:left;padding:6px 8px;border-bottom:1.5px solid #111;font-size:9px;text-transform:uppercase;color:#64748b">Campaign</th>' +
    '<th style="text-align:left;padding:6px 8px;border-bottom:1.5px solid #111;font-size:9px;text-transform:uppercase;color:#64748b">Account</th>' +
    '<th style="text-align:left;padding:6px 8px;border-bottom:1.5px solid #111;font-size:9px;text-transform:uppercase;color:#64748b">Status</th>' +
    '<th style="text-align:left;padding:6px 8px;border-bottom:1.5px solid #111;font-size:9px;text-transform:uppercase;color:#64748b">Created</th>' +
    '<th style="text-align:left;padding:6px 8px;border-bottom:1.5px solid #111;font-size:9px;text-transform:uppercase;color:#64748b">Total</th>' +
    '<th style="text-align:left;padding:6px 8px;border-bottom:1.5px solid #111;font-size:9px;text-transform:uppercase;color:#64748b">Accepted</th>' +
    '<th style="text-align:left;padding:6px 8px;border-bottom:1.5px solid #111;font-size:9px;text-transform:uppercase;color:#64748b">Messages</th>' +
    '<th style="text-align:left;padding:6px 8px;border-bottom:1.5px solid #111;font-size:9px;text-transform:uppercase;color:#64748b">Emails</th>' +
    '<th style="text-align:left;padding:6px 8px;border-bottom:1.5px solid #111;font-size:9px;text-transform:uppercase;color:#64748b">Replies</th>' +
    '<th style="text-align:left;padding:6px 8px;border-bottom:1.5px solid #111;font-size:9px;text-transform:uppercase;color:#64748b">Reactions</th>' +
    '<th style="text-align:left;padding:6px 8px;border-bottom:1.5px solid #111;font-size:9px;text-transform:uppercase;color:#64748b">Notes</th>' +
    '<th style="text-align:left;padding:6px 8px;border-bottom:1.5px solid #111;font-size:9px;text-transform:uppercase;color:#64748b">Screenshot link</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>' +
    referencesPageHtml +
    '</div>';

  return html;
}

function generateCampaignsPDF() {
  var html = buildCampaignsReportHTML();
  var f = ui.campaignFilters || { client: "" };
  var filenameSuffix = f.client ? f.client.replace(/[^a-zA-Z0-9]+/g, '_') : 'All';
  var opt = {
    margin: 10,
    filename: 'Campaigns_' + filenameSuffix + '_' + new Date().toISOString().slice(0,10) + '.pdf',
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' },
    pagebreak: { mode: ['css', 'legacy'] }
  };
  renderHtmlToPdf(html, opt);
}

function buildResponsesReportHTML() {
  var allResponses = (state.responses || []).slice().sort((a,b) => (b.date||"").localeCompare(a.date||""));
  var f = ui.responseFilters || { client: "", heddlStatus: "", clientStatus: "", confirmed: "" };
  var responses = allResponses.filter(function(r) {
    if (f.client && r.client !== f.client) return false;
    if (f.heddlStatus && r.heddlStatus !== f.heddlStatus) return false;
    if (f.clientStatus && r.clientStatus !== f.clientStatus) return false;
    if (f.confirmed === "yes" && !r.confirmed) return false;
    if (f.confirmed === "no" && r.confirmed) return false;
    return true;
  });

  var filterParts = [];
  if (f.client) filterParts.push("Account: " + f.client);
  if (f.heddlStatus) filterParts.push("Heddl Status: " + f.heddlStatus);
  if (f.clientStatus) filterParts.push("Client Status: " + f.clientStatus);
  if (f.confirmed) filterParts.push("Confirmed: " + (f.confirmed === "yes" ? "Confirmed only" : "Not confirmed only"));
  var filterLabel = filterParts.length > 0 ? filterParts.join(" | ") : "All responses";

  // Client-specific brand accent color for a polished, client-facing report. Falls back to the
  // standard GetGTM purple when not filtered to a specific client with a defined brand color.
  var CLIENT_BRAND_COLORS = { "Securotix": "#A6192E" };
  var accentColor = (f.client && CLIENT_BRAND_COLORS[f.client]) ? CLIENT_BRAND_COLORS[f.client] : "#7c3aed";

  var pdfHeddlCounts = { "Positive Reply": 0, "Meeting Booked": 0, "No Fit": 0, "Not Interested": 0 };
  responses.forEach(function(r) { if (pdfHeddlCounts[r.heddlStatus] !== undefined) pdfHeddlCounts[r.heddlStatus]++; });
  var pdfConfirmedCount = responses.filter(function(r) { return r.confirmed; }).length;
  var totalN = responses.length || 1;

  function metricCard(label, value, color) {
    return '<div style="flex:1;border:0.5px solid #e5e7eb;border-radius:6px;padding:12px 14px">' +
      '<div style="font-size:9px;text-transform:uppercase;letter-spacing:0.3px;color:#94a3b8;margin-bottom:5px">' + escapeHTML(label) + '</div>' +
      '<div style="font-size:20px;font-weight:700;color:' + color + '">' + value + '</div>' +
      '</div>';
  }
  var metricsHtml = '<div style="display:flex;gap:10px;margin-bottom:22px">' +
    metricCard("Total responses", responses.length, "#111") +
    metricCard("Positive %", Math.round(pdfHeddlCounts["Positive Reply"] / totalN * 100) + "%", "#15803d") +
    metricCard("Meetings booked %", Math.round(pdfHeddlCounts["Meeting Booked"] / totalN * 100) + "%", accentColor) +
    metricCard("Not interested %", Math.round(pdfHeddlCounts["Not Interested"] / totalN * 100) + "%", "#b91c1c") +
    metricCard("Confirmed %", Math.round(pdfConfirmedCount / totalN * 100) + "%", "#475569") +
    '</div>';

  var pivotGroups = computeReportingSnapshotGroups(responses);
  var pivotTotal = pivotGroups.reduce(function(s, g) { return s + g.total; }, 0);
  var pivotConfirmed = pivotGroups.reduce(function(s, g) { return s + g.confirmed; }, 0);
  var pivotTotalPct = pivotTotal ? Math.round(pivotConfirmed / pivotTotal * 100) : 0;
  var pivotRowsHtml = pivotGroups.map(function(g) {
    var pct = g.total ? Math.round(g.confirmed / g.total * 100) : 0;
    return '<tr>' +
      '<td style="padding:6px 10px;border-bottom:0.5px solid #e5e7eb;font-size:10px">' + escapeHTML(g.campaign) + '</td>' +
      '<td style="padding:6px 10px;border-bottom:0.5px solid #e5e7eb;font-size:10px">' + g.total + '</td>' +
      '<td style="padding:6px 10px;border-bottom:0.5px solid #e5e7eb;font-size:10px">' + g.confirmed + '</td>' +
      '<td style="padding:6px 10px;border-bottom:0.5px solid #e5e7eb;font-size:10px;font-weight:600">' + pct + '%</td>' +
      '</tr>';
  }).join("");
  var pivotTotalsRow = '<tr style="font-weight:700;background:#f8fafc">' +
    '<td style="padding:7px 10px;border-top:1.5px solid #111;font-size:10px">Total</td>' +
    '<td style="padding:7px 10px;border-top:1.5px solid #111;font-size:10px">' + pivotTotal + '</td>' +
    '<td style="padding:7px 10px;border-top:1.5px solid #111;font-size:10px">' + pivotConfirmed + '</td>' +
    '<td style="padding:7px 10px;border-top:1.5px solid #111;font-size:10px;color:' + accentColor + '">' + pivotTotalPct + '%</td>' +
    '</tr>';
  var pivotHtml = pivotGroups.length === 0 ? '' :
    '<div>' +
    '<div style="font-size:12px;font-weight:700;margin-bottom:8px;color:' + accentColor + '">Reporting Snapshot - by Campaign</div>' +
    '<table style="width:65%;border-collapse:collapse">' +
    '<thead><tr>' +
    '<th style="text-align:left;padding:6px 10px;border-bottom:1.5px solid #111;font-size:9px;text-transform:uppercase;color:#64748b">Campaign</th>' +
    '<th style="text-align:left;padding:6px 10px;border-bottom:1.5px solid #111;font-size:9px;text-transform:uppercase;color:#64748b">Total</th>' +
    '<th style="text-align:left;padding:6px 10px;border-bottom:1.5px solid #111;font-size:9px;text-transform:uppercase;color:#64748b">Confirmed</th>' +
    '<th style="text-align:left;padding:6px 10px;border-bottom:1.5px solid #111;font-size:9px;text-transform:uppercase;color:#64748b">Confirmed %</th>' +
    '</tr></thead><tbody>' + pivotRowsHtml + pivotTotalsRow + '</tbody></table>' +
    '</div>';

  function badge(status) {
    if (!status) return '<span style="color:#94a3b8">-</span>';
    var c = responseStatusColor(status);
    return '<span style="background:' + c.bg + ';color:' + c.color + ';font-weight:600;padding:2px 7px;border-radius:4px;font-size:9px;display:inline-block;white-space:nowrap">' + escapeHTML(status) + '</span>';
  }
  // Trims long free-text fields for the table so rows stay a predictable height and the layout stays
  // clean - full untruncated text always remains available in the tracker itself.
  function trim(s, n) {
    s = s || "";
    return s.length > n ? s.slice(0, n - 1) + "…" : s;
  }

  // Screenshots get a short numbered reference in the main table (not the raw URL - a long URL forced
  // to wrap across multiple lines inside a narrow cell breaks most PDF viewers' automatic link
  // detection, since they only recognize an unbroken run of URL text). The full, unwrapped, single-
  // line URL for each reference lives on its own dedicated page at the end, where it has the whole
  // page width to itself and reliably gets auto-linked.
  var refMap = [];
  responses.forEach(function(r) {
    if (r.screenshotUrl) refMap.push({ ref: refMap.length + 1, contact: r.contact, client: r.client, url: r.screenshotUrl });
  });
  var refByResponse = {};
  refMap.forEach(function(item, i) { refByResponse[i] = item.ref; });
  var refIndex = 0;

  var rows = responses.map(function(r) {
    var screenshotCell;
    if (r.screenshotUrl) {
      refIndex++;
      screenshotCell = '<span style="color:' + accentColor + ';font-weight:700">Ref #' + refIndex + '</span>';
    } else {
      screenshotCell = '<span style="color:#94a3b8">-</span>';
    }
    return '<tr>' +
      '<td style="padding:6px 8px;border-bottom:0.5px solid #e5e7eb;font-size:8.5px;white-space:nowrap;vertical-align:top">' + escapeHTML(r.date || "-") + '</td>' +
      '<td style="padding:6px 8px;border-bottom:0.5px solid #e5e7eb;font-size:8.5px;vertical-align:top">' + escapeHTML(r.client || "-") + '</td>' +
      '<td style="padding:6px 8px;border-bottom:0.5px solid #e5e7eb;font-size:8.5px;vertical-align:top;overflow-wrap:break-word">' + escapeHTML(trim(r.contact, 28)) + '</td>' +
      '<td style="padding:6px 8px;border-bottom:0.5px solid #e5e7eb;font-size:8.5px;vertical-align:top;overflow-wrap:break-word">' + escapeHTML(trim(r.company, 22)) + '</td>' +
      '<td style="padding:6px 8px;border-bottom:0.5px solid #e5e7eb;font-size:8.5px;vertical-align:top;overflow-wrap:break-word">' + escapeHTML(trim(r.campaign, 26)) + '</td>' +
      '<td style="padding:6px 8px;border-bottom:0.5px solid #e5e7eb;vertical-align:top">' + badge(r.heddlStatus) + '</td>' +
      '<td style="padding:6px 8px;border-bottom:0.5px solid #e5e7eb;vertical-align:top">' + badge(r.clientStatus) + '</td>' +

function syncTimelineFromDelivery(c) {
  if (!c.stages) return;
  var del = (c.delivery && c.delivery.onboarding) || [];
  var stageMap = {};
  del.forEach(function(item) { stageMap[item.item] = item.status; });

  function allDone() {
    var items = Array.prototype.slice.call(arguments);
    return items.length > 0 && items.every(function(name) { return stageMap[name] === "Complete"; });
  }
  function anyBlocked() {
    var items = Array.prototype.slice.call(arguments);
    return items.some(function(name) { return stageMap[name] === "Blocked"; });
  }
  function anyStarted() {
    var items = Array.prototype.slice.call(arguments);
    return items.some(function(name) { return stageMap[name] === "In Progress" || stageMap[name] === "Complete"; });
  }

  var propStage = c.proposal ? c.proposal.stage : "";

  c.stages.forEach(function(stage) {
    var s = stage.stage;
    var newStatus = stage.status;

    // Qualification: moves as soon as any package is selected in intake
    if (s === "Qualification") {
      if (c.intake && c.intake.outbound) newStatus = "Complete";
    }

    // Scoping: in progress once overview/goals/ICP started, complete once proposal drafted
    if (s === "Scoping") {
      var hasGoals = c.goals && (c.goals.m1.replies || c.goals.m2.replies);
      var hasICP = c.icp && (c.icp.geography || c.icp.industry);
      if (propStage) newStatus = "Complete";
      else if (hasGoals || hasICP) newStatus = "In Progress";
    }

    // Proposal stage tracks the proposal workflow directly
    if (s === "Proposal" || s === "Proposal / Scoping") {
      if (propStage === "draft") newStatus = "In Progress";
      else if (propStage === "sent" || propStage === "final") newStatus = "In Progress";
      else if (propStage === "approved") newStatus = "Complete";
    }

    // Commercial Handover: in progress once approved, complete once SOW+invoice done
    if (s === "Commercial Handover") {
      if (propStage === "approved") {
        if (allDone("SOW signed and filed", "Invoice sent (Part 1)")) newStatus = "Complete";
        else newStatus = "In Progress";
      }
    }

    if (s === "Onboarding" || s === "Onboarding Call") {
      if (allDone("Kickoff call completed")) newStatus = "Complete";
      else if (anyStarted("Kickoff call completed", "Shared Slack/Teams channel created")) newStatus = "In Progress";
      if (anyBlocked("Kickoff call completed")) newStatus = "Blocked";
    }

    if (s === "Infrastructure") {
      if (allDone("Email domains purchased", "Email domains warming")) newStatus = "Complete";
      else if (anyStarted("Email domains purchased", "Email domains warming")) newStatus = "In Progress";
      if (anyBlocked("Email domains purchased", "Email domains warming")) newStatus = "Blocked";
    }

    if (s === "Connecting Accounts") {
      if (allDone("LinkedIn accounts connected", "Sales Navigator access confirmed", "CRM access granted or tracking sheet created")) newStatus = "Complete";
      else if (anyStarted("LinkedIn accounts connected", "Sales Navigator access confirmed")) newStatus = "In Progress";
      if (anyBlocked("LinkedIn accounts connected", "Sales Navigator access confirmed")) newStatus = "Blocked";
    }

    if (s === "ICP Fitment") {
      if (allDone("ICP fitment document approved")) newStatus = "Complete";
      else if (anyStarted("ICP fitment document approved")) newStatus = "In Progress";
      if (anyBlocked("ICP fitment document approved")) newStatus = "Blocked";
    }

    if (s === "TAM & List" || s === "Target List Research") {
      if (allDone("TAM & launch list built")) newStatus = "Complete";
      else if (anyStarted("TAM & launch list built")) newStatus = "In Progress";
      if (anyBlocked("TAM & launch list built")) newStatus = "Blocked";
    }

    if (s === "Messaging") {
      if (allDone("Messaging approved")) newStatus = "Complete";
      else if (anyStarted("Messaging approved")) newStatus = "In Progress";
      if (anyBlocked("Messaging approved")) newStatus = "Blocked";
    }

    if (s === "Campaign Build" || s === "QA & Test" || s === "QA & Validation") {
      if (allDone("Campaign built and QA passed")) newStatus = "Complete";
      else if (anyStarted("Campaign built and QA passed")) newStatus = "In Progress";
      if (anyBlocked("Campaign built and QA passed")) newStatus = "Blocked";
    }

    if (s === "Launch") {
      if (allDone("First campaign launched")) newStatus = "Complete";
      else if (anyStarted("First campaign launched")) newStatus = "In Progress";
      if (anyBlocked("First campaign launched")) newStatus = "Blocked";
    }

    if (s === "First Review" || s === "Post-launch") {
      if (allDone("MSP signed off by both parties", "First campaign launched")) newStatus = "Complete";
      else if (allDone("First campaign launched")) newStatus = "In Progress";
    }

    // Deep Discovery (niche path)
    if (s === "Deep Discovery") {
      if (allDone("Kickoff call completed")) newStatus = "Complete";
      else if (anyStarted("Kickoff call completed")) newStatus = "In Progress";
    }

    // GTM Play Design (niche path)
    if (s === "GTM Play Design") {
      if (allDone("ICP fitment document approved", "TAM & launch list built")) newStatus = "Complete";
      else if (anyStarted("ICP fitment document approved")) newStatus = "In Progress";
    }

    // Update date if completing
    if (newStatus === "Complete" && stage.status !== "Complete" && !stage.eta) {
      stage.eta = new Date().toISOString().slice(0, 10);
    }

    stage.status = newStatus;
  });
}

function renderTimelineBar(c) {
  var stages = c.stages || [];
  var total = stages.length;
  var done = stages.filter(function(s) { return s.status === "Complete"; }).length;
  var current = stages.find(function(s) { return s.status !== "Complete"; });

  var dots = stages.map(function(s, i) {
    var st = s.status;
    var cls = st === "Complete" ? "tl-done" : st === "In Progress" ? "tl-active" : st === "Blocked" ? "tl-blocked" : "tl-pending";
    var dateStr = s.eta ? new Date(s.eta).toLocaleDateString("en-US", {month:"short",day:"numeric"}) : "";
    return '<div class="tl-node ' + cls + '" title="' + escapeAttr(s.stage + ': ' + st) + '">' +
      '<div class="tl-dot"></div>' +
      '<div class="tl-label">' + escapeHTML(s.stage.length > 12 ? s.stage.substring(0,11) + '..' : s.stage) + '</div>' +
      (dateStr ? '<div class="tl-date">' + dateStr + '</div>' : '') +
    '</div>';
  }).join('<div class="tl-connector' + '"></div>');

  return '<div class="tl-track">' + dots + '</div>' +
    '<div class="tl-summary">' + done + ' of ' + total + ' complete' +
    (current ? ' - Current: ' + escapeHTML(current.stage) : ' - All complete') + '</div>';
}

  html += '<h3 style="font-size:14px;font-weight:600;margin:20px 0 12px">Weekly updates</h3>';
  html += '<button class="btn sm" data-action="add-weekly-update" style="margin-bottom:12px">+ Add update</button>';

  (del.weeklyUpdates || []).forEach(function(u, i) {
    html += '<div class="del-update">';
    html += '<input type="date" data-weekly="' + i + '" data-key="date" value="' + escapeAttr(u.date) + '" style="width:130px">';
    html += '<textarea data-weekly="' + i + '" data-key="note" placeholder="What happened this week?" style="flex:1;min-height:40px">' + escapeHTML(u.note) + '</textarea>';
    html += '<button class="btn ghost sm" data-action="delete-weekly" data-i="' + i + '">x</button>';
    html += '</div>';
  });

  html += '</div></div>';
  return html;
}

// Maps everything already being tracked (the stage tracker, proposal status, and post-signature
// account status) into a single Presales -> Sales -> Post-sales CS framing. Deliberately has no
// separate stored field: every input here is already something the team updates as part of normal
// work (advancing a stage, approving a proposal, setting Account Status), so this can never drift out
// of sync with reality the way a second, manually-maintained "phase" field could. "Auto-advancing"
// falls out of that for free - move the underlying data forward and this recomputes correctly, with
// no separate step to remember.
function computePipelinePhase(c) {
  var approved = c.proposal && c.proposal.stage === "approved";
  if (!approved) {
    var stages = c.stages || [];
    var current = stages.find(function(s) { return s.status !== "Complete"; });
    var name = current ? (current.stage || "").toLowerCase() : "";
    if (name.indexOf("proposal") !== -1 || name.indexOf("commercial") !== -1) {
      var stageLabel = { draft: "Proposal Draft", sent: "Scope Review", final: "Final Sent" }[c.proposal ? c.proposal.stage : "draft"] || "Proposal Sent";
      return { phase: "Sales", stage: stageLabel };
    }
    return { phase: "Presales", stage: current ? current.stage : "Qualification" };
  }
  // Approved (signed) - post-sales CS. While the delivery stage tracker still has incomplete steps
  // (Onboarding through First Review, whichever apply on this client's path), the engagement is still
  // being stood up. Once that's all done, the ongoing relationship is represented by the existing,
  // already-manually-managed Account Status field (Onboarding/Active/At Risk/Paused/Renewed/Churned) -
  // reusing it here rather than inventing a second, parallel status that could say something different.
  var delivStages = c.stages || [];
  var delivCurrent = delivStages.find(function(s) { return s.status !== "Complete"; });
  if (delivCurrent) {
    return { phase: "Post-sales CS", stage: "Onboarding & Launch (" + delivCurrent.stage + ")" };
  }
  return { phase: "Post-sales CS", stage: c.accountStatus || "Active" };
}

// Picks which tab to land on when a team member opens a client from the Clients list, based on
// where that engagement actually is right now - instead of always opening the full-screen Offers
// presentation (which is a prospect-facing pitch deck, not useful once you already know the client
// and just want to see their status). Maps the current (first non-complete) stage's name to the tab
// that covers that phase of work. Stage names vary slightly across the three delivery paths (7-day
// sprint / 14-day buildout / niche GTM - see PATHS), so this matches on keywords rather than exact
// stage strings, which is robust across all three.
function defaultTabForClient(c) {
  var stages = c.stages || [];
  var current = stages.find(function(s) { return s.status !== "Complete"; });
  if (!current) return c.proposal && c.proposal.stage === "approved" ? "delivery" : "overview";
  var name = (current.stage || "").toLowerCase();
  if (name.indexOf("qualification") !== -1 || (name.indexOf("scoping") !== -1 && name.indexOf("proposal") === -1 && name.indexOf("commercial") === -1)) {
    return "intake";
  }
  if (name.indexOf("proposal") !== -1 || name.indexOf("commercial") !== -1) {
    return "proposal";
  }
  // Everything else (Onboarding, Infrastructure, Connecting Accounts, ICP Fitment, TAM & List,
  // Target List Research, GTM Play Design, Deep Discovery, Messaging, Campaign Build, QA, Launch,
  // First Review) is delivery-phase work.
  if (c.proposal && c.proposal.stage === "approved") return "delivery";
  return "overview";
}

  if (window.__actionHandler) {

      else if (action === "preview-as-client") {

      else if (action === "add-prospect") {

        if (respToDelete && respToDelete.confirmed) {

        if (dedupeResult.removed === 0) {

        } else if (confirm("Found " + dedupeResult.removed + " duplicate response(s) - same client and contact logged more than once (likely the same reply screenshotted twice). Keeping the best copy of each (confirmed ones first, then the most detailed) and removing the rest. This cannot be undone. Continue?")) {
          state.responses = dedupeResult.kept;
          saveState("responses").then(function() { render(); });
          alert("Removed " + dedupeResult.removed + " duplicate(s). " + dedupeResult.kept.length + " unique responses remain.");
        }
      }
      else if (action === "calling-import") {

      }
      else if (action === "client-export-master-report") {
        generateClientMasterReportPDF(ui.clientId);
      }
      else if (action === "client-export-campaigns-pdf") {
        // Temporarily scope the shared campaigns-filter state to this client so the existing
        // generateCampaignsPDF() (built for the team dashboard) produces the same client-scoped PDF
        // without needing a separate export function to maintain.
        var prevCampaignFilter = ui.campaignFilters;
        ui.campaignFilters = { client: state.clients[ui.clientId].name };
        generateCampaignsPDF();
        ui.campaignFilters = prevCampaignFilter;
      }
      else if (action === "client-export-responses-pdf") {
        var prevResponseFilter = ui.responseFilters;
        ui.responseFilters = { client: state.clients[ui.clientId].name, heddlStatus: "", clientStatus: "", confirmed: "" };
        generateResponsesPDF();
        ui.responseFilters = prevResponseFilter;
      }
      else if (action === "calling-export-pdf") {
        generateCallingPDF(el.dataset.callingClient);
      }
      else if (action === "calling-delete-lead") {
        var cid = el.dataset.callingClient;
        var lid = el.dataset.callingLead;
        if (!confirm("Delete this lead? This can't be undone (though the audit log will preserve the history).")) return;
        var leads = (state.callingLeads && state.callingLeads[cid]) || [];
        var idx = leads.findIndex(function(l) { return l.id === lid; });
        if (idx === -1) return;
        var removed = leads[idx];
        leads.splice(idx, 1);
        recordCallingLog(cid, lid, "__deleted", (removed.firstName || "") + " " + (removed.lastName || ""), "");
        await saveState("callingLeads");
        await saveState("callingLogs");
        render();
      }
      else if (action === "refresh-from-drive") {
        // Triggers the backend GitHub Actions workflow that reads new Drive screenshots and writes
        // classified responses to Firebase. Two paths:
        //   (1) Fully wired: if the team has stored a GitHub repo path + PAT (once, via prompt), this
        //       POSTs to the workflow_dispatch API and the backend runs immediately - the tracker
        //       picks up new rows live via the existing Firebase subscription, no manual reload.
        //   (2) Not yet wired: opens the Actions page in a new tab so the user can hit "Run workflow"
        //       manually. Same end result, one extra click.
        // Config lives at getgtm_tracker/config/githubDispatch so any signed-in team member benefits
        // from the setup done by whoever configured it first - not stored per-browser.
        (async function() {
          var configRef = (typeof db !== "undefined" && db && db.ref) ? db.ref("getgtm_tracker/config/githubDispatch") : null;
          var cfg = null;
          if (configRef) {
            try {
              var snap = await configRef.once("value");
              cfg = snap.val();
            } catch (e) { /* fall through to prompt path */ }
          }

          if (!cfg || !cfg.repo || !cfg.token || !cfg.workflow) {
            // First-run setup - collect once, store, then trigger.
            var repo = prompt("First-time setup for the Refresh button.\n\nEnter the backend repo path in owner/name format (e.g. vinayraghavendran16/getgtm-backend):");
            if (!repo) return;
            var workflow = prompt("Workflow filename to trigger:", "refresh-responses.yml");
            if (!workflow) return;
            var token = prompt("GitHub Personal Access Token with actions:write scope for that repo.\n\nCreate one at: https://github.com/settings/tokens?type=beta - restrict to the single backend repo, permission: Actions = Read and write. This is stored in Firebase for the whole team.");
            if (!token) return;
            var branch = prompt("Branch to run the workflow on:", "main") || "main";
            cfg = { repo: repo.trim(), workflow: workflow.trim(), token: token.trim(), branch: branch.trim() };
            if (configRef) {
              try { await configRef.set(cfg); } catch (e) { console.warn("Could not persist dispatch config:", e.message); }
            }
          }

          // Fire the workflow. GitHub returns 204 No Content on success, 401/403/404 on auth or path
          // errors - show a clean, actionable message either way so setup errors don't look mysterious.
          var url = "https://api.github.com/repos/" + cfg.repo + "/actions/workflows/" + cfg.workflow + "/dispatches";
          try {
            var res = await fetch(url, {
              method: "POST",
              headers: {
                "Accept": "application/vnd.github+json",
                "Authorization": "Bearer " + cfg.token,
                "X-GitHub-Api-Version": "2022-11-28",
                "Content-Type": "application/json"
              },
              body: JSON.stringify({ ref: cfg.branch || "main" })
            });
            if (res.status === 204) {
              alert("Triggered ✓ The backend is now scanning Drive. New rows will appear here automatically in 30-60 seconds - no reload needed.");
            } else if (res.status === 401 || res.status === 403) {
              if (confirm("GitHub rejected the token (" + res.status + "). Reset the setup and try again?")) {
                if (configRef) await configRef.remove();
              }
            } else if (res.status === 404) {
              if (confirm("Not found (404) - the repo path or workflow filename is wrong. Reset the setup and try again?")) {
                if (configRef) await configRef.remove();
              }
            } else {
              var body = "";
              try { body = await res.text(); } catch (e) {}
              alert("GitHub returned " + res.status + ". Response: " + body.slice(0, 200));
            }
          } catch (err) {
            // Network/CORS failure - open the Actions page as a graceful fallback so the user still
            // gets to Run workflow with one more click.
            if (confirm("Could not reach the GitHub API from the browser (" + err.message + "). Open the Actions page in a new tab instead so you can Run workflow manually?")) {
              window.open("https://github.com/" + cfg.repo + "/actions/workflows/" + cfg.workflow, "_blank");
            }
          }
        })();
      }
      else if (action === "bulk-assign-campaign") {
        // Only reachable when a client filter is active (button is conditionally rendered above), but
        // guard again here so state can't drift and produce cross-client garbage in a race.
        var bulkClient = ui.responseFilters && ui.responseFilters.client;
        if (!bulkClient) { alert("Filter by a specific client first, then use Bulk assign."); return; }
        var clientCampaigns = (state.campaigns || []).filter(function(c) { return c.client === bulkClient; });
        if (clientCampaigns.length === 0) { alert("No campaigns are set up for " + bulkClient + " yet - add them in the Campaigns tab first."); return; }

        // Scope: apply to whatever is currently visible AND has no campaign yet. We recompute the
        // filtered set here so this action stays honest even if other filters (heddl status, client
        // status, confirmed) are also active - it never touches a row the user can't see.
        var visibleUnassigned = (state.responses || []).filter(function(r) {
          if (r.client !== bulkClient) return false;
          if (r.campaign) return false;
          if (r.confirmed) return false; // don't silently rewrite locked rows
          var ff = ui.responseFilters || {};
          if (ff.heddlStatus && r.heddlStatus !== ff.heddlStatus) return false;
          if (ff.clientStatus && r.clientStatus !== ff.clientStatus) return false;
          if (ff.confirmed === "yes" && !r.confirmed) return false;
          if (ff.confirmed === "no" && r.confirmed) return false;
          return true;
        });
        if (visibleUnassigned.length === 0) {
          alert("No unassigned + unlocked rows in the current view. Everything visible already has a campaign, or is confirmed (locked).");
          return;
        }

        var menu = clientCampaigns.map(function(c, i) { return (i + 1) + ". " + c.name; }).join("\n");
        var choice = prompt(
          visibleUnassigned.length + " visible row(s) for " + bulkClient + " have no campaign assigned. Pick a campaign to assign to all of them:\n\n" + menu + "\n\nEnter the number (1-" + clientCampaigns.length + "), or Cancel."
        );
        if (choice === null) return;
        var idx = parseInt(choice, 10) - 1;
        if (isNaN(idx) || idx < 0 || idx >= clientCampaigns.length) { alert("Invalid choice - nothing changed."); return; }
        var chosen = clientCampaigns[idx].name;

        if (!confirm("Assign \"" + chosen + "\" to " + visibleUnassigned.length + " response(s)? You can still change each row individually afterwards.")) return;
        visibleUnassigned.forEach(function(r) { r.campaign = chosen; });
        saveState("responses").then(function() { render(); });
        alert("Assigned \"" + chosen + "\" to " + visibleUnassigned.length + " response(s).");
      }
      else if (action === "fix-campaigns") {
        var changes = [];
        (state.responses || []).forEach(function(r) {
          var reDerived = extractCampaignFromNotes(r.notes);
          if (reDerived !== r.campaign) { changes.push({ r: r, newVal: reDerived }); }
        });
        if (changes.length === 0) {
          alert("No changes needed - every campaign value already matches what would be re-derived from notes.");
        } else if (confirm("This will re-derive the Campaign field for all " + (state.responses||[]).length + " responses from their notes text and the real campaign list, overwriting any current value (including ones you've manually corrected). " + changes.length + " would change. Continue?")) {
          changes.forEach(function(c) { c.r.campaign = c.newVal; });
          saveState("responses").then(function() { render(); });
          alert("Updated " + changes.length + " campaign value(s).");
        }
      }
      else if (action === "export-responses-pdf") {
        generateResponsesPDF();
      }
      else if (action === "send-response-report") {
        sendResponseReportToProspect();
      }
      else if (action === "clear-response-filters") {
        ui.responseFilters = { client: "", heddlStatus: "", clientStatus: "", confirmed: "" };
        render();
      }
      else if (action === "save-response-view") {
        var viewName = prompt("Name this view (e.g. \"Securotix unconfirmed positives\"):");
        if (!viewName) return;
        if (!state.responseSavedViews) state.responseSavedViews = [];
        state.responseSavedViews.push({ name: viewName, filters: Object.assign({}, ui.responseFilters) });
        saveState("responseViews"); render();
      }
      else if (action === "delete-response-view") {
        var vIdx = +el.dataset.viewIndex;
        var vName = (state.responseSavedViews[vIdx] || {}).name || "this view";
        if (confirm("Delete saved view \"" + vName + "\"?")) {
          state.responseSavedViews.splice(vIdx, 1);
          saveState("responseViews"); render();
        }
      }
      else if (action === "load-response-view-chip") {
        var loadIdx = +el.dataset.viewIndex;
        var view = state.responseSavedViews[loadIdx];
        if (view) { ui.responseFilters = Object.assign({ client: "", heddlStatus: "", clientStatus: "", confirmed: "" }, view.filters); render(); }
      }
      else if (action === "convert-prospect") {
        var prospect = state.prospects.find(function(x) { return x.id === el.dataset.id; });
        if (!prospect) return;
        var companyName = (prospect.company || prospect.name || "New Engagement").trim();
        var alreadyExists = Object.values(state.clients).some(function(c) { return c.name.trim().toLowerCase() === companyName.toLowerCase(); });
        if (alreadyExists) {
          alert(companyName + " already has an engagement. Use \"Open engagement\" instead of creating a duplicate.");
          return;
        }
        if (!confirm("Convert " + prospect.name + " (" + companyName + ") to a new engagement? This creates a New Engagement record and marks the prospect Converted.")) return;
        var newC = newClient(companyName, "7-day");
        newC.intake.pocName = prospect.name || "";
        newC.intake.pocEmail = prospect.email || "";
        migrateClient(newC);
        state.clients[newC.id] = newC;
        prospect.status = "Converted";
        await saveState();
        ui.view = "client"; ui.clientId = newC.id; ui.tab = "intake";
        render();
      }
      else if (action === "delete-prospect") {
        var pr = state.prospects.find(function(x) { return x.id === el.dataset.id; });
        var prName = pr ? (pr.name + (pr.company ? " (" + pr.company + ")" : "")) : "this prospect";
        if (confirm("Remove " + prName + " from Prospects? This cannot be undone.")) {
          state.prospects = state.prospects.filter(p => p.id !== el.dataset.id);
          saveState(); render();
        }
      }
      else if (action === "refresh-prospects") {
        var result = refreshProspectsFromGmail();
        state.lastGmailRefresh = new Date().toLocaleDateString("en-US", {year:"numeric",month:"short",day:"numeric"});
        await saveState("prospects");
        render();
        if (result.added > 0 || result.updated > 0) {
          var parts = [];
          if (result.added > 0) parts.push(result.added + " new prospect" + (result.added > 1 ? "s" : ""));
          if (result.updated > 0) parts.push(result.updated + " updated with newer activity");
          alert(parts.join(", ") + ".");
        } else {
          alert("No changes found. This checks against threads I already know about - ask Claude in chat to search Gmail fresh, and I'll add or update anything new the same way.");
        }
      }
      else if (action === "modal-close") { ui.modal = null; render(); }
      else if (action === "modal-create") {
        const nameEl = document.getElementById("nc-name");
        const name = nameEl.value.trim();
        const path = document.getElementById("nc-path").value;
        if (!name) { nameEl.style.borderColor = "var(--danger)"; nameEl.focus(); return; }
        const c = newClient(name, path);
        state.clients[c.id] = c;
        await saveState();
        ui.modal = null;
        ui.view = "client";
        ui.clientId = c.id;
        ui.tab = "offers";
        ui.offerPage = 0;
        render();
      } else if (action === "back") {
        var leavingClient = state.clients[ui.clientId];
        if (leavingClient) {
          ui.dashboardTab = (leavingClient.proposal && leavingClient.proposal.stage === "approved") ? "clients" : "new-engagements";
        }
        ui.view = "dashboard";
        render();
      }
      else if (action === "tab") { if (isClientView && CLIENT_TAB_IDS.indexOf(el.dataset.tab) === -1) return; ui.tab = el.dataset.tab; render(); }
      else if (action === "skip-ppt") { ui.tab = "intake"; render(); }
      else if (action === "offer-prev") {
        ui.offerPage = Math.max(0, (ui.offerPage || 0) - 1);
        render();
      } else if (action === "offer-next") {
        if ((ui.offerPage || 0) < SLIDES.length - 1) {
          ui.offerPage = (ui.offerPage || 0) + 1; render();
        } else {
          ui.tab = "intake"; render();
        }
      }
      else if (action === "generate-pdf") {
        generateProposalPDF(state.clients[ui.clientId]);
      } else if (action === "go-to-proposal") {
        await saveState();
        ui.tab = "proposal";
        render();
      } else if (action === "mark-initial-sent") {
        const cl = state.clients[ui.clientId];
        cl.proposal.stage = "sent";
        cl.proposal.initialSentDate = new Date().toISOString().slice(0,10);
        await saveState(); render();
      } else if (action === "mark-final-sent") {
        const cl = state.clients[ui.clientId];
        cl.proposal.stage = "final";
        cl.proposal.finalSentDate = new Date().toISOString().slice(0,10);
        await saveState(); render();
      } else if (action === "mark-approved") {
        const cl = state.clients[ui.clientId];
        cl.proposal.stage = "approved";
        cl.proposal.approvedDate = new Date().toISOString().slice(0,10);
        cl.sow.status = "Drafting";
        syncTimelineFromDelivery(cl);
        await saveState(); render();
        notifyTeam(
          "Proposal approved: " + cl.name,
          cl.name + "'s proposal was approved on " + cl.proposal.approvedDate + ". SOW is now drafting.\n" +
          window.location.origin + window.location.pathname + "?client=" + cl.id
        );
      }
      else if (action === "save-intake") {
        const cl = state.clients[ui.clientId];
        if (!cl.intake.outbound) {
          const btn = el;
          btn.textContent = "Select an Outbound plan first";
          btn.style.background = "var(--danger)";
          setTimeout(() => { btn.textContent = "Save & continue to Overview →"; btn.style.background = ""; }, 1800);
          return;
        }
        cl.name = cl.intake.clientName || cl.name;
        if (!cl.people.clientPoc) cl.people.clientPoc = cl.intake.pocName;
        if (!cl.people.clientPocEmail) cl.people.clientPocEmail = cl.intake.pocEmail;
        await saveState();
        ui.tab = "overview";
        render();
      }
      else if (action === "add-weekly-update") {
        const cl = state.clients[ui.clientId];
        if (!cl.delivery) cl.delivery = { onboarding: [], weeklyUpdates: [] };
        cl.delivery.weeklyUpdates.push({ date: new Date().toISOString().slice(0,10), note: "" });
        await saveState(); render();
      } else if (action === "delete-weekly") {
        const cl = state.clients[ui.clientId];
        cl.delivery.weeklyUpdates.splice(+el.dataset.i, 1);
        await saveState(); render();
      }
      else if (action === "add-outcome") {
        const c = state.clients[ui.clientId];
        c.outcomes.push({ date: new Date().toISOString().slice(0,10), metric: "", target: "", actual: "" });
        await saveState();
        render();
      } else if (action === "delete-out") {
        const c = state.clients[ui.clientId];
        c.outcomes.splice(+el.dataset.i, 1);
        await saveState();
        render();
      }
  };
  window.__actionHandler = actionHandler;
  document.addEventListener("click", actionHandler);

  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  const save = debounce(saveState, 300);

  const simpleGroups = ["people", "channel", "icp", "drive", "integration", "intake"];
  simpleGroups.forEach(group => {
    document.querySelectorAll(`[data-${group}]`).forEach(el => {
      const commit = () => { state.clients[ui.clientId][group][el.dataset[group]] = el.value; };
      el.addEventListener("input", () => { commit(); save(); });
      if (el.tagName === "SELECT") el.addEventListener("change", () => { commit(); saveState(); render(); });
    });
  });

  document.querySelectorAll("[data-outbound-card]").forEach(el => {
    el.addEventListener("click", () => {
      state.clients[ui.clientId].intake.outbound = el.dataset.outboundCard;
      saveState(); render();
    });
  });

  // ==== Calling tab bindings ====
  // Lead field edits: use the central updateCallingLead(), which stamps call dates + writes audit log.
  // Live-committing on input for text fields would flood the log with every keystroke, so we save
  // on blur (change) for inputs, and immediately for selects/dates (single-action changes).
  document.querySelectorAll("[data-calling-lead][data-calling-field]").forEach(el => {
    var clientId = ui.view === "client" ? ui.clientId : (ui.callingSelectedClient || "");
    if (!clientId && ui.view === "dashboard") {
      // Dashboard mode: infer from the picker's current value
      var picker = document.querySelector("[data-calling-picker]");
      if (picker) clientId = picker.value;
    }
    if (!clientId) return;
    el.addEventListener("change", function() {
      var isStatusChange = el.dataset.callingField === "callingStatus";
      updateCallingLead(clientId, el.dataset.callingLead, el.dataset.callingField, el.value);
      // Status change reveals/hides the conditional column (follow-up date / meeting date / reason),
      // so re-render the table to update the DOM. Other field edits don't need a re-render.
      if (isStatusChange) render();
    });
  });

  // Filter controls: rebind on any change, re-render to apply.
  document.querySelectorAll("[data-calling-filter]").forEach(el => {
    el.addEventListener("input", function() {
      if (!ui.callingFilters) ui.callingFilters = { q: "", status: "", from: "", to: "" };
      ui.callingFilters[el.dataset.callingFilter] = el.value;
      render();
    });
  });

  // Report grouping switcher (day/week/month).
  document.querySelectorAll("[data-calling-report-group]").forEach(el => {
    el.addEventListener("change", function() { ui.callingReportGroup = el.value; render(); });
  });

  // Dashboard-only client picker.
  document.querySelectorAll("[data-calling-picker]").forEach(el => {
    el.addEventListener("change", function() { ui.callingSelectedClient = el.value; render(); });
  });

  document.querySelectorAll("[data-aeo-card]").forEach(el => {
    el.addEventListener("click", () => {
      const cl = state.clients[ui.clientId];
      cl.intake.aeo = cl.intake.aeo === el.dataset.aeoCard ? "" : el.dataset.aeoCard;
      saveState(); render();
    });
  });
  document.querySelectorAll("[data-delight-card]").forEach(el => {
    el.addEventListener("click", () => {
      const cl = state.clients[ui.clientId];
      cl.intake.delight = cl.intake.delight === el.dataset.delightCard ? "" : el.dataset.delightCard;
      saveState(); render();
    });
  });
  document.querySelectorAll("[data-addon-card]").forEach(el => {
    el.addEventListener("click", () => {
      const arr = state.clients[ui.clientId].intake.addons;
      const id = el.dataset.addonCard;
      const i = arr.indexOf(id);
      if (i >= 0) arr.splice(i, 1); else arr.push(id);
      saveState(); render();
    });
  });

  document.querySelectorAll("[data-delivery]").forEach(el => {
    var handler = function() {
      var cl = state.clients[ui.clientId];
      if (!cl.delivery) return;
      var idx = parseInt(el.dataset.delivery);
      cl.delivery.onboarding[idx][el.dataset.key] = el.value;
      if (el.dataset.key === "status") { syncTimelineFromDelivery(cl); saveState(); render(); } else { save(); }
    };
    el.addEventListener("input", handler);
    el.addEventListener("change", handler);
  });
  document.querySelectorAll("[data-weekly]").forEach(el => {
    el.addEventListener("input", function() {
      var cl = state.clients[ui.clientId];
      if (!cl.delivery) return;
      cl.delivery.weeklyUpdates[parseInt(el.dataset.weekly)][el.dataset.key] = el.value;
      save();
    });
  });

  document.querySelectorAll("[data-account-status]").forEach(el => {
    el.addEventListener("change", function() {
      var c = state.clients[el.dataset.accountStatus];
      if (!c) return;
      c.accountStatus = el.value;
      saveState(); render();
    });
  });
  document.querySelectorAll("[data-lost-mrr]").forEach(el => {
    el.addEventListener("input", function() {
      var c = state.clients[el.dataset.lostMrr];
      if (!c) return;
      c.lostMRR = el.value;
      save();
    });
  });

  document.querySelectorAll("[data-report]").forEach(el => {
    el.addEventListener("input", function() {
      if (!state.revenueActuals) state.revenueActuals = {};
      state.revenueActuals[el.dataset.report] = el.value;
      save();
    });
    el.addEventListener("change", function() {
      if (!state.revenueActuals) state.revenueActuals = {};
      state.revenueActuals[el.dataset.report] = el.value;
      saveState(); render();
    });
  });

  document.querySelectorAll("[data-prospect]").forEach(el => {
    var handler = function() {
      var p = state.prospects.find(function(x) { return x.id === el.dataset.prospect; });
      if (!p) return;
      p[el.dataset.key] = el.value;
      if (el.dataset.key === "status") { saveState(); render(); } else { save(); }
    };
    el.addEventListener("input", handler);
    el.addEventListener("change", handler);
  });

  var RESPONSE_UNLOCK_PIN = "0707";
  document.querySelectorAll("[data-response]").forEach(el => {
    var handler = function() {
      var r = (state.responses || []).find(function(x) { return x.id === el.dataset.response; });
      if (!r) return;
      if (el.dataset.key === "confirmed") {
        if (r.confirmed && !el.checked) {
          // Attempting to unlock a confirmed response - require the PIN.
          var pin = prompt("Enter the 4-digit PIN to unlock this response:");
          if (pin !== RESPONSE_UNLOCK_PIN) {
            el.checked = true; // revert - wrong or cancelled PIN
            if (pin !== null) alert("Incorrect PIN.");
            return;
          }
        }
        if (!r.confirmed && el.checked) {
          // Confirming for the first time - capture the field specific to this Client Status, if not
          // already filled in. Cancelling the prompt still lets confirmation proceed - the field just
          // stays blank and can be added later (after unlocking with the PIN).
          if (r.clientStatus === "Meeting Booked" && !r.meetingBookedDate) {
            var meetingDate = prompt("Meeting Booked - what's the meeting date? (YYYY-MM-DD)");
            if (meetingDate) r.meetingBookedDate = meetingDate;
          } else if (r.clientStatus === "No Fit" && !r.noFitReason) {
            var noFitReason = prompt("No Fit - what's the reason this isn't a fit?");
            if (noFitReason) r.noFitReason = noFitReason;
          }
        }
        r.confirmed = el.checked;
        saveState("responses"); render();
        return;
      }
      if (r.confirmed) return; // locked - all other fields are read-only while confirmed
      r[el.dataset.key] = el.dataset.type === "checkbox" ? el.checked : el.value;
      if (el.dataset.key === "heddlStatus" || el.dataset.key === "clientStatus" || el.dataset.key === "client") { saveState("responses"); render(); } else { save("responses"); }
    };
    el.addEventListener("input", handler);
    el.addEventListener("change", handler);
  });

  document.querySelectorAll("[data-billing]").forEach(el => {
    var handler = function() {
      if (!state.responseBilling) state.responseBilling = {};
      var client = el.dataset.billing;
      if (!state.responseBilling[client]) state.responseBilling[client] = { amount: "", billed: false, paid: false };
      state.responseBilling[client][el.dataset.key] = el.dataset.type === "checkbox" ? el.checked : el.value;
      if (el.dataset.type === "checkbox") { saveState("responseBilling"); render(); } else { save("responseBilling"); }
    };
    el.addEventListener("input", handler);
    el.addEventListener("change", handler);
  });

  document.querySelectorAll('[data-action="filter-response"]').forEach(el => {
    el.addEventListener("change", () => {
      if (!ui.responseFilters) ui.responseFilters = { client: "", heddlStatus: "", clientStatus: "", confirmed: "" };
      ui.responseFilters[el.dataset.filter] = el.value;
      render();
    });
  });
  document.querySelectorAll('[data-action="filter-campaign"]').forEach(el => {
    el.addEventListener("change", () => {
      if (!ui.campaignFilters) ui.campaignFilters = { client: "" };
      ui.campaignFilters[el.dataset.filter] = el.value;
      render();
    });
  });
  document.querySelectorAll("[data-campaign]").forEach(el => {
    var handler = function() {
      var c = (state.campaigns || []).find(function(x) { return x.id === el.dataset.campaign; });
      if (!c) return;
      var isNumeric = ["totalContacts","accepted","messagesSent","emailsSent","inmailsSent","replies","reactions","pending"].indexOf(el.dataset.key) !== -1;
      c[el.dataset.key] = isNumeric ? (parseInt(el.value, 10) || 0) : el.value;
      if (el.dataset.key === "client") { saveState("campaigns"); render(); } else { save("campaigns"); }
    };
    el.addEventListener("input", handler);
    el.addEventListener("change", handler);
  });
  document.querySelectorAll('[data-action="load-response-view"]').forEach(el => {
    el.addEventListener("change", () => {
      if (el.value === "") return;
      var view = (state.responseSavedViews || [])[+el.value];
      if (view) { ui.responseFilters = Object.assign({ client: "", heddlStatus: "", clientStatus: "", confirmed: "" }, view.filters); render(); }
    });
  });

  document.querySelectorAll("[data-proposal]").forEach(el => {
    el.addEventListener("input", () => {
      if (!state.clients[ui.clientId].proposal) return;
      state.clients[ui.clientId].proposal[el.dataset.proposal] = el.value;
      save();
    });
  });

  document.querySelectorAll("[data-gtme]").forEach(el => {
    el.addEventListener("change", () => {
      const match = GTME_ROSTER.find(m => m.name === el.value);
      const cl = state.clients[ui.clientId];
      cl.people.gtme = el.value;
      cl.people.gtmeEmail = match ? match.email : "";
      saveState(); render();
    });
  });

  document.querySelectorAll("[data-goal]").forEach(el => {
    el.addEventListener("input", () => {
      const [month, metric] = el.dataset.goal.split(".");
      state.clients[ui.clientId].goals[month][metric] = el.value;
      save();
    });
  });
  document.querySelectorAll("[data-goalline]").forEach(el => {
    el.addEventListener("input", () => {
      const [lineIdx, month, metric] = el.dataset.goalline.split(".");
      state.clients[ui.clientId].goalLines[+lineIdx].goals[month][metric] = el.value;
      save();
    });
  });
  document.querySelectorAll("[data-stage]").forEach(el => {
    el.addEventListener("change", () => {
      const s = state.clients[ui.clientId].stages[+el.dataset.stage];
      s[el.dataset.key] = el.value;
      saveState(); render();
    });
    el.addEventListener("input", () => {
      const s = state.clients[ui.clientId].stages[+el.dataset.stage];
      s[el.dataset.key] = el.value;
      save();
    });
  });
  document.querySelectorAll("[data-out]").forEach(el => {
    el.addEventListener("input", () => {
      const o = state.clients[ui.clientId].outcomes[+el.dataset.out];
      o[el.dataset.key] = el.value;
      save();
    });
  });
}

function escapeHTML(s) { return String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function escapeAttr(s) { return escapeHTML(s); }

function applyClientViewRouting() {
  var params = new URLSearchParams(window.location.search);
  var cid = params.get("client");
  if (cid && state.clients[cid] && !ui.isAuth) {
    isClientView = true;
    clientViewId = cid;
    ui.clientId = cid;
    ui.view = "client";
    if (CLIENT_TAB_IDS.indexOf(ui.tab) === -1) ui.tab = "client-outcomes";
  }
}

(async function init() {
  initFirebase();
  if (!useFirebase) {
    await loadState();
  }
  // When useFirebase is true, clientsRef.on("value", ...) in initFirebase() populates
  // state.clients reactively and calls render() itself once data arrives - no blind wait needed.

  applyClientViewRouting();
  render();
})();
</script>
</body>
</html>
