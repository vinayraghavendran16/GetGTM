var RESPONSE_STATUSES = ["Positive Reply", "Meeting Booked", "No Fit", "Not Interested"];

function responseStatusColor(status) {
  if (status === "Positive Reply") return { bg: "#dcfce7", color: "#15803d" };
  if (status === "Meeting Booked") return { bg: "#dbeafe", color: "#1d4ed8" };
  if (status === "No Fit") return { bg: "#fef3c7", color: "#b45309" };
  if (status === "Not Interested") return { bg: "#fee2e2", color: "#b91c1c" };
  return { bg: "var(--surface-1)", color: "var(--text-secondary)" };
}

var PROSPECT_STATUSES = ["New", "Contacted", "Follow-up Sent", "In Conversation", "Objection Handling",
  "Proposal Requested", "Kickoff Scheduled", "Stalled", "Closed Lost", "Not a Fit", "Converted"];

function renderProspectsView() {
  const prospects = (state.prospects || []).slice().sort((a,b) => (b.dateContacted||"").localeCompare(a.dateContacted||""));
  const active = prospects.filter(p => !["Stalled","Closed Lost","Not a Fit","Converted"].includes(p.status)).length;
  const stalled = prospects.filter(p => p.status === "Stalled").length;
  const converted = prospects.filter(p => p.status === "Converted").length;
  const potentialMRR = prospects
    .filter(p => !["Stalled","Closed Lost","Not a Fit","Converted"].includes(p.status))
    .reduce((sum, p) => sum + (parseFloat(p.potentialValue) || 0), 0);

  return `
      <div class="kpis">
        <div class="kpi"><div class="label">Total prospects</div><div class="value">${prospects.length}</div></div>
        <div class="kpi"><div class="label">Active</div><div class="value">${active}</div></div>
        <div class="kpi"><div class="label">Stalled</div><div class="value" style="color:${stalled?'var(--danger)':'inherit'}">${stalled}</div></div>
        <div class="kpi"><div class="label">Converted</div><div class="value" style="color:var(--success)">${converted}</div></div>
        <div class="kpi"><div class="label">Potential MRR if converted</div><div class="value" style="color:var(--brand)">$${potentialMRR.toLocaleString()}</div></div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>Prospects</h2>
          <div style="display:flex;gap:8px">
            <button class="btn ghost sm" data-action="refresh-prospects">↻ Refresh from Gmail</button>
            <button class="btn" data-action="add-prospect">+ Add prospect</button>
          </div>
        </div>
        <div class="card-body" style="padding:0">
          <div class="small" style="padding:12px 16px;border-bottom:0.5px solid var(--border)">
            ${state.lastGmailRefresh ? 'Last refreshed ' + escapeHTML(state.lastGmailRefresh) + '. ' : ''}Threads where Rajiv led, looped Vinay in, Sean led, or Vinay/Sean reached out directly. Click Refresh to pull the latest - adds anything new and updates existing rows if their conversation has moved since last check. Never duplicates. Potential monthly value is manual - no package is signed yet, so nothing is assumed.
          </div>
          ${prospects.length === 0 ? `<div style="padding:20px;text-align:center;color:var(--text-secondary)">No prospects yet.</div>` : `
            <table>
              <thead><tr>
                <th>Name / Company</th><th>Date contacted</th><th>Status</th><th>Potential $/mo</th><th>Next step</th><th>Source</th><th></th>
              </tr></thead>
              <tbody>
                ${prospects.map(p => {
                  const matchedClient = Object.values(state.clients).find(c => c.name.trim().toLowerCase() === (p.company || "").trim().toLowerCase());
                  const convertCell = p.status === "Converted"
                    ? (matchedClient
                        ? `<button class="btn ghost sm" onclick="window.openClient('${matchedClient.id}')">Open engagement</button>`
                        : `<span class="small" style="color:var(--text-muted)">Converted</span>`)
                    : matchedClient
                      ? `<div><button class="btn ghost sm" onclick="window.openClient('${matchedClient.id}')">Open engagement</button><div class="small" style="color:var(--text-muted);margin-top:2px">Already has one</div></div>`
                      : `<button class="btn sm" data-action="convert-prospect" data-id="${p.id}">Convert →</button>`;
                  return `
                  <tr>
                    <td><strong>${escapeHTML(p.name)}</strong><div class="small">${escapeHTML(p.company)}</div></td>
                    <td><input type="date" data-prospect="${p.id}" data-key="dateContacted" value="${escapeAttr(p.dateContacted)}" style="border:none;background:transparent;padding:0;width:120px"></td>
                    <td>
                      <select data-prospect="${p.id}" data-key="status" class="del-select">
                        ${PROSPECT_STATUSES.map(s => `<option ${p.status===s?'selected':''}>${s}</option>`).join("")}
                      </select>
                    </td>
                    <td><input type="number" placeholder="-" data-prospect="${p.id}" data-key="potentialValue" value="${escapeAttr(p.potentialValue || "")}" style="width:90px;border:0.5px solid var(--border);border-radius:4px;padding:4px 6px;background:var(--surface-1)"></td>
                    <td><input data-prospect="${p.id}" data-key="nextStep" value="${escapeAttr(p.nextStep)}" style="border:none;background:transparent;padding:0;width:200px"></td>
                    <td><div class="small">${escapeHTML(p.source)}</div></td>
                    <td><div class="row-actions">${convertCell}<button class="btn ghost sm" data-action="delete-prospect" data-id="${p.id}">&#128465; Remove</button></div></td>
                  </tr>
                  ${p.notes ? `<tr><td colspan="7" style="padding-top:0"><div class="small" style="color:var(--text-muted);padding:0 0 8px">${escapeHTML(p.notes)}</div></td></tr>` : ""}
                `;}).join("")}
              </tbody>
            </table>
          `}
        </div>
      </div>
  `;
}

function renderResponsesView() {
  var allResponses = (state.responses || []).slice().sort((a,b) => (b.date||"").localeCompare(a.date||""));
  var clientNames = Object.values(state.clients).map(function(c) { return c.name; }).sort();
  var savedViews = state.responseSavedViews || [];
  var f = ui.responseFilters || { client: "", heddlStatus: "", clientStatus: "", confirmed: "" };

  var responses = allResponses.filter(function(r) {
    if (f.client && r.client !== f.client) return false;
    if (f.heddlStatus && r.heddlStatus !== f.heddlStatus) return false;
    if (f.clientStatus && r.clientStatus !== f.clientStatus) return false;
    if (f.confirmed === "yes" && !r.confirmed) return false;
    if (f.confirmed === "no" && r.confirmed) return false;
    return true;
  });

  var heddlCounts = { "Positive Reply": 0, "Meeting Booked": 0, "No Fit": 0, "Not Interested": 0 };
  responses.forEach(function(r) { if (heddlCounts[r.heddlStatus] !== undefined) heddlCounts[r.heddlStatus]++; });
  var confirmedCount = responses.filter(function(r) { return r.confirmed; }).length;
  var anyFilterActive = f.client || f.heddlStatus || f.clientStatus || f.confirmed;

  function statusSelectHtml(r, key, options, placeholder) {
    var val = r[key];
    var c = responseStatusColor(val);
    return '<select data-response="' + r.id + '" data-key="' + key + '" class="del-select" style="background:' + c.bg + ';color:' + c.color + ';font-weight:600;border-color:transparent">' +
      '<option value="">' + placeholder + '</option>' +
      options.map(function(s) { return '<option ' + (val===s?'selected':'') + '>' + s + '</option>'; }).join("") +
      '</select>';
  }

  return `
      <div class="kpis">
        <div class="kpi"><div class="label">${anyFilterActive ? 'Responses (filtered)' : 'Total responses logged'}</div><div class="value">${responses.length}${anyFilterActive ? ' / ' + allResponses.length : ''}</div></div>
        <div class="kpi"><div class="label">Positive replies (Heddl)</div><div class="value" style="color:var(--success)">${heddlCounts["Positive Reply"]}</div></div>
        <div class="kpi"><div class="label">Meetings booked (Heddl)</div><div class="value" style="color:var(--brand)">${heddlCounts["Meeting Booked"]}</div></div>
        <div class="kpi"><div class="label">Client confirmed</div><div class="value" style="color:var(--text-secondary)">${confirmedCount} / ${responses.length}</div></div>
      </div>

      <div class="card" style="margin-bottom:16px">
        <div class="card-body" style="padding:14px 18px">
          <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end">
            <div>
              <label class="small" style="display:block;margin-bottom:4px;font-weight:600">Account</label>
              <select data-action="filter-response" data-filter="client" style="padding:6px 10px;border:1px solid var(--brand);border-radius:5px;background:var(--surface-1);min-width:160px;font-weight:600">
                <option value="">All accounts</option>
                ${clientNames.map(function(n) { return `<option value="${escapeAttr(n)}" ${f.client===n?'selected':''}>${escapeHTML(n)}</option>`; }).join("")}
              </select>
            </div>
            <div style="width:1px;align-self:stretch;background:var(--border);margin:0 2px"></div>
            <div>
              <label class="small" style="display:block;margin-bottom:4px">Heddl Status</label>
              <select data-action="filter-response" data-filter="heddlStatus" style="padding:6px 10px;border:0.5px solid var(--border);border-radius:5px;background:var(--surface-1);min-width:140px">
                <option value="">All</option>
                ${RESPONSE_STATUSES.map(function(s) { return `<option ${f.heddlStatus===s?'selected':''}>${s}</option>`; }).join("")}
              </select>
            </div>
            <div>
              <label class="small" style="display:block;margin-bottom:4px">Client Status</label>
              <select data-action="filter-response" data-filter="clientStatus" style="padding:6px 10px;border:0.5px solid var(--border);border-radius:5px;background:var(--surface-1);min-width:140px">
                <option value="">All</option>
                ${RESPONSE_STATUSES.map(function(s) { return `<option ${f.clientStatus===s?'selected':''}>${s}</option>`; }).join("")}
              </select>
            </div>
            <div>
              <label class="small" style="display:block;margin-bottom:4px">Confirmed</label>
              <select data-action="filter-response" data-filter="confirmed" style="padding:6px 10px;border:0.5px solid var(--border);border-radius:5px;background:var(--surface-1);min-width:120px">
                <option value="">All</option>
                <option value="yes" ${f.confirmed==='yes'?'selected':''}>Confirmed</option>
                <option value="no" ${f.confirmed==='no'?'selected':''}>Not confirmed</option>
              </select>
            </div>
            ${anyFilterActive ? '<button class="btn ghost sm" data-action="clear-response-filters">Clear filters</button>' : ''}
            <div style="margin-left:auto;display:flex;gap:8px;align-items:flex-end">
              ${savedViews.length > 0 ? `
              <div>
                <label class="small" style="display:block;margin-bottom:4px">Saved views</label>
                <select data-action="load-response-view" style="padding:6px 10px;border:0.5px solid var(--border);border-radius:5px;background:var(--surface-1);min-width:140px">
                  <option value="">Load a view...</option>
                  ${savedViews.map(function(v, vi) { return `<option value="${vi}">${escapeHTML(v.name)}</option>`; }).join("")}
                </select>
              </div>` : ''}
              <button class="btn ghost sm" data-action="save-response-view">💾 Save view</button>
            </div>
          </div>
          ${savedViews.length > 0 ? `
          <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
            ${savedViews.map(function(v, vi) { return `<span class="badge pending" style="display:inline-flex;align-items:center;gap:6px;cursor:pointer" data-action="load-response-view-chip" data-view-index="${vi}">${escapeHTML(v.name)} <span data-action="delete-response-view" data-view-index="${vi}" style="opacity:0.6">&times;</span></span>`; }).join("")}
          </div>` : ''}
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>Response Tracker</h2>
          <div style="display:flex;gap:8px">
            <button class="btn ghost sm" data-action="check-response-drive">📷 Check for new replies</button>
            <button class="btn" data-action="add-response">+ Add response</button>
          </div>
        </div>
        <div class="card-body" style="padding:0">
          <div class="small" style="padding:12px 16px;border-bottom:0.5px solid var(--border)">
            Existing records here sync live - no need to refresh to see them or anyone's edits. Screenshots live in per-client folders in Drive; ask Claude to check them and it reads each new one, adds a row with date/client/contact/notes filled in, and sets <strong>Heddl Status</strong> automatically from what the reply shows. <strong>Client Status</strong> and <strong>Confirmed</strong> are always set manually, once you've worked with the client to agree on classification.
          </div>
          ${responses.length === 0 ? `<div style="padding:20px;text-align:center;color:var(--text-secondary)">${anyFilterActive ? 'No responses match the current filters.' : 'No responses logged yet.'}</div>` : `
            <table>
              <thead><tr><th>Date</th><th>Account / Contact</th><th>Heddl Status</th><th>Client Status</th><th>Confirmed</th><th>Notes</th><th>Screenshot ref</th><th></th></tr></thead>
              <tbody>
                ${responses.map(function(r, i) {
                  var locked = !!r.confirmed;
                  var lockAttr = locked ? 'disabled' : '';
                  var lockStyle = locked ? 'opacity:0.65;cursor:not-allowed' : '';
                  return `
                  <tr${locked ? ' style="background:var(--surface-1)"' : ''}>
                    <td><input type="date" ${lockAttr} data-response="${r.id}" data-key="date" value="${escapeAttr(r.date)}" style="border:none;background:transparent;padding:0;width:120px;${lockStyle}"></td>
                    <td>
                      <select ${lockAttr} data-response="${r.id}" data-key="client" class="del-select" style="${lockStyle}">
                        <option value="">-</option>
                        ${clientNames.map(function(n) { return `<option ${r.client===n?'selected':''}>${escapeHTML(n)}</option>`; }).join("")}
                      </select>
                      <input ${lockAttr} data-response="${r.id}" data-key="contact" value="${escapeAttr(r.contact)}" placeholder="Contact name" style="border:none;background:transparent;padding:2px 0 0;width:100%;font-size:12px;color:var(--text-secondary);${lockStyle}">
                    </td>
                    <td>${locked ? '<span style="' + (function(){var c=responseStatusColor(r.heddlStatus);return 'background:'+c.bg+';color:'+c.color;})() + ';font-weight:600;padding:3px 8px;border-radius:4px;font-size:12px;display:inline-block">' + escapeHTML(r.heddlStatus||'-') + '</span>' : statusSelectHtml(r, "heddlStatus", RESPONSE_STATUSES, "-")}</td>
                    <td>${locked ? '<span style="' + (function(){var c=responseStatusColor(r.clientStatus);return 'background:'+c.bg+';color:'+c.color;})() + ';font-weight:600;padding:3px 8px;border-radius:4px;font-size:12px;display:inline-block">' + escapeHTML(r.clientStatus||'Not set') + '</span>' : statusSelectHtml(r, "clientStatus", RESPONSE_STATUSES, "Not set")}</td>
                    <td style="text-align:center">
                      <input type="checkbox" data-response="${r.id}" data-key="confirmed" data-type="checkbox" ${r.confirmed ? 'checked' : ''} style="width:16px;height:16px;cursor:pointer">
                      ${locked ? '<div class="small" style="color:var(--text-muted);margin-top:2px">🔒 locked</div>' : ''}
                    </td>
                    <td><input ${lockAttr} data-response="${r.id}" data-key="notes" value="${escapeAttr(r.notes)}" placeholder="Context" style="border:none;background:transparent;padding:0;width:180px;${lockStyle}"></td>
                    <td><input ${lockAttr} data-response="${r.id}" data-key="screenshotRef" value="${escapeAttr(r.screenshotRef)}" placeholder="Filename or link" style="border:none;background:transparent;padding:0;width:140px;${lockStyle}"></td>
                    <td><button class="btn ghost sm" data-action="delete-response" data-id="${r.id}" ${lockAttr}>&#128465;</button></td>
                  </tr>
                `;}).join("")}
              </tbody>
            </table>
          `}
        </div>
      </div>
  `;
}

function reportKey(clientName, monthLabel) { return clientName + "__" + monthLabel; }

function renderReportingView() {
  if (!state.revenueActuals) state.revenueActuals = {};
  if (!state.responses) state.responses = [];
  var names = Object.keys(REVENUE_CONTRACTS);
  var today = new Date();
  var ACCOUNT_STATUSES = ["Onboarding", "Active", "At Risk", "Paused", "Renewed", "Churned"];

  var totalBase = 0, totalMax = 0, totalActual = 0, actualEntries = 0;
  var mrr = 0, mrrMax = 0, churnedCount = 0, churnedMRR = 0;

  var clientBlocks = names.map(function(name) {
    var contract = REVENUE_CONTRACTS[name];
    var c = Object.values(state.clients).find(function(cl) { return cl.name === name; });
    var status = c ? (c.accountStatus || "") : "";
    var clientBase = 0, clientMax = 0;

    if (status === "Churned") {
      churnedCount++;
      var lost = c && c.lostMRR ? parseFloat(c.lostMRR) : 0;
      if (!isNaN(lost)) churnedMRR += lost;
    }

    var rows = contract.schedule.map(function(row) {
      var key = reportKey(name, row.label);
      var actualVal = state.revenueActuals[key] || "";
      clientBase += row.base;
      clientMax += row.max;
      totalBase += row.base;
      totalMax += row.max;
      if (actualVal !== "" && !isNaN(parseFloat(actualVal))) { totalActual += parseFloat(actualVal); actualEntries++; }

      var isCurrent = row.start && row.end && today >= new Date(row.start) && today <= new Date(row.end + "T23:59:59");
      if (isCurrent && status && ["Onboarding","Active","At Risk","Renewed"].indexOf(status) !== -1) {
        mrr += (actualVal !== "" && !isNaN(parseFloat(actualVal))) ? parseFloat(actualVal) : row.base;
        mrrMax += row.max;
      }

      return '<tr' + (isCurrent ? ' style="background:var(--surface-1)"' : '') + '>' +
        '<td><strong>' + escapeHTML(row.label) + (isCurrent ? ' <span class="badge done" style="font-size:9px">Current</span>' : '') + '</strong><div class="small">' + escapeHTML(row.period) + '</div></td>' +
        '<td>$' + row.base.toLocaleString() + '</td>' +
        '<td>$' + row.max.toLocaleString() + '</td>' +
        '<td><input type="number" placeholder="-" data-report="' + escapeAttr(key) + '" value="' + escapeAttr(actualVal) + '" style="width:90px;border:0.5px solid var(--border);border-radius:4px;padding:4px 6px;background:var(--surface-1)"></td>' +
        '<td><div class="small">' + escapeHTML(row.formula) + '</div></td>' +
        '</tr>';
    }).join("");

    var noContract = contract.schedule.length === 0;

    var statusDropdown = c ? (
      '<select data-account-status="' + c.id + '" style="font-size:11px;padding:4px 8px;border:0.5px solid var(--border);border-radius:4px;background:var(--surface-1)">' +
        '<option value="">Not set</option>' +
        ACCOUNT_STATUSES.map(function(s) { return '<option value="' + s + '"' + (status === s ? ' selected' : '') + '>' + s + '</option>'; }).join("") +
      '</select>'
    ) : '';

    var lostMrrInput = (c && status === "Churned") ?
      '<div style="margin-top:8px"><label class="small">Lost MRR ($/mo)</label><br><input type="number" placeholder="0" data-lost-mrr="' + c.id + '" value="' + escapeAttr(c.lostMRR || "") + '" style="width:120px;border:0.5px solid var(--border);border-radius:4px;padding:4px 6px;background:var(--surface-1);margin-top:2px"></div>' : '';

    var sourceLine = contract.sourceUrl
      ? '<div class="small" style="margin-top:4px;color:var(--text-muted)">Source: <a href="' + escapeAttr(contract.sourceUrl) + '" target="_blank" style="color:var(--brand)">' + escapeHTML(contract.sourceDoc) + '</a></div>'
      : '<div class="small" style="margin-top:4px;color:var(--text-muted)">Source: ' + escapeHTML(contract.sourceDoc) + '</div>';

    return '<div class="card" style="margin-bottom:16px">' +
      '<div class="card-head"><div>' +
        '<h2>' + escapeHTML(name) + (contract.confirmed ? '' : ' <span class="badge pending" style="margin-left:6px">Unconfirmed</span>') + '</h2>' +
        '<div class="sub">' + (contract.agreementDate ? 'Signed ' + escapeHTML(contract.agreementDate) + ' - ' : '') + escapeHTML(contract.term) + '</div>' +
      '</div>' +
      (c ? '<div>' + statusDropdown + lostMrrInput + '</div>' : '') +
      '</div>' +
      '<div class="card-body">' +
      (noContract ?
        '<div class="small" style="padding:8px 0;color:var(--text-muted)">' + escapeHTML(contract.notes) + '</div>' :
        '<table><thead><tr><th>Month</th><th>Contracted base</th><th>Contracted max</th><th>Actual invoiced</th><th>Formula</th></tr></thead>' +
        '<tbody>' + rows +
        '<tr style="border-top:1px solid var(--border)"><td><strong>Total</strong></td><td><strong>$' + clientBase.toLocaleString() + '</strong></td><td><strong>$' + clientMax.toLocaleString() + '</strong></td><td></td><td></td></tr>' +
        '</tbody></table>' +
        '<div class="small" style="margin-top:10px;color:var(--text-muted)">' + escapeHTML(contract.notes) + '</div>' +
        sourceLine
      ) +
      '</div></div>';
  }).join("");

  var prospectPotentialMRR = (state.prospects || [])
    .filter(function(p) { return ["Stalled","Closed Lost","Not a Fit","Converted"].indexOf(p.status) === -1; })
    .reduce(function(sum, p) { var v = parseFloat(p.potentialValue); return sum + (isNaN(v) ? 0 : v); }, 0);

  return `
      <div class="kpis">
        <div class="kpi"><div class="label">MRR (current month, active)</div><div class="value" style="color:var(--brand)">$${mrr.toLocaleString()}</div></div>
        <div class="kpi"><div class="label">MRR max (full performance)</div><div class="value" style="color:var(--brand)">$${mrrMax.toLocaleString()}</div></div>
        <div class="kpi"><div class="label">Potential MRR from prospects</div><div class="value">$${prospectPotentialMRR.toLocaleString()}</div></div>
        <div class="kpi"><div class="label">Contracted base (all accounts)</div><div class="value">$${totalBase.toLocaleString()}</div></div>
        <div class="kpi"><div class="label">Contracted max (with performance)</div><div class="value">$${totalMax.toLocaleString()}</div></div>
        <div class="kpi"><div class="label">Actual entered so far</div><div class="value" style="color:var(--success)">$${totalActual.toLocaleString()}</div></div>
        <div class="kpi"><div class="label">Churned accounts</div><div class="value" style="color:${churnedCount?'var(--danger)':'inherit'}">${churnedCount}</div></div>
        <div class="kpi"><div class="label">MRR lost to churn</div><div class="value" style="color:${churnedMRR?'var(--danger)':'inherit'}">$${churnedMRR.toLocaleString()}</div></div>
      </div>
      <div class="small" style="margin-bottom:16px;color:var(--text-secondary)">MRR sums the current calendar month's contracted base (or actual, if entered) across accounts with status Onboarding, Active, At Risk, or Renewed. MRR max assumes full performance/bonus attainment on those same accounts this month. Potential MRR from prospects is manually entered per prospect (in the Prospects tab) since no package is signed yet - nothing here is assumed. Paused and Churned accounts are excluded from MRR. Set each account's status in its card below - status is only auto-set once; after that it's yours to manage.</div>
      ${renderGoalsAchievedBlock()}
      ${renderResponseRollupBlock()}
      ${clientBlocks}
  `;
}

function renderGoalsAchievedBlock() {
  var rows = [];
  var multiLineClients = [];
  Object.values(state.clients).forEach(function(c) {
    if (!c.proposal || c.proposal.stage !== "approved") return;

    if (c.goalLines && c.goalLines.length > 0) {
      multiLineClients.push(c.name);
      // Per-line rows
      c.goalLines.forEach(function(line) {
        ["m1","m2","m3"].forEach(function(m) {
          var gm = line.goals[m];
          if (!gm) return;
          [["Positive replies", gm.replies, gm.achievedReplies], ["Meetings booked", gm.meetings, gm.achievedMeetings]].forEach(function(pair) {
            var metric = pair[0], target = pair[1], achieved = pair[2];
            if (!target && !achieved) return;
            rows.push({ client: c.name, line: line.name, month: m.toUpperCase(), metric: metric, target: target, achieved: achieved });
          });
        });
      });
      // Combined rollup row per month/metric, summed across all lines
      ["m1","m2","m3"].forEach(function(m) {
        [["Positive replies", "replies", "achievedReplies"], ["Meetings booked", "meetings", "achievedMeetings"]].forEach(function(pair) {
          var metric = pair[0], tKey = pair[1], aKey = pair[2];
          var tSum = 0, aSum = 0, anyT = false, anyA = false;
          c.goalLines.forEach(function(line) {
            var t = parseFloat(line.goals[m][tKey]), a = parseFloat(line.goals[m][aKey]);
            if (!isNaN(t)) { tSum += t; anyT = true; }
            if (!isNaN(a)) { aSum += a; anyA = true; }
          });
          if (!anyT && !anyA) return;
          rows.push({ client: c.name, line: "Combined", month: m.toUpperCase(), metric: metric,
            target: anyT ? String(tSum) : "", achieved: anyA ? String(aSum) : "", isRollup: true });
        });
      });
    } else if (c.goals) {
      ["m1","m2","m3"].forEach(function(m) {
        var gm = c.goals[m];
        if (!gm) return;
        [["Positive replies", gm.replies, gm.achievedReplies], ["Meetings booked", gm.meetings, gm.achievedMeetings]].forEach(function(pair) {
          var metric = pair[0], target = pair[1], achieved = pair[2];
          if (!target && !achieved) return;
          rows.push({ client: c.name, line: "-", month: m.toUpperCase(), metric: metric, target: target, achieved: achieved });
        });
      });
    }
  });

  if (rows.length === 0) {
    return '<div class="card" style="margin-bottom:16px"><div class="card-head"><h2>Goals vs. Achieved</h2></div>' +
      '<div class="card-body"><div class="small" style="color:var(--text-muted)">No monthly goals set yet across any client. Add targets in each client Overview tab and they will show up here.</div></div></div>';
  }

  var tableRows = rows.map(function(r) {
    var tNum = parseFloat(r.target), aNum = parseFloat(r.achieved);
    var pctHtml = '<span class="small" style="color:var(--text-muted)">-</span>';
    if (tNum && !isNaN(tNum) && !isNaN(aNum)) {
      var pct = Math.round((aNum / tNum) * 100);
      var color = pct >= 100 ? "var(--success)" : pct >= 60 ? "var(--brand)" : "var(--danger)";
      pctHtml = '<strong style="color:' + color + '">' + pct + '%</strong>';
    }
    return '<tr' + (r.isRollup ? ' style="background:var(--surface-1);font-weight:600"' : '') + '>' +
      '<td><strong>' + escapeHTML(r.client) + '</strong></td>' +
      '<td>' + escapeHTML(r.line || "-") + '</td>' +
      '<td>' + escapeHTML(r.month) + '</td>' +
      '<td>' + escapeHTML(r.metric) + '</td>' +
      '<td>' + escapeHTML(r.target || "-") + '</td>' +
      '<td>' + escapeHTML(r.achieved || "-") + '</td>' +
      '<td>' + pctHtml + '</td>' +
      '</tr>';
  }).join("");

  var note = multiLineClients.length > 0
    ? '<div class="small" style="padding:10px 16px;border-top:0.5px solid var(--border);color:var(--text-muted)">' +
      '<strong>' + multiLineClients.map(escapeHTML).join(", ") + '</strong> ' + (multiLineClients.length === 1 ? "has" : "have") +
      ' independent KPI lines per their signed contract (separate product lines, each assessed independently). ' +
      'Each line is shown individually, with a <strong>Combined</strong> row summing both for a portfolio-level view.</div>'
    : '';

  return '<div class="card" style="margin-bottom:16px">' +
    '<div class="card-head"><div><h2>Goals vs. Achieved</h2><div class="sub">Every client with monthly targets set, across M1/M2/M3 - Achieved here is entered manually per month</div></div></div>' +
    '<div class="card-body" style="padding:0">' +
    '<table><thead><tr><th>Client</th><th>Line</th><th>Month</th><th>Metric</th><th>Target</th><th>Achieved</th><th>% Achieved</th></tr></thead>' +
    '<tbody>' + tableRows + '</tbody></table>' +
    note +
    '<div class="small" style="padding:10px 16px;border-top:0.5px solid var(--border);color:var(--text-muted)">For achievement based only on client-confirmed replies (not monthly targets), see <strong>Confirmed Achievement &amp; Billing</strong> below - it counts only responses marked Confirmed in the Responses tab.</div>' +
    '</div></div>';
}

function renderResponseRollupBlock() {
  var responses = state.responses || [];
  if (!state.responseBilling) state.responseBilling = {};
  if (responses.length === 0) {
    return '<div class="card" style="margin-bottom:16px"><div class="card-head"><h2>Confirmed Achievement &amp; Billing</h2></div>' +
      '<div class="card-body"><div class="small" style="color:var(--text-muted)">No responses logged yet. Log them from the Responses tab, or ask Claude to check the response screenshots Drive folder.</div></div></div>';
  }

  var byClient = {};
  responses.forEach(function(r) {
    var key = r.client || "(Unassigned)";
    if (!byClient[key]) byClient[key] = { confirmedPositive: 0, confirmedMeetings: 0, totalConfirmed: 0, total: 0 };
    byClient[key].total++;
    if (!r.confirmed) return; // only confirmed responses count toward achievement/billing
    // Client Status is the agreed-upon final classification once confirmed; fall back to Heddl Status if not set.
    var finalStatus = r.clientStatus || r.heddlStatus;
    if (finalStatus === "Positive Reply") byClient[key].confirmedPositive++;
    if (finalStatus === "Meeting Booked") byClient[key].confirmedMeetings++;
    byClient[key].totalConfirmed++;
  });

  var clientKeys = Object.keys(byClient).sort();
  var totalBillAmount = 0, totalConfirmed = 0, totalBilled = 0, totalPaid = 0;

  var rows = clientKeys.map(function(client) {
    var c = byClient[client];
    var billing = state.responseBilling[client] || { amount: "", billed: false, paid: false };
    var amt = parseFloat(billing.amount);
    if (!isNaN(amt)) totalBillAmount += amt;
    totalConfirmed += c.totalConfirmed;
    if (billing.billed) totalBilled++;
    if (billing.paid) totalPaid++;
    return '<tr>' +
      '<td><strong>' + escapeHTML(client) + '</strong></td>' +
      '<td>' + c.confirmedPositive + '</td>' +
      '<td>' + c.confirmedMeetings + '</td>' +
      '<td>' + c.totalConfirmed + ' / ' + c.total + '</td>' +
      '<td><input type="number" placeholder="0" data-billing="' + escapeAttr(client) + '" data-key="amount" value="' + escapeAttr(billing.amount || "") + '" style="width:100px;border:0.5px solid var(--border);border-radius:4px;padding:4px 6px;background:var(--surface-1)"></td>' +
      '<td style="text-align:center"><input type="checkbox" data-billing="' + escapeAttr(client) + '" data-key="billed" data-type="checkbox" ' + (billing.billed ? 'checked' : '') + ' style="width:16px;height:16px;cursor:pointer"></td>' +
      '<td style="text-align:center"><input type="checkbox" data-billing="' + escapeAttr(client) + '" data-key="paid" data-type="checkbox" ' + (billing.paid ? 'checked' : '') + ' style="width:16px;height:16px;cursor:pointer"></td>' +
      '</tr>';
  }).join("");

  var totalRow = '<tr style="border-top:1px solid var(--border);background:var(--surface-1);font-weight:600">' +
    '<td>Total</td><td></td><td></td><td>' + totalConfirmed + '</td>' +
    '<td>$' + totalBillAmount.toLocaleString() + '</td>' +
    '<td style="text-align:center">' + totalBilled + ' / ' + clientKeys.length + '</td>' +
    '<td style="text-align:center">' + totalPaid + ' / ' + clientKeys.length + '</td>' +
    '</tr>';

  return '<div class="card" style="margin-bottom:16px">' +
    '<div class="card-head"><div><h2>Confirmed Achievement &amp; Billing</h2><div class="sub">Only Confirmed responses count here - grouped by account, with billing status and totals</div></div></div>' +
    '<div class="card-body" style="padding:0">' +
    '<table><thead><tr><th>Client</th><th>Confirmed Positive Reply</th><th>Confirmed Meeting Booked</th><th>Confirmed / Total</th><th>Bill Amount</th><th>Billed</th><th>Paid</th></tr></thead>' +
    '<tbody>' + rows + totalRow + '</tbody></table>' +
    '</div></div>';
}


function renderClient() {
  const c = state.clients[ui.clientId];
  if (!c) { ui.view = "dashboard"; return renderDashboard(); }
  const prog = progressOf(c);

  return `
    <div class="topbar">
      <div class="brand"><div class="logo">GTM</div> <strong>${escapeHTML(c.name)}</strong></div>
      <div style="margin-left:auto;display:flex;gap:10px;align-items:center">
        <button class="btn ghost sm" data-action="open-docs">📖 Docs</button>
        ${isClientView ? '<div class="badge" style="background:#15803d">Live - synced</div>' : '<div class="badge">Client view</div>'}
      </div>
    </div>
    <div class="wrap">
      ${isClientView ? '' : '<div class="breadcrumb"><a data-action="back">← Back</a></div>'}
      
      ${isClientView ? '<div class="share-box" style="background:#dcfce7;border-color:#86efac;color:#15803d"><strong>Your engagement tracker</strong> - this page updates in real time as your project progresses.</div>' : '<div class="share-box">Share this link with your team:<div class="share-link"><input type="text" readonly value="' + window.location.origin + window.location.pathname + '?client=' + c.id + '"><button class="btn sm ghost" onclick="navigator.clipboard.writeText(\'' + window.location.origin + window.location.pathname + '?client=' + c.id + '\')">Copy</button></div></div>'}

      <div class="card" style="margin-bottom:16px">
        <div class="card-head">
          <div>
            <h2>${escapeHTML(c.name)}</h2>
            <div class="sub">${PATHS[c.path].tagline}</div>
          </div>
        </div>
        <div class="card-body">
          <div class="kpis">
            <div class="kpi"><div class="label">Path</div><div class="value" style="font-size:14px">${PATHS[c.path].label}</div></div>
            <div class="kpi"><div class="label">Progress</div><div class="value">${prog}%</div><div class="progress" style="margin-top:6px"><div style="width:${prog}%"></div></div></div>
            <div class="kpi"><div class="label">Kickoff</div><div class="value" style="font-size:14px">${escapeHTML(c.kickoffDate || "-")}</div></div>
            <div class="kpi"><div class="label">Target launch</div><div class="value" style="font-size:14px">${escapeHTML(c.targetLaunchDate || "-")}</div></div>
          </div>
        </div>
      </div>

      <div class="timeline-bar" id="timeline-bar">
        ${renderTimelineBar(c)}
      </div>

      <div class="tabs">
        ${isClientView ? '' : '<button data-action="tab" data-tab="offers" class="' + (ui.tab==='offers'?'active':'') + '">Offers</button>'}
        ${isClientView ? '' : '<button data-action="tab" data-tab="intake" class="' + (ui.tab==='intake'?'active':'') + '">Client Intake</button>'}
        <button data-action="tab" data-tab="overview" class="${ui.tab==='overview'?'active':''}">Overview</button>
        ${isClientView ? '' : '<button data-action="tab" data-tab="proposal" class="' + (ui.tab==='proposal'?'active':'') + '">Proposal</button>'}
        <button data-action="tab" data-tab="timeline" class="${ui.tab==='timeline'?'active':''}">Timeline</button>
        ${c.proposal && c.proposal.stage === 'approved' ? '<button data-action="tab" data-tab="delivery" class="' + (ui.tab==='delivery'?'active':'') + '">Delivery</button>' : ''}
        <button data-action="tab" data-tab="outcomes" class="${ui.tab==='outcomes'?'active':''}">Outcomes</button>
      </div>

      <div id="tab-body">${
        ui.tab === "offers" ? renderOffersTab(c)
        : ui.tab === "intake" ? renderIntakeTab(c)
        : ui.tab === "overview" ? renderOverviewTab(c)
        : ui.tab === "proposal" ? renderProposalTab(c)
        : ui.tab === "delivery" ? renderDeliveryTab(c)
        : ui.tab === "timeline" ? renderTimelineTab(c)
        : renderOutcomesTab(c)
      }</div>
    </div>
  `;
}

function renderOffersTab(c) {
  var page = ui.offerPage || 0;
  var slide = SLIDES[page];
  var total = SLIDES.length;

  var prevBtn = page === 0
    ? '<button class="ppt-btn ppt-btn-sec" disabled style="opacity:.3">\u2190</button>'
    : '<button class="ppt-btn ppt-btn-sec" data-action="offer-prev">\u2190</button>';
  var nextBtn = page < total - 1
    ? '<button class="ppt-btn" data-action="offer-next">Next \u2192</button>'
    : '<button class="ppt-btn" data-action="offer-next">Done \u2192</button>';

  var dotsHtml = SLIDES.map(function(s, i) {
    return '<div class="ppt-dot' + (i === page ? ' active' : '') + '"></div>';
  }).join("");

  var topbar = '<div class="ppt-topbar">' +
    '<div class="ppt-brand"><div class="logo">GTM</div> GetGTM</div>' +
    '<div class="ppt-counter">' + (page + 1) + ' / ' + total + '</div>' +
    '<div class="ppt-nav">' + (page === 0 ? '<button class="ppt-btn-sec" data-action="skip-ppt" style="margin-right:8px">Skip presentation</button>' : '') + prevBtn + nextBtn + '</div>' +
  '</div>';

  var footer = '<div class="ppt-footer">' +
    '<div class="ppt-category">' + escapeHTML(slide.category) + '</div>' +
    '<div class="ppt-dots">' + dotsHtml + '</div>' +
    '<div class="ppt-hint">Prospect view</div>' +
  '</div>';

  if (slide.type === "problem") {
    return renderProblemSlide(slide, topbar, footer);
  }
  if (slide.type === "problem-summary") {
    return renderProblemSummary(slide, topbar, footer);
  }
  if (slide.type === "outbound-detail") {
    return renderOutboundSlide(slide, topbar, footer, c);
  }
  if (slide.type === "offer") {
    return renderOfferSlide(slide, topbar, footer);
  }

  return '<div class="ppt-fullscreen">' + topbar +
    '<div style="flex:1;display:flex;align-items:center;justify-content:center;background:#000;color:#888">' +
    'Unknown slide type</div>' + footer + '</div>';
}

function renderProblemSlide(s, topbar, footer) {
  var leftLines = s.left.lines.map(function(l) {
    return '<div class="ppt-line">' + escapeHTML(l) + '</div>';
  }).join("");

  var centerLines = s.center.lines.map(function(pair) {
    return '<div class="gap-item">' +
      '<div class="gap-title">' + escapeHTML(pair[0]) + '</div>' +
      '<div class="gap-desc">' + escapeHTML(pair[1]) + '</div>' +
    '</div>';
  }).join("");

  var rightLines = s.right.lines.map(function(l) {
    return '<div class="ppt-line ppt-line-check">\u2713 ' + escapeHTML(l) + '</div>';
  }).join("");

  var tableRows = s.table.map(function(row) {
    return '<tr><td class="tbl-before">' + escapeHTML(row[0]) + '</td>' +
      '<td class="tbl-after">' + escapeHTML(row[1]) + '</td></tr>';
  }).join("");

  return '<div class="ppt-fullscreen">' + topbar +
    '<div class="problem-header">' +
      '<h1 class="problem-headline">' + escapeHTML(s.headline) + '</h1>' +
      '<p class="problem-subline">' + escapeHTML(s.subline) + '</p>' +

      '<div class="problem-col problem-left">' +

function goalsPctCell(target, achieved) {
  var tNum = parseFloat(target), aNum = parseFloat(achieved);
  if (!tNum || isNaN(tNum) || isNaN(aNum)) return '<span class="small" style="color:var(--text-muted)">-</span>';
  var pct = Math.round((aNum / tNum) * 100);
  var color = pct >= 100 ? "var(--success)" : pct >= 60 ? "var(--brand)" : "var(--danger)";
  return '<strong style="color:' + color + '">' + pct + '%</strong>';
}

function renderGoalsTable(goalsObj, lineIndex) {
  // lineIndex: null/undefined for the single-line (default) case using data-goal="m.metric";
  // a number for the multi-line case using data-goalline="lineIndex.m.metric"
  var attrName = lineIndex === undefined || lineIndex === null ? "data-goal" : "data-goalline";
  function keyFor(m, metric) { return lineIndex === undefined || lineIndex === null ? (m + "." + metric) : (lineIndex + "." + m + "." + metric); }
  var rows = ["m1","m2","m3"].map(function(m) {
    var gm = goalsObj[m];
    var mLabel = m.toUpperCase();
    return '<tr>' +
      '<td style="font-weight:600" rowspan="2">' + mLabel + '</td>' +
      '<td>Positive replies</td>' +
      '<td><input ' + attrName + '="' + keyFor(m, "replies") + '" value="' + escapeAttr(gm.replies) + '" placeholder="Target" style="padding:5px 8px;border:0.5px solid var(--border);border-radius:4px;width:100%;background:var(--surface-1)"></td>' +
      '<td><input ' + attrName + '="' + keyFor(m, "achievedReplies") + '" value="' + escapeAttr(gm.achievedReplies) + '" placeholder="Actual" style="padding:5px 8px;border:0.5px solid var(--border);border-radius:4px;width:100%;background:var(--surface-1)"></td>' +
      '<td>' + goalsPctCell(gm.replies, gm.achievedReplies) + '</td>' +
      '</tr>' +
      '<tr style="border-bottom:1px solid var(--border)">' +
      '<td>Meetings booked</td>' +
      '<td><input ' + attrName + '="' + keyFor(m, "meetings") + '" value="' + escapeAttr(gm.meetings) + '" placeholder="Target" style="padding:5px 8px;border:0.5px solid var(--border);border-radius:4px;width:100%;background:var(--surface-1)"></td>' +
      '<td><input ' + attrName + '="' + keyFor(m, "achievedMeetings") + '" value="' + escapeAttr(gm.achievedMeetings) + '" placeholder="Actual" style="padding:5px 8px;border:0.5px solid var(--border);border-radius:4px;width:100%;background:var(--surface-1)"></td>' +
      '<td>' + goalsPctCell(gm.meetings, gm.achievedMeetings) + '</td>' +
      '</tr>';
  }).join("");
  return '<table style="margin-bottom:4px"><thead><tr><th>Month</th><th>Metric</th><th>Target</th><th>Achieved</th><th>% Achieved</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

function syncTimelineFromDelivery(c) {
  if (!c.stages) return;
  var del = (c.delivery && c.delivery.onboarding) || [];
  var stageMap = {};
  del.forEach(function(item) { stageMap[item.item] = item.status; });

  function allDone() {
    var items = Array.prototype.slice.call(arguments);
    return items.length > 0 && items.every(function(name) { return stageMap[name] === "Complete"; });
  }
  function anyBlocked() {
    var items = Array.prototype.slice.call(arguments);
    return items.some(function(name) { return stageMap[name] === "Blocked"; });
  }
  function anyStarted() {
    var items = Array.prototype.slice.call(arguments);
    return items.some(function(name) { return stageMap[name] === "In Progress" || stageMap[name] === "Complete"; });
  }

  var propStage = c.proposal ? c.proposal.stage : "";

  c.stages.forEach(function(stage) {
    var s = stage.stage;
    var newStatus = stage.status;

    // Qualification: moves as soon as any package is selected in intake
    if (s === "Qualification") {
      if (c.intake && c.intake.outbound) newStatus = "Complete";
    }

    // Scoping: in progress once overview/goals/ICP started, complete once proposal drafted
    if (s === "Scoping") {
      var hasGoals = c.goals && (c.goals.m1.replies || c.goals.m2.replies);
      var hasICP = c.icp && (c.icp.geography || c.icp.industry);
      if (propStage) newStatus = "Complete";
      else if (hasGoals || hasICP) newStatus = "In Progress";
    }

    // Proposal stage tracks the proposal workflow directly
    if (s === "Proposal" || s === "Proposal / Scoping") {
      if (propStage === "draft") newStatus = "In Progress";
      else if (propStage === "sent" || propStage === "final") newStatus = "In Progress";
      else if (propStage === "approved") newStatus = "Complete";
    }

    // Commercial Handover: in progress once approved, complete once SOW+invoice done
    if (s === "Commercial Handover") {
      if (propStage === "approved") {
        if (allDone("SOW signed and filed", "Invoice sent (Part 1)")) newStatus = "Complete";
        else newStatus = "In Progress";
      }
    }

    if (s === "Onboarding" || s === "Onboarding Call") {
      if (allDone("Kickoff call completed")) newStatus = "Complete";
      else if (anyStarted("Kickoff call completed", "Shared Slack/Teams channel created")) newStatus = "In Progress";
      if (anyBlocked("Kickoff call completed")) newStatus = "Blocked";
    }

    if (s === "Infrastructure") {
      if (allDone("Email domains purchased", "Email domains warming")) newStatus = "Complete";
      else if (anyStarted("Email domains purchased", "Email domains warming")) newStatus = "In Progress";
      if (anyBlocked("Email domains purchased", "Email domains warming")) newStatus = "Blocked";
    }

    if (s === "Connecting Accounts") {
      if (allDone("LinkedIn accounts connected", "Sales Navigator access confirmed", "CRM access granted or tracking sheet created")) newStatus = "Complete";
      else if (anyStarted("LinkedIn accounts connected", "Sales Navigator access confirmed")) newStatus = "In Progress";
      if (anyBlocked("LinkedIn accounts connected", "Sales Navigator access confirmed")) newStatus = "Blocked";
    }

    if (s === "ICP Fitment") {
      if (allDone("ICP fitment document approved")) newStatus = "Complete";
      else if (anyStarted("ICP fitment document approved")) newStatus = "In Progress";
      if (anyBlocked("ICP fitment document approved")) newStatus = "Blocked";
    }

    if (s === "TAM & List" || s === "Target List Research") {
      if (allDone("TAM & launch list built")) newStatus = "Complete";
      else if (anyStarted("TAM & launch list built")) newStatus = "In Progress";
      if (anyBlocked("TAM & launch list built")) newStatus = "Blocked";
    }

    if (s === "Messaging") {
      if (allDone("Messaging approved")) newStatus = "Complete";
      else if (anyStarted("Messaging approved")) newStatus = "In Progress";
      if (anyBlocked("Messaging approved")) newStatus = "Blocked";
    }

    if (s === "Campaign Build" || s === "QA & Test" || s === "QA & Validation") {
      if (allDone("Campaign built and QA passed")) newStatus = "Complete";
      else if (anyStarted("Campaign built and QA passed")) newStatus = "In Progress";
      if (anyBlocked("Campaign built and QA passed")) newStatus = "Blocked";
    }

    if (s === "Launch") {
      if (allDone("First campaign launched")) newStatus = "Complete";
      else if (anyStarted("First campaign launched")) newStatus = "In Progress";
      if (anyBlocked("First campaign launched")) newStatus = "Blocked";
    }

    if (s === "First Review" || s === "Post-launch") {
      if (allDone("MSP signed off by both parties", "First campaign launched")) newStatus = "Complete";
      else if (allDone("First campaign launched")) newStatus = "In Progress";
    }

    // Deep Discovery (niche path)
    if (s === "Deep Discovery") {
      if (allDone("Kickoff call completed")) newStatus = "Complete";
      else if (anyStarted("Kickoff call completed")) newStatus = "In Progress";
    }

    // GTM Play Design (niche path)
    if (s === "GTM Play Design") {
      if (allDone("ICP fitment document approved", "TAM & launch list built")) newStatus = "Complete";
      else if (anyStarted("ICP fitment document approved")) newStatus = "In Progress";
    }

    // Update date if completing
    if (newStatus === "Complete" && stage.status !== "Complete" && !stage.eta) {
      stage.eta = new Date().toISOString().slice(0, 10);
    }

    stage.status = newStatus;
  });
}

function renderTimelineBar(c) {
  var stages = c.stages || [];
  var total = stages.length;
  var done = stages.filter(function(s) { return s.status === "Complete"; }).length;
  var current = stages.find(function(s) { return s.status !== "Complete"; });

  var dots = stages.map(function(s, i) {
    var st = s.status;
    var cls = st === "Complete" ? "tl-done" : st === "In Progress" ? "tl-active" : st === "Blocked" ? "tl-blocked" : "tl-pending";
    var dateStr = s.eta ? new Date(s.eta).toLocaleDateString("en-US", {month:"short",day:"numeric"}) : "";
    return '<div class="tl-node ' + cls + '" title="' + escapeAttr(s.stage + ': ' + st) + '">' +
      '<div class="tl-dot"></div>' +
      '<div class="tl-label">' + escapeHTML(s.stage.length > 12 ? s.stage.substring(0,11) + '..' : s.stage) + '</div>' +
      (dateStr ? '<div class="tl-date">' + dateStr + '</div>' : '') +
    '</div>';
  }).join('<div class="tl-connector' + '"></div>');

  return '<div class="tl-track">' + dots + '</div>' +
    '<div class="tl-summary">' + done + ' of ' + total + ' complete' +
    (current ? ' - Current: ' + escapeHTML(current.stage) : ' - All complete') + '</div>';
}

  const pwEl = document.getElementById("pw");
  if (pwEl) {
    pwEl.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); doLogin(); } });
  }
  const fbEmailEl = document.getElementById("login-email");
  const fbPassEl = document.getElementById("login-password");
  if (fbPassEl) {
    var doFbLogin = function() {
      var btn = document.querySelector('[data-action="fb-login"]');
      if (btn) btn.click();
    };
    fbPassEl.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); doFbLogin(); } });
    if (fbEmailEl) fbEmailEl.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); doFbLogin(); } });
  }

  if (window.__actionHandler) {
    document.removeEventListener("click", window.__actionHandler);
    window.__actionHandler = null;
  }
  const actionHandler = async function(e) {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const action = el.dataset.action;
      if (action === "login") {
        doLogin();
      } else if (action === "fb-login") {
        var emailEl = document.getElementById("login-email");
        var passEl = document.getElementById("login-password");
        var emailVal = emailEl ? emailEl.value.trim() : "";
        var passVal = passEl ? passEl.value : "";
        try {
          await auth.signInWithEmailAndPassword(emailVal, passVal);
          ui.isAuth = true; ui.view = "dashboard"; ui.loginError = null; render();
        } catch (err) {
          ui.loginError = "Incorrect email or password.";
          render();
        }
      } else if (action === "logout") {
        if (isClientView) return;
        if (useFirebase && auth) { auth.signOut(); }
        ui.isAuth = false; ui.view = "login"; render();
      }
      else if (action === "open-docs") {
        ui.docsReturnView = ui.view; ui.docsReturnClientId = ui.clientId;
        ui.view = "docs"; ui.docsTab = ui.docsTab || "howitworks";
        render();
      }
      else if (action === "docs-back") {
        ui.view = ui.docsReturnView || (ui.isAuth ? "dashboard" : "login");
        ui.clientId = ui.docsReturnClientId || ui.clientId;
        render();
      }
      else if (action === "docs-tab") { ui.docsTab = el.dataset.docsTab; render(); }
      else if (action === "new-client") { ui.modal = { type: "new-client" }; render(); }
      else if (action === "delete-client") {
        var cl = state.clients[el.dataset.id];
        var clName = cl ? cl.name : "this engagement";
        if (confirm("Delete " + clName + "? This removes all data for this engagement - intake, overview, proposal, timeline, delivery, outcomes. This cannot be undone.")) {
          delete state.clients[el.dataset.id];
          await saveState();
          render();
        }
      }
      else if (action === "dtab") { ui.dashboardTab = el.dataset.dtab; render(); }
      else if (action === "add-prospect") {
        state.prospects.push({
          id: "p_" + Math.random().toString(36).slice(2,10),
          name: "New prospect", company: "", email: "",
          dateContacted: new Date().toISOString().slice(0,10), status: "New",
          nextStep: "", source: "Manually added", notes: "", potentialValue: ""
        });
        saveState(); render();
      }
      else if (action === "add-response") {
        if (!state.responses) state.responses = [];
        state.responses.push({
          id: "r_" + Math.random().toString(36).slice(2,10),
          date: new Date().toISOString().slice(0,10), client: "", contact: "",
          screenshotRef: "", heddlStatus: "", clientStatus: "", confirmed: false, notes: ""
        });
        saveState("responses"); render();
      }
      else if (action === "delete-response") {
        var respToDelete = (state.responses || []).find(function(r) { return r.id === el.dataset.id; });
        if (respToDelete && respToDelete.confirmed) {
          var delPin = prompt("This response is confirmed and locked. Enter the 4-digit PIN to delete it anyway:");
          if (delPin !== "0707") { if (delPin !== null) alert("Incorrect PIN."); return; }
        }
        if (confirm("Remove this response? This cannot be undone.")) {
          state.responses = (state.responses || []).filter(function(r) { return r.id !== el.dataset.id; });
          saveState("responses"); render();
        }
      }
      else if (action === "check-response-drive") {
        var result = refreshResponsesFromDrive();
        if (result > 0) {
          saveState("responses").then(function() { render(); });
          alert(result + " new response" + (result > 1 ? "s" : "") + " added from Drive screenshots.");
        } else {
          alert("No new responses found. This checks against screenshots I already know about - ask Claude in chat to check the Drive folder fresh for anything newly uploaded.");
        }
      }
      else if (action === "clear-response-filters") {
        ui.responseFilters = { client: "", heddlStatus: "", clientStatus: "", confirmed: "" };
        render();
      }
      else if (action === "save-response-view") {
        var viewName = prompt("Name this view (e.g. \"Securotix unconfirmed positives\"):");
        if (!viewName) return;
        if (!state.responseSavedViews) state.responseSavedViews = [];
        state.responseSavedViews.push({ name: viewName, filters: Object.assign({}, ui.responseFilters) });
        saveState("responseViews"); render();
      }
      else if (action === "delete-response-view") {
        var vIdx = +el.dataset.viewIndex;
        var vName = (state.responseSavedViews[vIdx] || {}).name || "this view";
        if (confirm("Delete saved view \"" + vName + "\"?")) {
          state.responseSavedViews.splice(vIdx, 1);
          saveState("responseViews"); render();
        }
      }
      else if (action === "load-response-view-chip") {
        var loadIdx = +el.dataset.viewIndex;
        var view = state.responseSavedViews[loadIdx];
        if (view) { ui.responseFilters = Object.assign({ client: "", heddlStatus: "", clientStatus: "", confirmed: "" }, view.filters); render(); }
      }
      else if (action === "convert-prospect") {
        var prospect = state.prospects.find(function(x) { return x.id === el.dataset.id; });
        if (!prospect) return;
        var companyName = (prospect.company || prospect.name || "New Engagement").trim();
        var alreadyExists = Object.values(state.clients).some(function(c) { return c.name.trim().toLowerCase() === companyName.toLowerCase(); });
        if (alreadyExists) {
          alert(companyName + " already has an engagement. Use \"Open engagement\" instead of creating a duplicate.");
          return;
        }
        if (!confirm("Convert " + prospect.name + " (" + companyName + ") to a new engagement? This creates a New Engagement record and marks the prospect Converted.")) return;
        var newC = newClient(companyName, "7-day");
        newC.intake.pocName = prospect.name || "";
        newC.intake.pocEmail = prospect.email || "";
        migrateClient(newC);
        state.clients[newC.id] = newC;
        prospect.status = "Converted";
        await saveState();
        ui.view = "client"; ui.clientId = newC.id; ui.tab = "intake";
        render();
      }
      else if (action === "delete-prospect") {
        var pr = state.prospects.find(function(x) { return x.id === el.dataset.id; });
        var prName = pr ? (pr.name + (pr.company ? " (" + pr.company + ")" : "")) : "this prospect";
        if (confirm("Remove " + prName + " from Prospects? This cannot be undone.")) {
          state.prospects = state.prospects.filter(p => p.id !== el.dataset.id);
          saveState(); render();
        }
      }
      else if (action === "refresh-prospects") {
        var result = refreshProspectsFromGmail();
        state.lastGmailRefresh = new Date().toLocaleDateString("en-US", {year:"numeric",month:"short",day:"numeric"});
        await saveState("prospects");
        render();
        if (result.added > 0 || result.updated > 0) {
          var parts = [];
          if (result.added > 0) parts.push(result.added + " new prospect" + (result.added > 1 ? "s" : ""));
          if (result.updated > 0) parts.push(result.updated + " updated with newer activity");
          alert(parts.join(", ") + ".");
        } else {
          alert("No changes found. This checks against threads I already know about - ask Claude in chat to search Gmail fresh, and I'll add or update anything new the same way.");
        }
      }
      else if (action === "modal-close") { ui.modal = null; render(); }
      else if (action === "modal-create") {
        const nameEl = document.getElementById("nc-name");
        const name = nameEl.value.trim();
        const path = document.getElementById("nc-path").value;
        if (!name) { nameEl.style.borderColor = "var(--danger)"; nameEl.focus(); return; }
        const c = newClient(name, path);
        state.clients[c.id] = c;
        await saveState();
        ui.modal = null;
        ui.view = "client";
        ui.clientId = c.id;
        ui.tab = "offers";
        ui.offerPage = 0;
        render();
      } else if (action === "back") {
        var leavingClient = state.clients[ui.clientId];
        if (leavingClient) {
          ui.dashboardTab = (leavingClient.proposal && leavingClient.proposal.stage === "approved") ? "clients" : "new-engagements";
        }
        ui.view = "dashboard";
        render();
      }
      else if (action === "tab") { if (isClientView && (el.dataset.tab === "offers" || el.dataset.tab === "intake" || el.dataset.tab === "proposal")) return; ui.tab = el.dataset.tab; render(); }
      else if (action === "skip-ppt") { ui.tab = "intake"; render(); }
      else if (action === "offer-prev") {
        ui.offerPage = Math.max(0, (ui.offerPage || 0) - 1);
        render();
      } else if (action === "offer-next") {
        if ((ui.offerPage || 0) < SLIDES.length - 1) {
          ui.offerPage = (ui.offerPage || 0) + 1; render();
        } else {
          ui.tab = "intake"; render();
        }
      }
      else if (action === "generate-pdf") {
        generateProposalPDF(state.clients[ui.clientId]);
      } else if (action === "go-to-proposal") {
        await saveState();
        ui.tab = "proposal";
        render();
      } else if (action === "mark-initial-sent") {
        const cl = state.clients[ui.clientId];
        cl.proposal.stage = "sent";
        cl.proposal.initialSentDate = new Date().toISOString().slice(0,10);
        await saveState(); render();
      } else if (action === "mark-final-sent") {
        const cl = state.clients[ui.clientId];
        cl.proposal.stage = "final";
        cl.proposal.finalSentDate = new Date().toISOString().slice(0,10);
        await saveState(); render();
      } else if (action === "mark-approved") {
        const cl = state.clients[ui.clientId];
        cl.proposal.stage = "approved";
        cl.proposal.approvedDate = new Date().toISOString().slice(0,10);
        cl.sow.status = "Drafting";
        syncTimelineFromDelivery(cl);
        await saveState(); render();
        notifyTeam(
          "Proposal approved: " + cl.name,
          cl.name + "'s proposal was approved on " + cl.proposal.approvedDate + ". SOW is now drafting.\n" +
          window.location.origin + window.location.pathname + "?client=" + cl.id
        );
      }
      else if (action === "save-intake") {
        const cl = state.clients[ui.clientId];
        if (!cl.intake.outbound) {
          const btn = el;
          btn.textContent = "Select an Outbound plan first";
          btn.style.background = "var(--danger)";
          setTimeout(() => { btn.textContent = "Save & continue to Overview →"; btn.style.background = ""; }, 1800);
          return;
        }
        cl.name = cl.intake.clientName || cl.name;
        if (!cl.people.clientPoc) cl.people.clientPoc = cl.intake.pocName;
        if (!cl.people.clientPocEmail) cl.people.clientPocEmail = cl.intake.pocEmail;
        await saveState();
        ui.tab = "overview";
        render();
      }
      else if (action === "add-weekly-update") {
        const cl = state.clients[ui.clientId];
        if (!cl.delivery) cl.delivery = { onboarding: [], weeklyUpdates: [] };
        cl.delivery.weeklyUpdates.push({ date: new Date().toISOString().slice(0,10), note: "" });
        await saveState(); render();
      } else if (action === "delete-weekly") {
        const cl = state.clients[ui.clientId];
        cl.delivery.weeklyUpdates.splice(+el.dataset.i, 1);
        await saveState(); render();
      }
      else if (action === "add-outcome") {
        const c = state.clients[ui.clientId];
        c.outcomes.push({ date: new Date().toISOString().slice(0,10), metric: "", target: "", actual: "" });
        await saveState();
        render();
      } else if (action === "delete-out") {
        const c = state.clients[ui.clientId];
        c.outcomes.splice(+el.dataset.i, 1);
        await saveState();
        render();
      }
  };
  window.__actionHandler = actionHandler;
  document.addEventListener("click", actionHandler);

  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  const save = debounce(saveState, 300);

  const simpleGroups = ["people", "channel", "icp", "drive", "integration", "intake"];
  simpleGroups.forEach(group => {
    document.querySelectorAll(`[data-${group}]`).forEach(el => {
      const commit = () => { state.clients[ui.clientId][group][el.dataset[group]] = el.value; };
      el.addEventListener("input", () => { commit(); save(); });
      if (el.tagName === "SELECT") el.addEventListener("change", () => { commit(); saveState(); render(); });
    });
  });

  document.querySelectorAll("[data-outbound-card]").forEach(el => {
    el.addEventListener("click", () => {
      state.clients[ui.clientId].intake.outbound = el.dataset.outboundCard;
      saveState(); render();
    });
  });
  document.querySelectorAll("[data-aeo-card]").forEach(el => {
    el.addEventListener("click", () => {
      const cl = state.clients[ui.clientId];
      cl.intake.aeo = cl.intake.aeo === el.dataset.aeoCard ? "" : el.dataset.aeoCard;
      saveState(); render();
    });
  });
  document.querySelectorAll("[data-delight-card]").forEach(el => {
    el.addEventListener("click", () => {
      const cl = state.clients[ui.clientId];
      cl.intake.delight = cl.intake.delight === el.dataset.delightCard ? "" : el.dataset.delightCard;
      saveState(); render();
    });
  });
  document.querySelectorAll("[data-addon-card]").forEach(el => {
    el.addEventListener("click", () => {
      const arr = state.clients[ui.clientId].intake.addons;
      const id = el.dataset.addonCard;
      const i = arr.indexOf(id);
      if (i >= 0) arr.splice(i, 1); else arr.push(id);
      saveState(); render();
    });
  });

  document.querySelectorAll("[data-delivery]").forEach(el => {
    var handler = function() {
      var cl = state.clients[ui.clientId];
      if (!cl.delivery) return;
      var idx = parseInt(el.dataset.delivery);
      cl.delivery.onboarding[idx][el.dataset.key] = el.value;
      if (el.dataset.key === "status") { syncTimelineFromDelivery(cl); saveState(); render(); } else { save(); }
    };
    el.addEventListener("input", handler);
    el.addEventListener("change", handler);
  });
  document.querySelectorAll("[data-weekly]").forEach(el => {
    el.addEventListener("input", function() {
      var cl = state.clients[ui.clientId];
      if (!cl.delivery) return;
      cl.delivery.weeklyUpdates[parseInt(el.dataset.weekly)][el.dataset.key] = el.value;
      save();
    });
  });

  document.querySelectorAll("[data-account-status]").forEach(el => {
    el.addEventListener("change", function() {
      var c = state.clients[el.dataset.accountStatus];
      if (!c) return;
      c.accountStatus = el.value;
      saveState(); render();
    });
  });
  document.querySelectorAll("[data-lost-mrr]").forEach(el => {
    el.addEventListener("input", function() {
      var c = state.clients[el.dataset.lostMrr];
      if (!c) return;
      c.lostMRR = el.value;
      save();
    });
  });

  document.querySelectorAll("[data-report]").forEach(el => {
    el.addEventListener("input", function() {
      if (!state.revenueActuals) state.revenueActuals = {};
      state.revenueActuals[el.dataset.report] = el.value;
      save();
    });
    el.addEventListener("change", function() {
      if (!state.revenueActuals) state.revenueActuals = {};
      state.revenueActuals[el.dataset.report] = el.value;
      saveState(); render();
    });
  });

  document.querySelectorAll("[data-prospect]").forEach(el => {
    var handler = function() {
      var p = state.prospects.find(function(x) { return x.id === el.dataset.prospect; });
      if (!p) return;
      p[el.dataset.key] = el.value;
      if (el.dataset.key === "status") { saveState(); render(); } else { save(); }
    };
    el.addEventListener("input", handler);
    el.addEventListener("change", handler);
  });

  var RESPONSE_UNLOCK_PIN = "0707";
  document.querySelectorAll("[data-response]").forEach(el => {
    var handler = function() {
      var r = (state.responses || []).find(function(x) { return x.id === el.dataset.response; });
      if (!r) return;
      if (el.dataset.key === "confirmed") {
        if (r.confirmed && !el.checked) {
          // Attempting to unlock a confirmed response - require the PIN.
          var pin = prompt("Enter the 4-digit PIN to unlock this response:");
          if (pin !== RESPONSE_UNLOCK_PIN) {
            el.checked = true; // revert - wrong or cancelled PIN
            if (pin !== null) alert("Incorrect PIN.");
            return;
          }
        }
        r.confirmed = el.checked;
        saveState("responses"); render();
        return;
      }
      if (r.confirmed) return; // locked - all other fields are read-only while confirmed
      r[el.dataset.key] = el.dataset.type === "checkbox" ? el.checked : el.value;
      if (el.dataset.key === "heddlStatus" || el.dataset.key === "clientStatus" || el.dataset.key === "client") { saveState("responses"); render(); } else { save("responses"); }
    };
    el.addEventListener("input", handler);
    el.addEventListener("change", handler);
  });

  document.querySelectorAll("[data-billing]").forEach(el => {
    var handler = function() {
      if (!state.responseBilling) state.responseBilling = {};
      var client = el.dataset.billing;
      if (!state.responseBilling[client]) state.responseBilling[client] = { amount: "", billed: false, paid: false };
      state.responseBilling[client][el.dataset.key] = el.dataset.type === "checkbox" ? el.checked : el.value;
      if (el.dataset.type === "checkbox") { saveState("responseBilling"); render(); } else { save("responseBilling"); }
    };
    el.addEventListener("input", handler);
    el.addEventListener("change", handler);
  });

  document.querySelectorAll('[data-action="filter-response"]').forEach(el => {
    el.addEventListener("change", () => {
      if (!ui.responseFilters) ui.responseFilters = { client: "", heddlStatus: "", clientStatus: "", confirmed: "" };
      ui.responseFilters[el.dataset.filter] = el.value;
      render();
    });
  });
  document.querySelectorAll('[data-action="load-response-view"]').forEach(el => {
    el.addEventListener("change", () => {
      if (el.value === "") return;
      var view = (state.responseSavedViews || [])[+el.value];
      if (view) { ui.responseFilters = Object.assign({ client: "", heddlStatus: "", clientStatus: "", confirmed: "" }, view.filters); render(); }
    });
  });

  document.querySelectorAll("[data-proposal]").forEach(el => {
    el.addEventListener("input", () => {
      if (!state.clients[ui.clientId].proposal) return;
      state.clients[ui.clientId].proposal[el.dataset.proposal] = el.value;
      save();
    });
  });

  document.querySelectorAll("[data-gtme]").forEach(el => {
    el.addEventListener("change", () => {
      const match = GTME_ROSTER.find(m => m.name === el.value);
      const cl = state.clients[ui.clientId];
      cl.people.gtme = el.value;
      cl.people.gtmeEmail = match ? match.email : "";
      saveState(); render();
    });
  });

  document.querySelectorAll("[data-goal]").forEach(el => {
    el.addEventListener("input", () => {
      const [month, metric] = el.dataset.goal.split(".");
      state.clients[ui.clientId].goals[month][metric] = el.value;
      save();
    });
  });
  document.querySelectorAll("[data-goalline]").forEach(el => {
    el.addEventListener("input", () => {
      const [lineIdx, month, metric] = el.dataset.goalline.split(".");
      state.clients[ui.clientId].goalLines[+lineIdx].goals[month][metric] = el.value;
      save();
    });
  });
  document.querySelectorAll("[data-stage]").forEach(el => {
    el.addEventListener("change", () => {
      const s = state.clients[ui.clientId].stages[+el.dataset.stage];
      s[el.dataset.key] = el.value;
      saveState(); render();
    });
    el.addEventListener("input", () => {
      const s = state.clients[ui.clientId].stages[+el.dataset.stage];
      s[el.dataset.key] = el.value;
      save();
    });
  });
  document.querySelectorAll("[data-out]").forEach(el => {
    el.addEventListener("input", () => {
      const o = state.clients[ui.clientId].outcomes[+el.dataset.out];
      o[el.dataset.key] = el.value;
      save();
    });
  });
}

function escapeHTML(s) { return String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function escapeAttr(s) { return escapeHTML(s); }

function applyClientViewRouting() {
  var params = new URLSearchParams(window.location.search);
  var cid = params.get("client");
  if (cid && state.clients[cid] && !ui.isAuth) {
    isClientView = true;
    clientViewId = cid;
    ui.clientId = cid;
    ui.view = "client";
    if (!ui.tab || ui.tab === "offers" || ui.tab === "intake" || ui.tab === "proposal") ui.tab = "overview";
  }
}

(async function init() {
  initFirebase();
  if (!useFirebase) {
    await loadState();
  }
  // When useFirebase is true, clientsRef.on("value", ...) in initFirebase() populates
  // state.clients reactively and calls render() itself once data arrives - no blind wait needed.

  applyClientViewRouting();
  render();
})();
</script>
</body>
</html>
