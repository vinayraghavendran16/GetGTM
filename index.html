function renderHowItWorks() {
  return `
    <h1>How the Engagement Tracker works</h1>
    <p class="docs-lead">This tool tracks a client relationship from first outreach through to signed, delivered, revenue-generating account - and keeps GetGTM and the client looking at the same live data.</p>

    <h2>Access model</h2>
    <p>Two ways in:</p>
    <ul>
      <li><strong>GetGTM team</strong> - sign in with a team email/password (Firebase Authentication). Full read/write access to everything. Clicking a client from the Clients list lands on whatever tab matches their current stage (Client Intake, Proposal, or Delivery) rather than always opening the Offers presentation - that's now reserved for brand-new engagements with no stage history yet.</li>
      <li><strong>Clients</strong> - get a direct link (<code>?client=CLIENT_ID</code>). No login required. They see a purpose-built set of tabs - Outcomes, Campaigns, Responses, and Calling - never Offers, Intake, Proposal, Overview, Timeline, Delivery, Prospects, or Reporting.</li>
    </ul>
    <p><strong>Preview as client</strong> - any signed-in team member can click this button on a client's page to see byte-for-byte what that client sees (same tabs, same read-only fields), with a clear "Exit preview" back to the normal team view. Useful for checking a share link actually looks right before sending it.</p>

    <h2>The pipeline: New Engagements to Clients</h2>
    <p>Every engagement starts in <strong>New Engagements</strong> and only moves to <strong>Clients</strong> once its proposal is approved. This split keeps signed, delivering accounts separate from active sales conversations.</p>

    <h3>1. Offers presentation</h3>
    <p>A full-screen, prospect-facing slide deck shown on a live call. Covers the problem GetGTM solves, then one page per offering (Outbound, AEO/GEO, DelightLoop, Warm Path Calling, Definition Lock) - no pricing shown. Skip straight to intake if the deck isn't needed.</p>

    <h3>2. Client Intake</h3>
    <p>Capture company details and select packages: Outbound (required, India or US pricing), AEO/GEO (optional, either/or), DelightLoop (optional, either/or), and add-ons (multi-select). POC name and email sync forward into Overview automatically.</p>

    <h3>3. Overview (Mutual Success Plan)</h3>
    <p>The working document both sides reference: CRO/CS/GTME assignment, client POC, goals by month (M1/M2/M3 positive replies and meetings), ICP definition, comms channel, Drive folders, CRM integration, signing authority, and contract metadata (term type, end date, signed contract link). A "Generate initial proposal" button saves this and jumps straight to Proposal.</p>

    <h3>4. Proposal workflow</h3>
    <p>Four stages, each with a purple progress tracker:</p>
    <ul>
      <li><strong>Draft</strong> - auto-populated from Intake + Overview. Generate a PDF, or draft the email via Gmail compose (opens pre-filled, one click to send).</li>
      <li><strong>Scope Review</strong> - GTME/CS add feasibility notes before the final version goes out.</li>
      <li><strong>Final Sent</strong> - waiting on client approval, tracked via email reference.</li>
      <li><strong>Approved</strong> - SOW auto-generated, onboarding checklist unlocked, Slack + email notification fires, and the engagement moves to the Clients tab.</li>
    </ul>
    <p>Sections 06-10 of every proposal (Commercial Terms, KPI Verification, Obligations, Terms & Ways of Working, Acceptance) are a fixed template - identical structure and legal language for every client, with only names, prices, and dates substituted. This keeps every proposal legally consistent.</p>

    <h2>Pipeline Phase badge</h2>
    <p>Every client page shows a small Presales / Sales / Post-sales CS badge next to the client name (team view only). It's entirely computed - from the stage tracker, the proposal's stage, and, once signed, the existing Account Status field - so there's nothing separate to update by hand and it can never fall out of sync with reality:</p>
    <ul>
      <li><strong>Presales</strong> - current stage is Qualification or Scoping.</li>
      <li><strong>Sales</strong> - current stage is Proposal or Commercial Handover; the badge shows the specific proposal stage (Draft / Scope Review / Final Sent).</li>
      <li><strong>Post-sales CS</strong> - proposal approved. Shows "Onboarding & Launch (<em>stage</em>)" while delivery is still running, then switches to Account Status (Onboarding/Active/At Risk/Paused/Renewed/Churned) once fully delivered.</li>
    </ul>
    <p>The New Engagements table also shows a Phase column (Presales/Sales) so you can tell at a glance which prospects are still being qualified vs. already in proposal, without opening each one.</p>

    <h2>Timeline - auto-tracked, always visible</h2>
    <p>A horizontal progress bar sits above every tab (except the full-screen Offers deck), showing all 11 delivery stages from Qualification through First Review. It updates itself: package selection completes Qualification, proposal approval completes Scoping/Proposal, delivery checklist items completing (SOW signed, kickoff done, campaign launched) push the corresponding stage forward. Every stage is still manually overridable from the Timeline tab if reality differs from the auto-read.</p>

    <h2>Delivery</h2>
    <p>Unlocks once the proposal is approved. A 16-item onboarding-through-launch checklist (SOW signed, invoice sent, Drive/Slack setup, LinkedIn/Sales Nav connected, domains warmed, kickoff held, ICP fitment, TAM built, messaging approved, campaign QA'd, launched, MSP signed off) with status, date, owner, and notes per item - plus a running log of weekly updates.</p>

    <h2>Outcomes (team view)</h2>
    <p>Weekly metric logging against the M1/M2/M3 goals set in Overview - a manual, freeform log for the team's own tracking. Not the same as the client-facing Outcomes tab (see "What clients see" below), which is a different, auto-computed view of the same underlying goals.</p>

    <h2>Prospects</h2>
    <p>A separate pipeline, tracked independently of signed clients - pulled from Gmail. Threads where Rajiv led, looped Vinay in, Sean led, or Vinay/Sean reached out directly. Each row: date contacted, status (New through Converted/Stalled/Not a Fit), a manual "potential $/mo" field, next step, and source.</p>
    <p><strong>Refresh from Gmail</strong> pulls in anything new without duplicating (matched by company name). This isn't a live API poll - it's triggered either by clicking the button, or by asking Claude in chat to search Gmail fresh; either way the result lands in the same place, safely, every time.</p>
    <p><strong>Convert to engagement</strong> on any prospect creates a New Engagement pre-filled with their name and email, marks the prospect Converted, and drops straight into Client Intake. If a client with that name already exists, the button becomes "Open engagement" instead, so nothing ever gets duplicated.</p>

    <h2>Response Tracker</h2>
    <p>Tracks every client reply sourced from Heddl (the outreach platform), organized by campaign, with a backend pipeline that classifies new reply screenshots automatically.</p>
    <ul>
      <li><strong>Automatic classification</strong> - a GitHub Actions workflow scans a Drive folder every 30 minutes (or on-demand via the <strong>🔄 Refresh from Drive</strong> button), reads each new screenshot with Claude's vision API, and extracts contact, date, Heddl status (Positive Reply / Meeting Booked / No Fit / Not Interested), campaign, and a short summary. Campaign is read verbatim from the "CAMPAIGN" panel in the screenshot's right sidebar - not inferred from the message content - and validated against that client's real campaign list before being written, so a misread never lands as a wrong campaign in the data.</li>
      <li><strong>Client Status & Confirmed</strong> - set manually once you've agreed classification with the client; locks the row (fields become read-only) to protect confirmed data from accidental edits.</li>
      <li><strong>Dedup</strong> - runs automatically on every backend refresh (scheduled or manual), matching by normalized contact name (letters only, company suffixes and punctuation stripped) within the same client. Keeps the most complete record (confirmed status wins, then longest notes).</li>
      <li><strong>Campaign dropdown</strong> - each row's Campaign field is a client-scoped dropdown (only that client's campaigns appear), with an explicit "— Unassigned —" option and a "🏷 Bulk assign campaign" action (visible once you filter by client) to fill in many blank rows at once.</li>
      <li><strong>PDF export</strong> - metrics + a Reporting Snapshot pivot (by campaign, with a totals row) on page one, the full data table on page two, and numbered screenshot reference links (<code>Ref #N</code>) on a dedicated final page - long URLs inside table cells don't reliably open as links in PDF viewers, so each reference gets its own full-width line instead.</li>
    </ul>

    <h2>Campaigns</h2>
    <p>One row per Heddl campaign per client - name, status, created date, and cumulative stats (contacts reached, connections accepted, messages, emails, replies, reactions). Screenshot link included per campaign, same numbered-reference PDF pattern as the Response Tracker.</p>

    <h2>Reporting Snapshot</h2>
    <p>Aggregates every logged response by campaign (Total, Confirmed, Confirmed %), with a totals row at the bottom. Shown both on-screen in the Response Tracker tab and in the exported PDF, computed by the same shared function so the two never disagree.</p>

    <h2>Calling</h2>
    <p>A lead-calling workspace where each client works a list of warm leads uploaded by the GetGTM team. Lives in two places sharing the same data: a <strong>Calling</strong> tab inside each client's engagement view (client-facing, reachable via their share link - no login needed), and a team-only <strong>Calling</strong> tab on the dashboard with a client picker for an aggregate view.</p>
    <ul>
      <li><strong>Import (team-only)</strong> - paste a Google Sheet URL (must be shared "Anyone with the link can view"). Column headers are matched by alias (e.g. "First Name", "firstname", "fname" all resolve), previewed before committing, and appended - re-importing an updated sheet adds only new rows, matched by name + company, so nothing duplicates.</li>
      <li><strong>Per-lead fields</strong> - First/Last name, Title, Company, Location, LinkedIn, Phone, Email, Calling Status (New / Busy / Follow-Up / Meeting Booked / Not Interested / Not Relevant) with a conditional field that appears based on status (follow-up date, meeting date, or not-relevant reason), Email/Phone enrichment status + notes, Next Step, and auto-stamped First Call Date / Latest Call Date - every status change restamps Latest Call Date to today; First Call Date is set once, the first time a lead moves off "New", and never resets.</li>
      <li><strong>Client-side edits are open</strong> - a client on their share link can update any lead's status and notes without logging in, same trust model as the rest of the client view. Import, delete, and the audit log stay team-only.</li>
      <li><strong>Audit log (team-only)</strong> - every field change is recorded with timestamp, before/after values, and who made it (a signed-in team email, or "anonymous" for client-side edits) - visible under the leads table only when signed in.</li>
      <li><strong>Report + PDF</strong> - calls-made grouped by day/week/month, plus per-status counts, exportable as a PDF alongside the full leads list.</li>
    </ul>

    <h2>What clients see</h2>
    <p>A client's share link opens four tabs, in this order:</p>
    <ul>
      <li><strong>Outcomes</strong> - what was promised each month vs. what was actually achieved, with a computed % achievement, pulled straight from the same goals/goalLines data the team sets in Overview. Read-only; handles multi-line contracts (each line shown separately plus a Combined rollup).</li>
      <li><strong>Campaigns</strong> - the same stats and table as the team's Campaigns tab, filtered to this client only. Read-only.</li>
      <li><strong>Responses</strong> - the same Reporting Snapshot pivot and response list as the team's Responses tab, filtered to this client. Clients can edit <strong>Client Status</strong> and <strong>Confirmed</strong> on their own responses (same field logic the team uses, including the PIN-lock once something's confirmed) - everything else (Campaign, Heddl Status, Notes, Contact, Company) is read-only.</li>
      <li><strong>Calling</strong> - same as described above.</li>
    </ul>
    <p>Overview, Timeline, Delivery, Offers, Client Intake, and Proposal are internal-process tabs and never shown to clients.</p>

    <h2>Reporting (financial)</h2>
    <p>The financial rollup, built from the actual signed GTM Services Agreement for each client (pulled from Drive, not estimated) wherever a contract exists:</p>
    <ul>
      <li><strong>MRR</strong> - this calendar month's contracted base (or actual, once entered) summed across every account with status Onboarding/Active/At Risk/Renewed.</li>
      <li><strong>MRR max</strong> - the same accounts, assuming full performance/bonus attainment.</li>
      <li><strong>Potential MRR from prospects</strong> - sum of the manual "potential $/mo" field across active prospects. Nothing here is estimated automatically - no package is signed yet, so nothing is assumed.</li>
      <li><strong>Churn</strong> - mark an account's status Churned and a "Lost MRR" field appears; that feeds the churned-accounts and lost-MRR totals.</li>
    </ul>
    <p>Each client's contract card shows the month-by-month schedule (base vs. max vs. an editable actual), the plain-English formula for that month's fee, and a link to the actual signed PDF in Drive.</p>

    <h2>Notifications</h2>
    <p>Approving a proposal fires a Slack message to #notifications and an email (via EmailJS) to the configured recipient list. Both run directly from the browser - no backend required. More triggers (delivery item blocked, prospect stalled, account churned) can be added the same way whenever needed.</p>

    <h2>Data & sync</h2>
    <p>Firebase Realtime Database keeps GetGTM's browser and every client's browser looking at the same data, live. Client engagement records, responses, campaigns, and calling leads are all readable and writable by anyone with that client's link - this is what lets clients see live progress, view their own campaign and response data, and update Client Status/Confirmed on the client-facing Responses tab. Prospects and financial Reporting data require a signed-in GetGTM team account to read or write at all - a client link never exposes pipeline or financial data.</p>
    <p>If Firebase is ever unreachable, the tool falls back to the browser's local storage automatically - nothing breaks, it just stops syncing across devices until reconnected.</p>
  `;
}

function renderReleaseNotes() {
  return `
    <h1>Release notes</h1>
    <p class="docs-lead">A running history of what's been built, grouped by milestone. Newest first.</p>

    <div class="rel-entry">
      <div class="rel-tag">Latest</div>
      <h3>Pipeline Phase badge: Presales / Sales / Post-sales CS</h3>
      <p>Added a computed phase badge next to the client name on every client page (team view only), plus a Phase column on the New Engagements table. Entirely derived from data already being updated - the stage tracker, the proposal's stage, and (once signed) the existing Account Status field - so it advances automatically with no separate field to maintain and can never say something different from the underlying data.</p>
    </div>

    <div class="rel-entry">
      <h3>Clicking a client opens their current stage, not the Offers presentation</h3>
      <p>Opening a client from the Clients list used to always open the full-screen Offers presentation - a prospect-facing pitch deck, not useful once you already know the client. It now lands on whichever tab matches where the engagement actually is: Client Intake during Qualification/Scoping, Proposal during Proposal/Commercial Handover, Delivery once signed. Creating a brand-new engagement still opens Offers first, since that's the right thing to show a fresh prospect with no stage history yet.</p>
    </div>

    <div class="rel-entry">
      <h3>Fix: client Campaigns/Responses tabs were empty for real clients</h3>
      <p>The new client-facing Campaigns and Responses tabs relied on data (<code>responses</code>, <code>campaigns</code>) that was only ever synced to the browser after signing in as team - an anonymous client's browser never even asked for it, regardless of what the Firebase rules allowed. Both now sync for everyone, the same way client records and calling leads already did. Firebase rules for <code>responses</code> and <code>campaigns</code> also opened up to match (read/write for anyone with the link, same trust model as the rest of the client-facing data).</p>
    </div>

    <div class="rel-entry">
      <h3>Client view rebuilt: Outcomes, Campaigns, Responses, Calling</h3>
      <p>Replaced the client-facing Overview/Timeline/Delivery tabs with four new ones, in this order: Outcomes (target vs. achieved by month, auto-computed from the same goals data the team sets), Campaigns (read-only stats, filtered to that client), Responses (Client Status/Confirmed editable, everything else read-only), and Calling (unchanged). Internal-process tabs (Offers, Intake, Proposal, Overview, Timeline, Delivery) are no longer part of the client experience at all.</p>
    </div>

    <div class="rel-entry">
      <h3>Preview as client</h3>
      <p>The inert "Client view" label in a client's topbar is now a real button. Any signed-in team member can click <strong>👁 Preview as client</strong> to see byte-for-byte what that client's share link shows - same tabs, same read-only fields - with a clear <strong>← Exit preview</strong> back to the normal team view. A real anonymous client (never signed in) still just sees the plain "Live - synced" badge, no exit button, since they have nothing to exit to.</p>
    </div>

    <div class="rel-entry">
      <h3>Fix: signed-in team sessions could get stuck on the login screen</h3>
      <p>Root-caused a second, more general version of the earlier share-link login bug: a team member with a persisted Firebase session (the normal way returning users stay signed in) could load a fresh tab, have the very first render lock onto "login" before the session finished resolving, and then never get moved off it once the session actually came back - even though the app had correctly recognized them as signed in underneath. Fixed by transitioning to the dashboard whenever a persisted session resolves and the screen is still stuck on login, mirroring what the manual sign-in button already did. Traced live via a browser console dump showing <code>isAuth: true</code> with <code>uiView: "login"</code> - confirmed the exact race with a dedicated regression test before shipping.</p>
    </div>

    <div class="rel-entry">
      <h3>Prospects: Gmail refresh picked up new activity</h3>
      <p>Added a new prospect (Tommaso Trionfi, Shared Studios) found via a fresh Gmail sweep, and updated two existing ones with newer thread activity - Nirav Shah/Emerald Art Studio (two more follow-ups, plus outreach to the original referral source to check continued interest) and Hermaan Kohli/QNu Labs (Rajiv and Swapnesh looped in for a scoping call).</p>
    </div>

    <div class="rel-entry">
      <h3>Fix (properly this time): PDF export blank-space bug</h3>
      <p>The previous attempt at this fix (isolating PDF content in a separate iframe document) introduced a different bug: handing html2canvas a DOM node from another document broke its internal size measurement, producing a captured canvas roughly 7x taller than the real content and dozens of mostly-blank pages. Replaced with a same-document approach instead - temporarily hide every other element on the page during capture, so the PDF content is the only thing there and its position is naturally (0,0), nothing to compensate for. Verified via a real headless-Chromium harness (not just simulated) at up to 32,000px of artificially inflated surrounding page content, across all five PDF export types.</p>
    </div>

    <div class="rel-entry">
      <h3>Fix: Share links could get stuck on login screen</h3>
      <p>Found and fixed a race condition where a fresh visit to a client's share link could land on the login screen and stay there, even though the app had internally routed correctly to the client view. The cause: when Firebase first delivers client data, a one-time background "seed known accounts" save sets a safety flag (used elsewhere to avoid flicker during live edits) - and that flag was incorrectly suppressing the very screen update that would show the client view. That specific update is now unconditional. Added a dedicated regression test that reproduces the exact race and confirms the fix.</p>
    </div>

    <div class="rel-entry">
      <h3>Calling tab</h3>
      <p>New lead-calling workspace, in both the client engagement view (client-facing, share-link accessible, no login) and the dashboard (team-only, with a client picker). Team uploads a Google Sheet of warm leads; clients or team work the list with status tracking (New / Busy / Follow-Up / Meeting Booked / Not Interested / Not Relevant), conditional follow-up/meeting-date/reason fields, email + phone enrichment status and notes, next-step capture, and auto-stamped first/latest call dates. Every change is written to a team-only audit log. Report + PDF export group calls made by day, week, or month.</p>

    <div class="rel-entry">
      <h3>Reporting Snapshot: by Campaign, with totals</h3>

    <div class="rel-entry">
      <h3>Backend: auto-dedupe on every refresh</h3>
      <p>The Dedupe button's letters-only contact-matching logic now also runs automatically inside the backend classifier, on every scheduled and manual refresh - not just when someone clicks the button. Also opportunistically cleans up any pre-existing duplicates from before this was added, even on runs with no new screenshots.</p>

      <h3>Response Tracker: one-click Refresh from Drive</h3>

      <p>The classification prompt was guessing which campaign a reply belonged to by matching message content to campaign names - unreliable, since a reply's subject matter doesn't always map cleanly to a campaign name. Rewrote it to read the campaign directly, verbatim, from the "CAMPAIGN" panel in the screenshot's right sidebar instead - the same field a human would look at - then validate that value against the client's real campaign list before writing.</p>

    <div class="rel-entry">
      <h3>Documentation & release notes</h3>

      <h3>Notifications: Slack + Email</h3>

      <h3>PDF generation: page-break fixes</h3>

    <div class="rel-entry">
      <h3>Prospect to Client conversion</h3>
      <p>Added a Convert button on each prospect that creates a New Engagement pre-filled with their details, with automatic duplicate detection against existing clients.</p>
    </div>

    <div class="rel-entry">
      <h3>Security: Firebase Authentication</h3>
      <p>Replaced the shared password with real email/password sign-in. Split Firebase data into separate paths with different access rules - Prospects and Reporting now require a signed-in team account to even read; client engagement links remain openly accessible (by design, for collaborative delivery tracking).</p>

      <h3>Reporting: MRR, MRR max, churn, real contracts</h3>

    <div class="rel-entry">
      <h3>Prospects module</h3>

    <div class="rel-entry">
      <h3>Phase 1: Real-time Firebase sync + client sharing</h3>

    <div class="rel-entry">
      <h3>Timeline auto-sync</h3>
      <p>The persistent horizontal timeline bar now updates itself from real signals - package selection, proposal stage, delivery checklist completion - instead of requiring manual updates at every step.</p>

    <div class="rel-entry">
      <h3>Delivery tab</h3>
      <p>16-item onboarding-through-launch checklist with status/date/owner/notes per item, unlocked automatically once a proposal is approved, plus a weekly-updates log.</p>
    </div>

// Groups responses by Campaign only, with Total and Confirmed counts per campaign. Shared by both
// the on-screen Reporting Snapshot table and the PDF export's pivot section, so they always match.
function computeReportingSnapshotGroups(responses) {
  var groups = {};
  (responses || []).forEach(function(r) {
    var campaign = r.campaign || "(No campaign set)";
    if (!groups[campaign]) groups[campaign] = { campaign: campaign, total: 0, confirmed: 0 };
    groups[campaign].total++;
    if (r.confirmed) groups[campaign].confirmed++;
  });
  return Object.values(groups).sort(function(a, b) {
    return a.campaign.localeCompare(b.campaign);
  });
}

// Pivot table by Campaign then Month, showing Total and Confirmed counts - sits below the metrics on
// the Responses tab. Only ever reflects whatever's currently filtered/visible.
function renderReportingSnapshot(responses) {
  if (!responses || responses.length === 0) {
    return '<div class="card" style="margin-bottom:16px"><div class="card-head"><h2>Reporting Snapshot</h2></div>' +
      '<div class="card-body"><div class="small" style="color:var(--text-muted)">No responses to summarize yet.</div></div></div>';
  }
  var rows = computeReportingSnapshotGroups(responses);
  var totalTotal = rows.reduce(function(s, g) { return s + g.total; }, 0);
  var totalConfirmed = rows.reduce(function(s, g) { return s + g.confirmed; }, 0);
  var totalPct = totalTotal ? Math.round(totalConfirmed / totalTotal * 100) : 0;
  var tableRows = rows.map(function(g) {
    var pct = g.total ? Math.round(g.confirmed / g.total * 100) : 0;
    return '<tr>' +
      '<td>' + escapeHTML(g.campaign) + '</td>' +
      '<td>' + g.total + '</td>' +
      '<td>' + g.confirmed + '</td>' +
      '<td>' + pct + '%</td>' +
      '</tr>';
  }).join("");
  var totalsRow = '<tr style="font-weight:700;background:var(--surface-1);border-top:2px solid var(--border)">' +
    '<td>Total</td>' +
    '<td>' + totalTotal + '</td>' +
    '<td>' + totalConfirmed + '</td>' +
    '<td>' + totalPct + '%</td>' +
    '</tr>';
  return '<div class="card" style="margin-bottom:16px">' +
    '<div class="card-head"><div><h2>Reporting Snapshot</h2><div class="sub">By campaign, with confirmed counts</div></div></div>' +
    '<div class="card-body" style="padding:0">' +
    '<table><thead><tr><th>Campaign</th><th>Total</th><th>Confirmed</th><th>Confirmed %</th></tr></thead>' +
    '<tbody>' + tableRows + totalsRow + '</tbody></table>' +
    '</div></div>';
}

function renderResponsesView() {
  var allResponses = (state.responses || []).slice().sort((a,b) => (b.date||"").localeCompare(a.date||""));
  var clientNames = Object.values(state.clients).map(function(c) { return c.name; }).sort();
  var savedViews = state.responseSavedViews || [];
  var f = ui.responseFilters || { client: "", heddlStatus: "", clientStatus: "", confirmed: "" };

  var responses = allResponses.filter(function(r) {
    if (f.client && r.client !== f.client) return false;
    if (f.heddlStatus && r.heddlStatus !== f.heddlStatus) return false;
    if (f.clientStatus && r.clientStatus !== f.clientStatus) return false;
    if (f.confirmed === "yes" && !r.confirmed) return false;
    if (f.confirmed === "no" && r.confirmed) return false;
    return true;
  });

  var heddlCounts = { "Positive Reply": 0, "Meeting Booked": 0, "No Fit": 0, "Not Interested": 0 };
  responses.forEach(function(r) { if (heddlCounts[r.heddlStatus] !== undefined) heddlCounts[r.heddlStatus]++; });
  var confirmedCount = responses.filter(function(r) { return r.confirmed; }).length;
  var anyFilterActive = f.client || f.heddlStatus || f.clientStatus || f.confirmed;

  function statusSelectHtml(r, key, options, placeholder) {
    var val = r[key];
    var c = responseStatusColor(val);
    return '<select data-response="' + r.id + '" data-key="' + key + '" class="del-select" style="background:' + c.bg + ';color:' + c.color + ';font-weight:600;border-color:transparent">' +
      '<option value="">' + placeholder + '</option>' +
      options.map(function(s) { return '<option ' + (val===s?'selected':'') + '>' + s + '</option>'; }).join("") +
      '</select>';
  }

  return `
      <div class="kpis">
        <div class="kpi"><div class="label">${anyFilterActive ? 'Responses (filtered)' : 'Total responses logged'}</div><div class="value">${responses.length}${anyFilterActive ? ' / ' + allResponses.length : ''}</div></div>
        <div class="kpi"><div class="label">Positive replies (Heddl)</div><div class="value" style="color:var(--success)">${heddlCounts["Positive Reply"]}</div></div>
        <div class="kpi"><div class="label">Meetings booked (Heddl)</div><div class="value" style="color:var(--brand)">${heddlCounts["Meeting Booked"]}</div></div>
        <div class="kpi"><div class="label">Client confirmed</div><div class="value" style="color:var(--text-secondary)">${confirmedCount} / ${responses.length}</div></div>
      </div>
      <div class="kpis">
        <div class="kpi"><div class="label">Positive response %</div><div class="value" style="color:var(--success)">${responses.length ? Math.round(heddlCounts["Positive Reply"] / responses.length * 100) : 0}%</div></div>
        <div class="kpi"><div class="label">Meetings booked %</div><div class="value" style="color:var(--brand)">${responses.length ? Math.round(heddlCounts["Meeting Booked"] / responses.length * 100) : 0}%</div></div>
        <div class="kpi"><div class="label">Not interested %</div><div class="value" style="color:var(--danger)">${responses.length ? Math.round(heddlCounts["Not Interested"] / responses.length * 100) : 0}%</div></div>
        <div class="kpi"><div class="label">Client confirmed %</div><div class="value" style="color:var(--text-secondary)">${responses.length ? Math.round(confirmedCount / responses.length * 100) : 0}%</div></div>
      </div>

      ${renderReportingSnapshot(responses)}

      <div class="card" style="margin-bottom:16px">
        <div class="card-body" style="padding:14px 18px">
          <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end">
            <div>
              <label class="small" style="display:block;margin-bottom:4px;font-weight:600">Account</label>
              <select data-action="filter-response" data-filter="client" style="padding:6px 10px;border:1px solid var(--brand);border-radius:5px;background:var(--surface-1);min-width:160px;font-weight:600">
                <option value="">All accounts</option>
                ${clientNames.map(function(n) { return `<option value="${escapeAttr(n)}" ${f.client===n?'selected':''}>${escapeHTML(n)}</option>`; }).join("")}
              </select>
            </div>
            <div style="width:1px;align-self:stretch;background:var(--border);margin:0 2px"></div>
            <div>
              <label class="small" style="display:block;margin-bottom:4px">Heddl Status</label>
              <select data-action="filter-response" data-filter="heddlStatus" style="padding:6px 10px;border:0.5px solid var(--border);border-radius:5px;background:var(--surface-1);min-width:140px">
                <option value="">All</option>
                ${RESPONSE_STATUSES.map(function(s) { return `<option ${f.heddlStatus===s?'selected':''}>${s}</option>`; }).join("")}
              </select>
            </div>
            <div>
              <label class="small" style="display:block;margin-bottom:4px">Client Status</label>
              <select data-action="filter-response" data-filter="clientStatus" style="padding:6px 10px;border:0.5px solid var(--border);border-radius:5px;background:var(--surface-1);min-width:140px">
                <option value="">All</option>
                ${RESPONSE_STATUSES.map(function(s) { return `<option ${f.clientStatus===s?'selected':''}>${s}</option>`; }).join("")}
              </select>
            </div>
            <div>
              <label class="small" style="display:block;margin-bottom:4px">Confirmed</label>
              <select data-action="filter-response" data-filter="confirmed" style="padding:6px 10px;border:0.5px solid var(--border);border-radius:5px;background:var(--surface-1);min-width:120px">
                <option value="">All</option>
                <option value="yes" ${f.confirmed==='yes'?'selected':''}>Confirmed</option>
                <option value="no" ${f.confirmed==='no'?'selected':''}>Not confirmed</option>
              </select>
            </div>
            ${anyFilterActive ? '<button class="btn ghost sm" data-action="clear-response-filters">Clear filters</button>' : ''}
            <div style="margin-left:auto;display:flex;gap:8px;align-items:flex-end">
              ${f.client ? '<button class="btn sm" data-action="send-response-report" style="background:var(--brand)">✉ Send report to prospect</button>' : ''}
              ${savedViews.length > 0 ? `
              <div>
                <label class="small" style="display:block;margin-bottom:4px">Saved views</label>
                <select data-action="load-response-view" style="padding:6px 10px;border:0.5px solid var(--border);border-radius:5px;background:var(--surface-1);min-width:140px">
                  <option value="">Load a view...</option>
                  ${savedViews.map(function(v, vi) { return `<option value="${vi}">${escapeHTML(v.name)}</option>`; }).join("")}
                </select>
              </div>` : ''}
              <button class="btn ghost sm" data-action="save-response-view">💾 Save view</button>
            </div>
          </div>
          ${savedViews.length > 0 ? `
          <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
            ${savedViews.map(function(v, vi) { return `<span class="badge pending" style="display:inline-flex;align-items:center;gap:6px;cursor:pointer" data-action="load-response-view-chip" data-view-index="${vi}">${escapeHTML(v.name)} <span data-action="delete-response-view" data-view-index="${vi}" style="opacity:0.6">&times;</span></span>`; }).join("")}
          </div>` : ''}
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>Response Tracker</h2>
          <div style="display:flex;gap:8px">
            <a href="https://drive.google.com/drive/folders/1Hr3GWko3ixmEJZTl6DHgNiJauG502gL8" target="_blank" class="btn ghost sm">📁 Open Drive folder</a>
            <button class="btn ghost sm" data-action="refresh-from-drive" style="color:var(--brand)">🔄 Refresh from Drive</button>
            <button class="btn ghost sm" data-action="dedupe-responses" style="color:var(--danger)">🧹 Dedupe</button>
            <button class="btn ghost sm" data-action="fix-campaigns" style="color:var(--danger)">🔧 Fix Campaigns</button>
            ${f.client ? '<button class="btn ghost sm" data-action="bulk-assign-campaign" style="color:var(--brand)">🏷 Bulk assign campaign</button>' : ''}
            <button class="btn ghost sm" data-action="export-responses-pdf">⬇ Export PDF</button>
            <button class="btn" data-action="add-response">+ Add response</button>
          </div>
        </div>
        <div class="card-body" style="padding:0">
          <div class="small" style="padding:12px 16px;border-bottom:0.5px solid var(--border)">
            Existing records here sync live - no need to refresh to see them or anyone's edits. New screenshots uploaded to Drive are picked up automatically by a backend job every 30 minutes - no button needed. It sets <strong>Heddl Status</strong> from what the reply shows. <strong>Client Status</strong> and <strong>Confirmed</strong> are always set manually, once you've worked with the client to agree on classification.
          </div>
          ${responses.length === 0 ? `<div style="padding:20px;text-align:center;color:var(--text-secondary)">${anyFilterActive ? 'No responses match the current filters.' : 'No responses logged yet.'}</div>` : `
            <div style="overflow-x:auto">
            <table style="min-width:1100px">
              <thead><tr><th>Date</th><th>Account</th><th>Contact</th><th>Company</th><th>Campaign</th><th>Heddl Status</th><th>Client Status</th><th>Confirmed</th><th>Meeting Date</th><th>No Fit Reason</th><th>Actual Reply</th><th>Notes</th><th>Screenshot</th><th></th></tr></thead>
              <tbody>
                ${responses.map(function(r, i) {
                  var locked = !!r.confirmed;
                  var lockAttr = locked ? 'disabled' : '';
                  var lockStyle = locked ? 'opacity:0.65;cursor:not-allowed' : '';
                  return `
                  <tr${locked ? ' style="background:var(--surface-1)"' : ''}>
                    <td><input type="date" ${lockAttr} data-response="${r.id}" data-key="date" value="${escapeAttr(r.date)}" style="border:none;background:transparent;padding:0;width:120px;${lockStyle}"></td>
                    <td>
                      <select ${lockAttr} data-response="${r.id}" data-key="client" class="del-select" style="${lockStyle}">
                        <option value="">-</option>
                        ${clientNames.map(function(n) { return `<option ${r.client===n?'selected':''}>${escapeHTML(n)}</option>`; }).join("")}
                      </select>
                    </td>
                    <td><input ${lockAttr} data-response="${r.id}" data-key="contact" value="${escapeAttr(r.contact)}" placeholder="Contact name" style="border:none;background:transparent;padding:0;width:140px;${lockStyle}"></td>
                    <td><input ${lockAttr} data-response="${r.id}" data-key="company" value="${escapeAttr(r.company || '')}" placeholder="Their company" style="border:none;background:transparent;padding:0;width:130px;${lockStyle}"></td>
                    <td>${(function(){
                      // Dropdown of campaigns for THIS row's client, so blank rows can be assigned in one click
                      // and typos are impossible. Includes the row's current value even if it no longer matches
                      // a live campaign (so nothing silently disappears), plus an explicit "— Unassigned —" option.
                      var rowCampaigns = (state.campaigns || []).filter(function(c) { return c.client === r.client; });
                      var current = r.campaign || "";
                      var currentInList = rowCampaigns.some(function(c) { return c.name === current; });
                      var opts = '<option value="">— Unassigned —</option>';
                      rowCampaigns.forEach(function(c) {
                        opts += '<option value="' + escapeAttr(c.name) + '"' + (c.name === current ? ' selected' : '') + '>' + escapeHTML(c.name) + '</option>';
                      });
                      if (current && !currentInList) {
                        opts += '<option value="' + escapeAttr(current) + '" selected>' + escapeHTML(current) + ' (legacy)</option>';
                      }
                      return '<select ' + lockAttr + ' data-response="' + r.id + '" data-key="campaign" class="del-select" style="max-width:180px;' + lockStyle + '">' + opts + '</select>';
                    })()}</td>
                    <td>${locked ? '<span style="' + (function(){var c=responseStatusColor(r.heddlStatus);return 'background:'+c.bg+';color:'+c.color;})() + ';font-weight:600;padding:3px 8px;border-radius:4px;font-size:12px;display:inline-block">' + escapeHTML(r.heddlStatus||'-') + '</span>' : statusSelectHtml(r, "heddlStatus", RESPONSE_STATUSES, "-")}</td>
                    <td>${locked ? '<span style="' + (function(){var c=responseStatusColor(r.clientStatus);return 'background:'+c.bg+';color:'+c.color;})() + ';font-weight:600;padding:3px 8px;border-radius:4px;font-size:12px;display:inline-block">' + escapeHTML(r.clientStatus||'Not set') + '</span>' : statusSelectHtml(r, "clientStatus", RESPONSE_STATUSES, "Not set")}</td>
                    <td style="text-align:center">
                      <input type="checkbox" data-response="${r.id}" data-key="confirmed" data-type="checkbox" ${r.confirmed ? 'checked' : ''} style="width:16px;height:16px;cursor:pointer">
                      ${locked ? '<div class="small" style="color:var(--text-muted);margin-top:2px">🔒 locked</div>' : ''}
                    </td>
                    <td>${r.clientStatus === "Meeting Booked" ? '<input type="date" ' + lockAttr + ' data-response="' + r.id + '" data-key="meetingBookedDate" value="' + escapeAttr(r.meetingBookedDate || '') + '" style="border:none;background:transparent;padding:0;width:100%;' + lockStyle + '">' : '<span class="small" style="color:var(--text-muted)">-</span>'}</td>
                    <td>${r.clientStatus === "No Fit" ? '<input ' + lockAttr + ' data-response="' + r.id + '" data-key="noFitReason" value="' + escapeAttr(r.noFitReason || '') + '" placeholder="Why not a fit" style="border:none;background:transparent;padding:0;width:100%;' + lockStyle + '">' : '<span class="small" style="color:var(--text-muted)">-</span>'}</td>
                    <td><input ${lockAttr} data-response="${r.id}" data-key="actualReply" value="${escapeAttr(r.actualReply || '')}" placeholder="Verbatim reply text" style="border:none;background:transparent;padding:0;width:200px;${lockStyle}"></td>
                    <td><input ${lockAttr} data-response="${r.id}" data-key="notes" value="${escapeAttr(r.notes)}" placeholder="Context" style="border:none;background:transparent;padding:0;width:180px;${lockStyle}"></td>
                    <td>${r.screenshotUrl ? '<a href="' + escapeAttr(r.screenshotUrl) + '" target="_blank" class="small" style="color:var(--brand)">📎 ' + escapeHTML((r.screenshotRef||'view').slice(0,18)) + '…</a>' : '<span class="small" style="color:var(--text-muted)">' + escapeHTML((r.screenshotRef||'-').slice(0,18)) + '</span>'}</td>
                    <td><button class="btn ghost sm" data-action="delete-response" data-id="${r.id}" ${lockAttr}>&#128465;</button></td>
                  </tr>
                `;}).join("")}
              </tbody>
            </table>
            </div>
          `}
        </div>
      </div>
  `;
}

function reportKey(clientName, monthLabel) { return clientName + "__" + monthLabel; }

function renderReportingView() {
  if (!state.revenueActuals) state.revenueActuals = {};
  if (!state.responses) state.responses = [];
  var names = Object.keys(REVENUE_CONTRACTS);
  var today = new Date();
  var ACCOUNT_STATUSES = ["Onboarding", "Active", "At Risk", "Paused", "Renewed", "Churned"];

  var totalBase = 0, totalMax = 0, totalActual = 0, actualEntries = 0;
  var mrr = 0, mrrMax = 0, churnedCount = 0, churnedMRR = 0;

  var clientBlocks = names.map(function(name) {
    var contract = REVENUE_CONTRACTS[name];
    var c = Object.values(state.clients).find(function(cl) { return cl.name === name; });
    var status = c ? (c.accountStatus || "") : "";
    var clientBase = 0, clientMax = 0;

    if (status === "Churned") {
      churnedCount++;
      var lost = c && c.lostMRR ? parseFloat(c.lostMRR) : 0;
      if (!isNaN(lost)) churnedMRR += lost;
    }

    var rows = contract.schedule.map(function(row) {
      var key = reportKey(name, row.label);
      var actualVal = state.revenueActuals[key] || "";
      clientBase += row.base;
      clientMax += row.max;
      totalBase += row.base;
      totalMax += row.max;
      if (actualVal !== "" && !isNaN(parseFloat(actualVal))) { totalActual += parseFloat(actualVal); actualEntries++; }

      var isCurrent = row.start && row.end && today >= new Date(row.start) && today <= new Date(row.end + "T23:59:59");
      if (isCurrent && status && ["Onboarding","Active","At Risk","Renewed"].indexOf(status) !== -1) {
        mrr += (actualVal !== "" && !isNaN(parseFloat(actualVal))) ? parseFloat(actualVal) : row.base;
        mrrMax += row.max;
      }

      return '<tr' + (isCurrent ? ' style="background:var(--surface-1)"' : '') + '>' +
        '<td><strong>' + escapeHTML(row.label) + (isCurrent ? ' <span class="badge done" style="font-size:9px">Current</span>' : '') + '</strong><div class="small">' + escapeHTML(row.period) + '</div></td>' +
        '<td>$' + row.base.toLocaleString() + '</td>' +
        '<td>$' + row.max.toLocaleString() + '</td>' +
        '<td><input type="number" placeholder="-" data-report="' + escapeAttr(key) + '" value="' + escapeAttr(actualVal) + '" style="width:90px;border:0.5px solid var(--border);border-radius:4px;padding:4px 6px;background:var(--surface-1)"></td>' +
        '<td><div class="small">' + escapeHTML(row.formula) + '</div></td>' +
        '</tr>';
    }).join("");

    var noContract = contract.schedule.length === 0;

    var statusDropdown = c ? (
      '<select data-account-status="' + c.id + '" style="font-size:11px;padding:4px 8px;border:0.5px solid var(--border);border-radius:4px;background:var(--surface-1)">' +
        '<option value="">Not set</option>' +
        ACCOUNT_STATUSES.map(function(s) { return '<option value="' + s + '"' + (status === s ? ' selected' : '') + '>' + s + '</option>'; }).join("") +
      '</select>'
    ) : '';

    var lostMrrInput = (c && status === "Churned") ?
      '<div style="margin-top:8px"><label class="small">Lost MRR ($/mo)</label><br><input type="number" placeholder="0" data-lost-mrr="' + c.id + '" value="' + escapeAttr(c.lostMRR || "") + '" style="width:120px;border:0.5px solid var(--border);border-radius:4px;padding:4px 6px;background:var(--surface-1);margin-top:2px"></div>' : '';

    var sourceLine = contract.sourceUrl
      ? '<div class="small" style="margin-top:4px;color:var(--text-muted)">Source: <a href="' + escapeAttr(contract.sourceUrl) + '" target="_blank" style="color:var(--brand)">' + escapeHTML(contract.sourceDoc) + '</a></div>'
      : '<div class="small" style="margin-top:4px;color:var(--text-muted)">Source: ' + escapeHTML(contract.sourceDoc) + '</div>';

    return '<div class="card" style="margin-bottom:16px">' +
      '<div class="card-head"><div>' +
        '<h2>' + escapeHTML(name) + (contract.confirmed ? '' : ' <span class="badge pending" style="margin-left:6px">Unconfirmed</span>') + '</h2>' +
        '<div class="sub">' + (contract.agreementDate ? 'Signed ' + escapeHTML(contract.agreementDate) + ' - ' : '') + escapeHTML(contract.term) + '</div>' +
      '</div>' +
      (c ? '<div>' + statusDropdown + lostMrrInput + '</div>' : '') +
      '</div>' +
      '<div class="card-body">' +
      (noContract ?
        '<div class="small" style="padding:8px 0;color:var(--text-muted)">' + escapeHTML(contract.notes) + '</div>' :
        '<table><thead><tr><th>Month</th><th>Contracted base</th><th>Contracted max</th><th>Actual invoiced</th><th>Formula</th></tr></thead>' +
        '<tbody>' + rows +
        '<tr style="border-top:1px solid var(--border)"><td><strong>Total</strong></td><td><strong>$' + clientBase.toLocaleString() + '</strong></td><td><strong>$' + clientMax.toLocaleString() + '</strong></td><td></td><td></td></tr>' +
        '</tbody></table>' +
        '<div class="small" style="margin-top:10px;color:var(--text-muted)">' + escapeHTML(contract.notes) + '</div>' +
        sourceLine
      ) +
      '</div></div>';
  }).join("");

  var prospectPotentialMRR = (state.prospects || [])
    .filter(function(p) { return ["Stalled","Closed Lost","Not a Fit","Converted"].indexOf(p.status) === -1; })
    .reduce(function(sum, p) { var v = parseFloat(p.potentialValue); return sum + (isNaN(v) ? 0 : v); }, 0);

  return `
      <div class="kpis">
        <div class="kpi"><div class="label">MRR (current month, active)</div><div class="value" style="color:var(--brand)">$${mrr.toLocaleString()}</div></div>
        <div class="kpi"><div class="label">MRR max (full performance)</div><div class="value" style="color:var(--brand)">$${mrrMax.toLocaleString()}</div></div>
        <div class="kpi"><div class="label">Potential MRR from prospects</div><div class="value">$${prospectPotentialMRR.toLocaleString()}</div></div>
        <div class="kpi"><div class="label">Contracted base (all accounts)</div><div class="value">$${totalBase.toLocaleString()}</div></div>
        <div class="kpi"><div class="label">Contracted max (with performance)</div><div class="value">$${totalMax.toLocaleString()}</div></div>
        <div class="kpi"><div class="label">Actual entered so far</div><div class="value" style="color:var(--success)">$${totalActual.toLocaleString()}</div></div>
        <div class="kpi"><div class="label">Churned accounts</div><div class="value" style="color:${churnedCount?'var(--danger)':'inherit'}">${churnedCount}</div></div>
        <div class="kpi"><div class="label">MRR lost to churn</div><div class="value" style="color:${churnedMRR?'var(--danger)':'inherit'}">$${churnedMRR.toLocaleString()}</div></div>
      </div>
      <div class="small" style="margin-bottom:16px;color:var(--text-secondary)">MRR sums the current calendar month's contracted base (or actual, if entered) across accounts with status Onboarding, Active, At Risk, or Renewed. MRR max assumes full performance/bonus attainment on those same accounts this month. Potential MRR from prospects is manually entered per prospect (in the Prospects tab) since no package is signed yet - nothing here is assumed. Paused and Churned accounts are excluded from MRR. Set each account's status in its card below - status is only auto-set once; after that it's yours to manage.</div>
      ${renderGoalsAchievedBlock()}
      ${renderResponseRollupBlock()}
      ${clientBlocks}
  `;
}

function renderGoalsAchievedBlock() {
  var rows = [];
  var multiLineClients = [];
  Object.values(state.clients).forEach(function(c) {
    if (!c.proposal || c.proposal.stage !== "approved") return;

    if (c.goalLines && c.goalLines.length > 0) {
      multiLineClients.push(c.name);
      // Per-line rows
      c.goalLines.forEach(function(line) {
        ["m1","m2","m3"].forEach(function(m) {
          var gm = line.goals[m];
          if (!gm) return;
          [["Positive replies", gm.replies, gm.achievedReplies], ["Meetings booked", gm.meetings, gm.achievedMeetings]].forEach(function(pair) {
            var metric = pair[0], target = pair[1], achieved = pair[2];
            if (!target && !achieved) return;
            rows.push({ client: c.name, line: line.name, month: m.toUpperCase(), metric: metric, target: target, achieved: achieved });
          });
        });
      });
      // Combined rollup row per month/metric, summed across all lines
      ["m1","m2","m3"].forEach(function(m) {
        [["Positive replies", "replies", "achievedReplies"], ["Meetings booked", "meetings", "achievedMeetings"]].forEach(function(pair) {
          var metric = pair[0], tKey = pair[1], aKey = pair[2];
          var tSum = 0, aSum = 0, anyT = false, anyA = false;
          c.goalLines.forEach(function(line) {
            var t = parseFloat(line.goals[m][tKey]), a = parseFloat(line.goals[m][aKey]);
            if (!isNaN(t)) { tSum += t; anyT = true; }
            if (!isNaN(a)) { aSum += a; anyA = true; }
          });
          if (!anyT && !anyA) return;
          rows.push({ client: c.name, line: "Combined", month: m.toUpperCase(), metric: metric,
            target: anyT ? String(tSum) : "", achieved: anyA ? String(aSum) : "", isRollup: true });
        });
      });
    } else if (c.goals) {
      ["m1","m2","m3"].forEach(function(m) {
        var gm = c.goals[m];
        if (!gm) return;
        [["Positive replies", gm.replies, gm.achievedReplies], ["Meetings booked", gm.meetings, gm.achievedMeetings]].forEach(function(pair) {
          var metric = pair[0], target = pair[1], achieved = pair[2];
          if (!target && !achieved) return;
          rows.push({ client: c.name, line: "-", month: m.toUpperCase(), metric: metric, target: target, achieved: achieved });
        });
      });
    }
  });

  if (rows.length === 0) {
    return '<div class="card" style="margin-bottom:16px"><div class="card-head"><h2>Goals vs. Achieved</h2></div>' +
      '<div class="card-body"><div class="small" style="color:var(--text-muted)">No monthly goals set yet across any client. Add targets in each client Overview tab and they will show up here.</div></div></div>';
  }

  var tableRows = rows.map(function(r) {
    var tNum = parseFloat(r.target), aNum = parseFloat(r.achieved);
    var pctHtml = '<span class="small" style="color:var(--text-muted)">-</span>';
    if (tNum && !isNaN(tNum) && !isNaN(aNum)) {
      var pct = Math.round((aNum / tNum) * 100);
      var color = pct >= 100 ? "var(--success)" : pct >= 60 ? "var(--brand)" : "var(--danger)";
      pctHtml = '<strong style="color:' + color + '">' + pct + '%</strong>';
    }
    return '<tr' + (r.isRollup ? ' style="background:var(--surface-1);font-weight:600"' : '') + '>' +
      '<td><strong>' + escapeHTML(r.client) + '</strong></td>' +
      '<td>' + escapeHTML(r.line || "-") + '</td>' +
      '<td>' + escapeHTML(r.month) + '</td>' +
      '<td>' + escapeHTML(r.metric) + '</td>' +
      '<td>' + escapeHTML(r.target || "-") + '</td>' +
      '<td>' + escapeHTML(r.achieved || "-") + '</td>' +
      '<td>' + pctHtml + '</td>' +
      '</tr>';
  }).join("");

  var note = multiLineClients.length > 0
    ? '<div class="small" style="padding:10px 16px;border-top:0.5px solid var(--border);color:var(--text-muted)">' +
      '<strong>' + multiLineClients.map(escapeHTML).join(", ") + '</strong> ' + (multiLineClients.length === 1 ? "has" : "have") +
      ' independent KPI lines per their signed contract (separate product lines, each assessed independently). ' +
      'Each line is shown individually, with a <strong>Combined</strong> row summing both for a portfolio-level view.</div>'
    : '';

  return '<div class="card" style="margin-bottom:16px">' +
    '<div class="card-head"><div><h2>Goals vs. Achieved</h2><div class="sub">Every client with monthly targets set, across M1/M2/M3 - Achieved here is entered manually per month</div></div></div>' +
    '<div class="card-body" style="padding:0">' +
    '<table><thead><tr><th>Client</th><th>Line</th><th>Month</th><th>Metric</th><th>Target</th><th>Achieved</th><th>% Achieved</th></tr></thead>' +
    '<tbody>' + tableRows + '</tbody></table>' +
    note +
    '<div class="small" style="padding:10px 16px;border-top:0.5px solid var(--border);color:var(--text-muted)">For achievement based only on client-confirmed replies (not monthly targets), see <strong>Confirmed Achievement &amp; Billing</strong> below - it counts only responses marked Confirmed in the Responses tab.</div>' +
    '</div></div>';
}

function renderResponseRollupBlock() {
  var responses = state.responses || [];
  if (!state.responseBilling) state.responseBilling = {};
  if (responses.length === 0) {
    return '<div class="card" style="margin-bottom:16px"><div class="card-head"><h2>Confirmed Achievement &amp; Billing</h2></div>' +
      '<div class="card-body"><div class="small" style="color:var(--text-muted)">No responses logged yet. Log them from the Responses tab, or ask Claude to check the response screenshots Drive folder.</div></div></div>';
  }

  var byClient = {};
  responses.forEach(function(r) {
    var key = r.client || "(Unassigned)";
    if (!byClient[key]) byClient[key] = { confirmedPositive: 0, confirmedMeetings: 0, totalConfirmed: 0, total: 0 };
    byClient[key].total++;
    if (!r.confirmed) return; // only confirmed responses count toward achievement/billing
    // Client Status is the agreed-upon final classification once confirmed; fall back to Heddl Status if not set.
    var finalStatus = r.clientStatus || r.heddlStatus;
    if (finalStatus === "Positive Reply") byClient[key].confirmedPositive++;
    if (finalStatus === "Meeting Booked") byClient[key].confirmedMeetings++;
    byClient[key].totalConfirmed++;
  });

  var clientKeys = Object.keys(byClient).sort();
  var totalBillAmount = 0, totalConfirmed = 0, totalBilled = 0, totalPaid = 0;

  var rows = clientKeys.map(function(client) {
    var c = byClient[client];
    var billing = state.responseBilling[client] || { amount: "", billed: false, paid: false };
    var amt = parseFloat(billing.amount);
    if (!isNaN(amt)) totalBillAmount += amt;
    totalConfirmed += c.totalConfirmed;
    if (billing.billed) totalBilled++;
    if (billing.paid) totalPaid++;
    return '<tr>' +
      '<td><strong>' + escapeHTML(client) + '</strong></td>' +
      '<td>' + c.confirmedPositive + '</td>' +
      '<td>' + c.confirmedMeetings + '</td>' +
      '<td>' + c.totalConfirmed + ' / ' + c.total + '</td>' +
      '<td><input type="number" placeholder="0" data-billing="' + escapeAttr(client) + '" data-key="amount" value="' + escapeAttr(billing.amount || "") + '" style="width:100px;border:0.5px solid var(--border);border-radius:4px;padding:4px 6px;background:var(--surface-1)"></td>' +
      '<td style="text-align:center"><input type="checkbox" data-billing="' + escapeAttr(client) + '" data-key="billed" data-type="checkbox" ' + (billing.billed ? 'checked' : '') + ' style="width:16px;height:16px;cursor:pointer"></td>' +
      '<td style="text-align:center"><input type="checkbox" data-billing="' + escapeAttr(client) + '" data-key="paid" data-type="checkbox" ' + (billing.paid ? 'checked' : '') + ' style="width:16px;height:16px;cursor:pointer"></td>' +
      '</tr>';
  }).join("");

  var totalRow = '<tr style="border-top:1px solid var(--border);background:var(--surface-1);font-weight:600">' +
    '<td>Total</td><td></td><td></td><td>' + totalConfirmed + '</td>' +
    '<td>$' + totalBillAmount.toLocaleString() + '</td>' +
    '<td style="text-align:center">' + totalBilled + ' / ' + clientKeys.length + '</td>' +
    '<td style="text-align:center">' + totalPaid + ' / ' + clientKeys.length + '</td>' +
    '</tr>';

  return '<div class="card" style="margin-bottom:16px">' +
    '<div class="card-head"><div><h2>Confirmed Achievement &amp; Billing</h2><div class="sub">Only Confirmed responses count here - grouped by account, with billing status and totals</div></div></div>' +
    '<div class="card-body" style="padding:0">' +
    '<table><thead><tr><th>Client</th><th>Confirmed Positive Reply</th><th>Confirmed Meeting Booked</th><th>Confirmed / Total</th><th>Bill Amount</th><th>Billed</th><th>Paid</th></tr></thead>' +
    '<tbody>' + rows + totalRow + '</tbody></table>' +
    '</div></div>';
}

// Single-client version of the goal-vs-achieved computation used by renderGoalsAchievedBlock() (which
// rolls this up across ALL clients for the team dashboard). Extracted so both can share the exact same
// target/achieved/percentage math and never drift apart.
function computeClientGoalRows(c) {
  var rows = [];
  if (c.goalLines && c.goalLines.length > 0) {
    c.goalLines.forEach(function(line) {
      ["m1","m2","m3"].forEach(function(m) {
        var gm = line.goals[m];
        if (!gm) return;
        [["Positive replies", gm.replies, gm.achievedReplies], ["Meetings booked", gm.meetings, gm.achievedMeetings]].forEach(function(pair) {
          var metric = pair[0], target = pair[1], achieved = pair[2];
          if (!target && !achieved) return;
          rows.push({ line: line.name, month: m.toUpperCase(), metric: metric, target: target, achieved: achieved });
        });
      });
    });
    if (c.goalLines.length > 1) {
      ["m1","m2","m3"].forEach(function(m) {
        [["Positive replies", "replies", "achievedReplies"], ["Meetings booked", "meetings", "achievedMeetings"]].forEach(function(pair) {
          var metric = pair[0], tKey = pair[1], aKey = pair[2];
          var tSum = 0, aSum = 0, anyT = false, anyA = false;
          c.goalLines.forEach(function(line) {
            var t = parseFloat(line.goals[m][tKey]), a = parseFloat(line.goals[m][aKey]);
            if (!isNaN(t)) { tSum += t; anyT = true; }
            if (!isNaN(a)) { aSum += a; anyA = true; }
          });
          if (!anyT && !anyA) return;
          rows.push({ line: "Combined", month: m.toUpperCase(), metric: metric,
            target: anyT ? String(tSum) : "", achieved: anyA ? String(aSum) : "", isRollup: true });
        });
      });
    }
  } else if (c.goals) {
    ["m1","m2","m3"].forEach(function(m) {
      var gm = c.goals[m];
      if (!gm) return;
      [["Positive replies", gm.replies, gm.achievedReplies], ["Meetings booked", gm.meetings, gm.achievedMeetings]].forEach(function(pair) {
        var metric = pair[0], target = pair[1], achieved = pair[2];
        if (!target && !achieved) return;
        rows.push({ line: "-", month: m.toUpperCase(), metric: metric, target: target, achieved: achieved });
      });
    });
  }
  return rows;
}

// Client-facing Outcomes tab: what was promised per month (target) vs what actually happened
// (achieved), with a computed % achievement. Read-only - these numbers are set during
// Overview/Proposal by the team, not edited here. Reuses computeClientGoalRows() so this can never
// show different numbers than the team-side rollup on the dashboard.
function renderClientOutcomesTab(c) {
  var rows = computeClientGoalRows(c);
  if (rows.length === 0) {
    return '<div class="card"><div class="card-body" style="padding:32px;text-align:center;color:var(--text-muted)">' +
      'Monthly targets haven\'t been set yet. Once your GetGTM team adds them, you\'ll see target vs. achieved numbers here.' +
      '</div></div>';
  }
  var tableRows = rows.map(function(r) {
    var tNum = parseFloat(r.target), aNum = parseFloat(r.achieved);
    var pctHtml = '<span class="small" style="color:var(--text-muted)">-</span>';
    if (tNum && !isNaN(tNum) && !isNaN(aNum)) {
      var pct = Math.round((aNum / tNum) * 100);
      var color = pct >= 100 ? "var(--success)" : pct >= 60 ? "var(--brand)" : "var(--danger)";
      pctHtml = '<strong style="color:' + color + '">' + pct + '%</strong>';
    }
    return '<tr' + (r.isRollup ? ' style="background:var(--surface-1);font-weight:600"' : '') + '>' +
      (rows.some(function(x) { return x.line && x.line !== "-"; }) ? '<td>' + escapeHTML(r.line || "-") + '</td>' : '') +
      '<td>' + escapeHTML(r.month) + '</td>' +
      '<td>' + escapeHTML(r.metric) + '</td>' +
      '<td>' + escapeHTML(r.target || "-") + '</td>' +
      '<td>' + escapeHTML(r.achieved || "-") + '</td>' +
      '<td>' + pctHtml + '</td>' +
      '</tr>';
  }).join("");
  var showLineCol = rows.some(function(x) { return x.line && x.line !== "-"; });
  return '<div class="card">' +
    '<div class="card-head"><h2>Outcomes</h2><div class="sub">What was promised each month vs. what was actually achieved.</div></div>' +
    '<div class="card-body" style="padding:0"><div style="overflow-x:auto"><table>' +
    '<thead><tr>' + (showLineCol ? '<th>Line</th>' : '') + '<th>Month</th><th>Metric</th><th>Target</th><th>Achieved</th><th>% Achieved</th></tr></thead>' +
    '<tbody>' + tableRows + '</tbody></table></div></div></div>';
}

// Client-facing Campaigns tab: same stats as the team's Campaigns view, filtered to this one client,
// read-only (plain text instead of inputs - editing campaign data belongs to the team dashboard).
function renderClientCampaignsTab(c) {
  var campaigns = (state.campaigns || []).filter(function(camp) { return camp.client === c.name; })
    .slice().sort(function(a, b) { return (b.createdDate || "").localeCompare(a.createdDate || ""); });

  var totalContacts = campaigns.reduce(function(s, camp) { return s + (camp.totalContacts || 0); }, 0);
  var totalAccepted = campaigns.reduce(function(s, camp) { return s + (camp.accepted || 0); }, 0);
  var totalReplies = campaigns.reduce(function(s, camp) { return s + (camp.replies || 0); }, 0);
  var replyRate = totalContacts ? Math.round(totalReplies / totalContacts * 100 * 10) / 10 : 0;

  var rows = campaigns.map(function(camp) {
    return '<tr>' +
      '<td><strong>' + escapeHTML(camp.name || "-") + '</strong></td>' +
      '<td>' + escapeHTML(camp.status || "-") + '</td>' +
      '<td style="white-space:nowrap">' + escapeHTML(camp.createdDate || "-") + '</td>' +
      '<td>' + (camp.totalContacts || 0) + '</td>' +
      '<td>' + (camp.accepted || 0) + '</td>' +
      '<td>' + (camp.messagesSent || 0) + '</td>' +
      '<td style="font-weight:700;color:var(--success)">' + (camp.replies || 0) + '</td>' +
      '<td>' + (camp.reactions || 0) + '</td>' +
      '</tr>';
  }).join("");

  return '<div class="kpis">' +
    '<div class="kpi"><div class="label">Total campaigns</div><div class="value">' + campaigns.length + '</div></div>' +
    '<div class="kpi"><div class="label">Contacts reached</div><div class="value">' + totalContacts.toLocaleString() + '</div></div>' +
    '<div class="kpi"><div class="label">Connections accepted</div><div class="value" style="color:var(--brand)">' + totalAccepted.toLocaleString() + '</div></div>' +
    '<div class="kpi"><div class="label">Total replies</div><div class="value" style="color:var(--success)">' + totalReplies + '</div></div>' +
    '<div class="kpi"><div class="label">Reply rate</div><div class="value">' + replyRate + '%</div></div>' +
    '</div>' +
    '<div class="card">' +
    '<div class="card-head"><h2>Campaigns</h2><button class="btn ghost sm" data-action="client-export-campaigns-pdf">⬇ Export PDF</button></div>' +
    '<div class="card-body" style="padding:0">' +
    (campaigns.length === 0 ? '<div style="padding:20px;text-align:center;color:var(--text-secondary)">No campaigns logged yet.</div>' :
      '<div style="overflow-x:auto"><table><thead><tr><th>Campaign</th><th>Status</th><th>Created</th><th>Contacts</th><th>Accepted</th><th>Messages</th><th>Replies</th><th>Reactions</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>') +
    '</div></div>';
}

// Client-facing Responses tab: same pivot + response list as the team's Responses view, filtered to
// this client. Only Client Status and Confirmed are editable (reuses the exact same [data-response]
// field-change listener the team table uses, including the PIN-lock on unconfirming - no separate
// wiring needed). Every other field is read-only text, since campaign assignment, Heddl Status,
// notes, etc. are set by the classification pipeline or the team, not the client.
function renderClientResponsesTab(c) {
  var responses = (state.responses || []).filter(function(r) { return r.client === c.name; })
    .slice().sort(function(a, b) { return (b.date || "").localeCompare(a.date || ""); });

  var heddlCounts = { "Positive Reply": 0, "Meeting Booked": 0, "No Fit": 0, "Not Interested": 0 };
  responses.forEach(function(r) { if (heddlCounts[r.heddlStatus] !== undefined) heddlCounts[r.heddlStatus]++; });
  var confirmedCount = responses.filter(function(r) { return r.confirmed; }).length;

  function statusSelectHtml(r, key, options, placeholder) {
    var val = r[key];
    var col = responseStatusColor(val);
    return '<select data-response="' + r.id + '" data-key="' + key + '" class="del-select" style="background:' + col.bg + ';color:' + col.color + ';font-weight:600;border-color:transparent">' +
      '<option value="">' + placeholder + '</option>' +
      options.map(function(s) { return '<option ' + (val === s ? 'selected' : '') + '>' + s + '</option>'; }).join("") +

    var locked = !!r.confirmed;
    return '<tr' + (locked ? ' style="background:var(--surface-1)"' : '') + '>' +
      '<td style="white-space:nowrap">' + escapeHTML(r.date || "-") + '</td>' +

      '<td>' + escapeHTML(r.company || "-") + '</td>' +
      '<td>' + escapeHTML(r.campaign || "Unassigned") + '</td>' +
      '<td><span style="' + (function() { var col = responseStatusColor(r.heddlStatus); return 'background:' + col.bg + ';color:' + col.color; })() + ';font-weight:600;padding:3px 8px;border-radius:4px;font-size:12px;display:inline-block">' + escapeHTML(r.heddlStatus || "-") + '</span></td>' +
      '<td>' + statusSelectHtml(r, "clientStatus", RESPONSE_STATUSES, "Not set") + '</td>' +
      '<td style="text-align:center"><input type="checkbox" data-response="' + r.id + '" data-key="confirmed" data-type="checkbox" ' + (r.confirmed ? 'checked' : '') + ' style="width:16px;height:16px;cursor:pointer">' +
      (locked ? '<div class="small" style="color:var(--text-muted);margin-top:2px">🔒 locked</div>' : '') + '</td>' +
      '<td>' + (r.clientStatus === "Meeting Booked" ? escapeHTML(r.meetingBookedDate || "-") : '<span class="small" style="color:var(--text-muted)">-</span>') + '</td>' +
      '<td>' + (r.clientStatus === "No Fit" ? escapeHTML(r.noFitReason || "-") : '<span class="small" style="color:var(--text-muted)">-</span>') + '</td>' +
      '<td style="max-width:200px">' + escapeHTML((r.notes || "").length > 80 ? (r.notes || "").slice(0, 80) + "…" : (r.notes || "")) + '</td>' +
      '<td>' + (r.screenshotUrl ? '<a href="' + escapeAttr(r.screenshotUrl) + '" target="_blank" class="small" style="color:var(--brand)">📎 view</a>' : '<span class="small" style="color:var(--text-muted)">-</span>') + '</td>' +
      '</tr>';
  }).join("");

  return '<div class="kpis">' +
    '<div class="kpi"><div class="label">Total responses</div><div class="value">' + responses.length + '</div></div>' +
    '<div class="kpi"><div class="label">Positive replies</div><div class="value" style="color:var(--success)">' + heddlCounts["Positive Reply"] + '</div></div>' +
    '<div class="kpi"><div class="label">Meetings booked</div><div class="value" style="color:var(--brand)">' + heddlCounts["Meeting Booked"] + '</div></div>' +
    '<div class="kpi"><div class="label">Confirmed</div><div class="value">' + confirmedCount + ' / ' + responses.length + '</div></div>' +
    '</div>' +
    renderReportingSnapshot(responses) +
    '<div class="card">' +
    '<div class="card-head"><h2>Response Tracker</h2><button class="btn ghost sm" data-action="client-export-responses-pdf">⬇ Export PDF</button></div>' +
    '<div class="card-body" style="padding:0">' +

function renderOffersTab(c) {
  var page = ui.offerPage || 0;
  var slide = SLIDES[page];
  var total = SLIDES.length;

  var prevBtn = page === 0
    ? '<button class="ppt-btn ppt-btn-sec" disabled style="opacity:.3">\u2190</button>'
    : '<button class="ppt-btn ppt-btn-sec" data-action="offer-prev">\u2190</button>';
  var nextBtn = page < total - 1
    ? '<button class="ppt-btn" data-action="offer-next">Next \u2192</button>'
    : '<button class="ppt-btn" data-action="offer-next">Done \u2192</button>';

  var dotsHtml = SLIDES.map(function(s, i) {
    return '<div class="ppt-dot' + (i === page ? ' active' : '') + '"></div>';
  }).join("");

  var topbar = '<div class="ppt-topbar">' +
    '<div class="ppt-brand"><div class="logo">GTM</div> GetGTM</div>' +
    '<div class="ppt-counter">' + (page + 1) + ' / ' + total + '</div>' +
    '<div class="ppt-nav">' + (page === 0 ? '<button class="ppt-btn-sec" data-action="skip-ppt" style="margin-right:8px">Skip presentation</button>' : '') + prevBtn + nextBtn + '</div>' +
  '</div>';

  var footer = '<div class="ppt-footer">' +
    '<div class="ppt-category">' + escapeHTML(slide.category) + '</div>' +
    '<div class="ppt-dots">' + dotsHtml + '</div>' +
    '<div class="ppt-hint">Prospect view</div>' +
  '</div>';

  if (slide.type === "problem") {
    return renderProblemSlide(slide, topbar, footer);
  }
  if (slide.type === "problem-summary") {
    return renderProblemSummary(slide, topbar, footer);
  }
  if (slide.type === "outbound-detail") {
    return renderOutboundSlide(slide, topbar, footer, c);
  }
  if (slide.type === "offer") {
    return renderOfferSlide(slide, topbar, footer);
  }

  return '<div class="ppt-fullscreen">' + topbar +
    '<div style="flex:1;display:flex;align-items:center;justify-content:center;background:#000;color:#888">' +
    'Unknown slide type</div>' + footer + '</div>';
}

function renderProblemSlide(s, topbar, footer) {

  var centerLines = s.center.lines.map(function(pair) {

      '<div class="gap-desc">' + escapeHTML(pair[1]) + '</div>' +
    '</div>';
  }).join("");

  var rightLines = s.right.lines.map(function(l) {
    return '<div class="ppt-line ppt-line-check">\u2713 ' + escapeHTML(l) + '</div>';
  }).join("");

  var tableRows = s.table.map(function(row) {
    return '<tr><td class="tbl-before">' + escapeHTML(row[0]) + '</td>' +
      '<td class="tbl-after">' + escapeHTML(row[1]) + '</td></tr>';

function goalsPctCell(target, achieved) {
  var tNum = parseFloat(target), aNum = parseFloat(achieved);
  if (!tNum || isNaN(tNum) || isNaN(aNum)) return '<span class="small" style="color:var(--text-muted)">-</span>';
  var pct = Math.round((aNum / tNum) * 100);
  var color = pct >= 100 ? "var(--success)" : pct >= 60 ? "var(--brand)" : "var(--danger)";
  return '<strong style="color:' + color + '">' + pct + '%</strong>';
}

function renderGoalsTable(goalsObj, lineIndex) {
  // lineIndex: null/undefined for the single-line (default) case using data-goal="m.metric";
  // a number for the multi-line case using data-goalline="lineIndex.m.metric"
  var attrName = lineIndex === undefined || lineIndex === null ? "data-goal" : "data-goalline";
  function keyFor(m, metric) { return lineIndex === undefined || lineIndex === null ? (m + "." + metric) : (lineIndex + "." + m + "." + metric); }
  var rows = ["m1","m2","m3"].map(function(m) {
    var gm = goalsObj[m];
    var mLabel = m.toUpperCase();
    return '<tr>' +
      '<td style="font-weight:600" rowspan="2">' + mLabel + '</td>' +
      '<td>Positive replies</td>' +
      '<td><input ' + attrName + '="' + keyFor(m, "replies") + '" value="' + escapeAttr(gm.replies) + '" placeholder="Target" style="padding:5px 8px;border:0.5px solid var(--border);border-radius:4px;width:100%;background:var(--surface-1)"></td>' +
      '<td><input ' + attrName + '="' + keyFor(m, "achievedReplies") + '" value="' + escapeAttr(gm.achievedReplies) + '" placeholder="Actual" style="padding:5px 8px;border:0.5px solid var(--border);border-radius:4px;width:100%;background:var(--surface-1)"></td>' +
      '<td>' + goalsPctCell(gm.replies, gm.achievedReplies) + '</td>' +
      '</tr>' +
      '<tr style="border-bottom:1px solid var(--border)">' +
      '<td>Meetings booked</td>' +
      '<td><input ' + attrName + '="' + keyFor(m, "meetings") + '" value="' + escapeAttr(gm.meetings) + '" placeholder="Target" style="padding:5px 8px;border:0.5px solid var(--border);border-radius:4px;width:100%;background:var(--surface-1)"></td>' +
      '<td><input ' + attrName + '="' + keyFor(m, "achievedMeetings") + '" value="' + escapeAttr(gm.achievedMeetings) + '" placeholder="Actual" style="padding:5px 8px;border:0.5px solid var(--border);border-radius:4px;width:100%;background:var(--surface-1)"></td>' +
      '<td>' + goalsPctCell(gm.meetings, gm.achievedMeetings) + '</td>' +
      '</tr>';
  }).join("");
  return '<table style="margin-bottom:4px"><thead><tr><th>Month</th><th>Metric</th><th>Target</th><th>Achieved</th><th>% Achieved</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

function buildGmailLink(to, subject, bodyLines) {
  var body = bodyLines.join("\n");
  return "https://mail.google.com/mail/?view=cm&to=" + encodeURIComponent(to) +
    "&su=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
}

function buildGmailLinkWithCC(to, cc, subject, bodyLines) {
  var body = bodyLines.join("\n");
  var url = "https://mail.google.com/mail/?view=cm&to=" + encodeURIComponent(to);
  if (cc && cc.length > 0) url += "&cc=" + encodeURIComponent(cc.join(","));
  url += "&su=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
  return url;
}

function sendResponseReportToProspect() {
  var clientName = (ui.responseFilters && ui.responseFilters.client) || "";
  if (!clientName) {
    alert("Filter the Responses tab to one specific account first (use the Account filter above), then click Send report to prospect.");
    return;
  }
  var c = Object.values(state.clients).find(function(cl) { return cl.name === clientName; });
  if (!c) { alert("Could not find a client record for " + clientName + "."); return; }
  var toEmail = c.people.clientPocEmail || c.intake.pocEmail || "";
  if (!toEmail) { alert("No client contact email on file for " + clientName + " yet. Add one in that client's Overview tab first."); return; }

  var ccList = [];
  if (c.people.csEmail) ccList.push(c.people.csEmail);
  if (TEAM_EMAILS.revops) ccList.push(TEAM_EMAILS.revops);
  if (TEAM_EMAILS.founder) ccList.push(TEAM_EMAILS.founder);

  // Outcomes by Confirmed Client Status, by month - only responses marked Confirmed count here.
  var confirmedResponses = (state.responses || []).filter(function(r) { return r.client === clientName && r.confirmed; });
  var byMonth = {};
  confirmedResponses.forEach(function(r) {
    if (!r.date) return;
    var d = new Date(r.date + "T00:00:00");
    var monthKey = d.toLocaleDateString("en-US", { year: "numeric", month: "short" });
    if (!byMonth[monthKey]) byMonth[monthKey] = { "Positive Reply": 0, "Meeting Booked": 0, "No Fit": 0, "Not Interested": 0 };
    var status = r.clientStatus || r.heddlStatus;
    if (byMonth[monthKey][status] !== undefined) byMonth[monthKey][status]++;
  });
  var monthKeys = Object.keys(byMonth).sort(function(a,b) { return new Date(a + " 1") - new Date(b + " 1"); });

  function pad(s, n) { s = String(s); while (s.length < n) s += " "; return s; }
  var tableLines = [];
  if (monthKeys.length === 0) {
    tableLines.push("No confirmed responses logged yet for " + clientName + ".");
  } else {
    tableLines.push(pad("Month", 14) + pad("Positive Reply", 17) + pad("Meeting Booked", 17) + pad("No Fit", 9) + "Not Interested");
    tableLines.push(pad("-----", 14) + pad("--------------", 17) + pad("--------------", 17) + pad("------", 9) + "--------------");
    monthKeys.forEach(function(m) {
      var row = byMonth[m];
      tableLines.push(pad(m, 14) + pad(row["Positive Reply"], 17) + pad(row["Meeting Booked"], 17) + pad(row["No Fit"], 9) + row["Not Interested"]);
    });
  }

  var bodyLines = [
    "Hi,",
    "",
    "Please find below a summary of confirmed outcomes for " + clientName + ", broken down by month:",
    "",
  ].concat(tableLines).concat([
    "",
    "A detailed response-by-response report (PDF) is attached.",
    "",
    "Best,",
    "GetGTM Team"
  ]);

  var subject = clientName + " x GetGTM - Response & Outcomes Report";
  var gmailUrl = buildGmailLinkWithCC(toEmail, ccList, subject, bodyLines);

  // Generate the PDF scoped to just this client (ignoring any other active status/confirmed filters),
  // so the attachment always covers the client's full response history.
  var savedFilters = Object.assign({}, ui.responseFilters);
  ui.responseFilters = { client: clientName, heddlStatus: "", clientStatus: "", confirmed: "" };
  generateResponsesPDF();
  ui.responseFilters = savedFilters;

  window.open(gmailUrl, "_blank");
}
