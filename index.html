<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GetGTM · Engagement Tracker</title>
  <style>
    :root {
      --brand: #a855f7;
      --brand-light: #e9d5ff;
      --brand-dark: #7c3aed;
      --text-primary: #1c1917;
      --text-secondary: #78716c;
      --text-muted: #a8a29e;
      --border: #e7e5e4;
      --border-dark: #d6d3d0;
      --surface-1: #fafaf9;
      --surface-2: #ffffff;
      --success: #15803d;
      --success-light: #dcfce7;
      --warning: #b45309;
      --warning-light: #fef3c7;
      --danger: #b91c1c;
      --danger-light: #fee2e2;
      --info: #1d4ed8;
      --info-light: #dbeafe;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text-primary: #fafaf9;
        --text-secondary: #a8a29e;
        --text-muted: #78716c;
        --border: #44423e;
        --border-dark: #5a5551;
        --surface-1: #1a1917;
        --surface-2: #27251f;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--surface-1); color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px; line-height: 1.5; }
    button { font: inherit; cursor: pointer; border: none; }
    input, select, textarea { font: inherit; color: inherit; }

    .topbar { background: #000; color: #fff; padding: 12px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .topbar .brand { font-weight: 600; font-size: 14px; letter-spacing: .5px; display: flex;
      align-items: center; gap: 12px; }
    .topbar .logo { width: 40px; height: 40px; background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
      border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px;
      font-weight: 700; color: #fff; position: relative; flex-shrink: 0; }
    .topbar .logo::before { content: ''; position: absolute; width: 5px; height: 5px; background: #fff;
      border-radius: 50%; top: 5px; right: 5px; }
    .topbar .logo::after { content: ''; position: absolute; width: 5px; height: 5px; background: #fff;
      border-radius: 50%; bottom: 6px; right: 8px; }
    .topbar .brand strong { color: #fff; }
    .topbar .meta { font-size: 12px; color: #888; }
    .topbar .badge { background: #a855f7; color: #fff;
      font-size: 10px; padding: 3px 8px; border-radius: 3px; font-weight: 600; }

    .wrap { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .card { background: var(--surface-2); border: 0.5px solid var(--border);
      border-radius: 8px; overflow: hidden; }
    .card-head { padding: 14px 18px; border-bottom: 0.5px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .card-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
    .card-head .sub { color: var(--text-secondary); font-size: 12px; }
    .card-body { padding: 16px 18px; }

    .btn { background: var(--brand); color: #fff; padding: 7px 12px;
      border-radius: 5px; font-size: 12px; font-weight: 500; }
    .btn:hover { opacity: .9; }
    .btn.secondary { background: transparent; color: var(--text-primary);
      border: 0.5px solid var(--border); }
    .btn.secondary:hover { background: var(--surface-1); }
    .btn.ghost { background: transparent; color: var(--text-primary); }
    .btn.ghost:hover { background: var(--surface-1); }
    .btn.sm { padding: 5px 9px; font-size: 11px; }

    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px; margin-bottom: 18px; }
    .kpi { background: var(--surface-1); border: 0.5px solid var(--border);
      border-radius: 6px; padding: 12px 14px; }
    .kpi .label { color: var(--text-secondary); font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .4px; }
    .kpi .value { font-size: 20px; font-weight: 600; margin-top: 4px; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; font-weight: 600; color: var(--text-secondary);
      padding: 8px 12px; border-bottom: 0.5px solid var(--border);
      font-size: 11px; text-transform: uppercase; letter-spacing: .3px; }
    td { padding: 10px 12px; border-bottom: 0.5px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface-1); }

    .badge { display: inline-block; padding: 3px 8px; border-radius: 3px;
      font-size: 10px; font-weight: 600; letter-spacing: .2px; }
    .badge.done { background: var(--success-light); color: var(--success); }
    .badge.pending { background: var(--info-light); color: var(--info); }

    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 11px; font-weight: 600;
      color: var(--text-secondary); text-transform: uppercase; letter-spacing: .3px;
      margin-bottom: 4px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 8px 10px; border: 0.5px solid var(--border);
      border-radius: 5px; background: var(--surface-1); }
    .field textarea { min-height: 60px; font-family: inherit; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }

    .progress { background: var(--border); height: 5px; border-radius: 999px;
      overflow: hidden; width: 100%; }
    .progress > div { height: 100%; background: var(--brand); }

    .tabs { display: flex; gap: 2px; border-bottom: 0.5px solid var(--border);
      margin-bottom: 16px; }
    .tabs button { background: none; border: none; padding: 8px 12px;
      color: var(--text-secondary); font-weight: 500; border-bottom: 2px solid transparent;
      cursor: pointer; white-space: nowrap; }
    .tabs button.active { color: var(--text-primary); border-bottom-color: var(--brand); }
    .tabs button:hover { color: var(--text-primary); }

    .share-box { background: var(--brand-light); border: 0.5px solid #d8b4fe;
      border-radius: 6px; padding: 12px 14px; color: #6b21a8; font-size: 12px;
      margin-bottom: 16px; }
    .share-box strong { color: #6b21a8; }
    .share-link { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    .share-link input { flex: 1; padding: 6px 10px; border: 0.5px solid #d8b4fe;
      background: #fff; border-radius: 4px; font-size: 11px; }

    .breadcrumb { color: var(--text-secondary); font-size: 12px; margin-bottom: 12px; }
    .breadcrumb a { color: var(--brand); cursor: pointer; text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }

    .empty { text-align: center; padding: 32px 20px; color: var(--text-muted); }
    .empty h3 { color: var(--text-primary); margin: 0 0 6px; font-size: 14px; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6);
      display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
    .modal { background: var(--surface-2); border-radius: 8px; width: 100%; max-width: 480px;
      max-height: 90vh; overflow: auto; }

    .login-box { max-width: 360px; margin: 60px auto; }
    .login-box .card-body { padding: 32px 24px; text-align: center; }
    .login-box h2 { margin: 0 0 8px; font-size: 16px; }
    .login-box .sub { color: var(--text-secondary); margin-bottom: 20px; }
    .login-box input { padding: 10px; margin-bottom: 14px; }
    .login-box .btn { width: 100%; }

    .small { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
  
  .ppt-fullscreen { position: fixed; inset: 0; z-index: 200; background: #000;
    display: flex; flex-direction: column; }
  .ppt-topbar { display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px; background: #000; border-bottom: 1px solid #222; flex-shrink: 0; }
  .ppt-brand { display: flex; align-items: center; gap: 10px; color: #fff;
    font-weight: 600; font-size: 14px; }
  .ppt-counter { color: #666; font-size: 12px; font-weight: 500; }
  .ppt-nav { display: flex; gap: 8px; }
  .ppt-btn { background: #a855f7; color: #fff; border: none; padding: 8px 18px;
    border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; }
  .ppt-btn:hover { background: #9333ea; }
  .ppt-btn-sec { background: #333; color: #fff; border: none; padding: 8px 14px;
    border-radius: 6px; font-size: 13px; cursor: pointer; }
  .ppt-btn-sec:hover { background: #444; }

  .ppt-slide { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  .ppt-half { padding: 40px 48px; display: flex; flex-direction: column; justify-content: center;
    overflow: auto; }
  .ppt-dark { background: #111; color: #ccc; }
  .ppt-light { background: #fafaf9; color: #1c1917; }
  @media (prefers-color-scheme: dark) { .ppt-light { background: #1e1e1c; color: #e5e5e3; } }
  @media (max-width: 768px) {
    .ppt-slide { grid-template-columns: 1fr; }
    .ppt-half { padding: 24px 20px; }
  }

  .ppt-label { font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; color: #888; margin-bottom: 20px; }
  .ppt-light .ppt-label { color: #a855f7; }
  .ppt-lines { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .ppt-line { font-size: 14px; line-height: 1.5; }
  .ppt-dark .ppt-line { color: #aaa; }
  .ppt-stat { font-size: 32px; font-weight: 700; line-height: 1.1; }
  .ppt-dark .ppt-stat { color: #ef4444; }
  .ppt-light .ppt-stat { color: #a855f7; }
  .ppt-stat-sub { font-size: 14px; color: #888; margin-top: 6px; }

  .ppt-footer { display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px; background: #000; border-top: 1px solid #222; flex-shrink: 0; }
  .ppt-category { color: #fff; font-weight: 600; font-size: 13px; }
  .ppt-dots { display: flex; gap: 6px; }
  .ppt-dot { width: 8px; height: 8px; border-radius: 50%; background: #333; }
  .ppt-dot.active { background: #a855f7; }
  .ppt-hint { color: #555; font-size: 11px; }

  .problem-header { padding: 28px 48px 0; text-align: center; }
  .problem-headline { color: #fff; font-size: 26px; font-weight: 700; margin: 0 0 8px; }
  .problem-subline { color: #888; font-size: 14px; margin: 0 auto; max-width: 720px; line-height: 1.5; }

  .problem-grid { flex: 1; display: grid; grid-template-columns: 1fr auto 1fr;
    min-height: 0; overflow: auto; padding: 0; }
  @media (max-width: 900px) { .problem-grid { grid-template-columns: 1fr; } }

  .problem-col { padding: 24px 32px; display: flex; flex-direction: column; justify-content: center; }
  .problem-left { background: #111; color: #aaa; }
  .problem-center { background: #1a0a0a; padding: 24px 20px; border-left: 2px solid #b91c1c;
    border-right: 2px solid #b91c1c; max-width: 280px; }
  @media (max-width: 900px) { .problem-center { max-width: 100%; border-left: none; border-right: none;
    border-top: 2px solid #b91c1c; border-bottom: 2px solid #b91c1c; } }
  .problem-right { background: #fafaf9; color: #1c1917; }
  @media (prefers-color-scheme: dark) { .problem-right { background: #1e1e1c; color: #e5e5e3; } }

  .problem-col-stat { font-size: 15px; font-weight: 700; color: #ef4444; margin-top: 16px; }
  .problem-col-statsub { font-size: 12px; color: #777; margin-top: 4px; }

  .gap-label { font-size: 10px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; color: #ef4444; margin-bottom: 12px; }
  .gap-line { height: 1px; background: #b91c1c; opacity: .3; margin: 8px 0; }
  .gap-items { display: flex; flex-direction: column; gap: 10px; }
  .gap-item {}
  .gap-title { font-size: 12px; font-weight: 600; color: #f87171; }
  .gap-desc { font-size: 11px; color: #888; line-height: 1.4; margin-top: 2px; }

  .ppt-line-check { color: #1c1917; }
  @media (prefers-color-scheme: dark) { .ppt-line-check { color: #e5e5e3; } }

  .problem-table { padding: 0 48px 8px; background: #000; }
  .problem-table table { width: 100%; max-width: 640px; margin: 0 auto; border-collapse: collapse;
    font-size: 12px; }
  .problem-table th { color: #888; font-size: 10px; text-transform: uppercase; letter-spacing: .5px;
    padding: 8px 12px; border-bottom: 1px solid #222; text-align: left; font-weight: 600; }
  .problem-table td { padding: 6px 12px; border-bottom: 1px solid #1a1a1a; }
  .tbl-before { color: #777; }
  .tbl-after { color: #a855f7; font-weight: 500; }

  .problem-closing { padding: 14px 48px; background: #000; border-top: 1px solid #222;
    color: #a855f7; font-size: 14px; font-weight: 500; text-align: center; line-height: 1.5; }

  .summary-body { flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; background: #000; padding: 48px; }
  .summary-table { width: 100%; max-width: 680px; }
  .summary-table table { width: 100%; border-collapse: collapse; font-size: 15px; }
  .summary-table th { color: #888; font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
    padding: 12px 16px; border-bottom: 1px solid #333; text-align: left; font-weight: 600; }
  .summary-table td { padding: 14px 16px; border-bottom: 1px solid #1a1a1a; }
  .summary-table .tbl-before { color: #777; font-size: 15px; }
  .summary-table .tbl-after { color: #a855f7; font-weight: 600; font-size: 15px; }
  .summary-closing { color: #a855f7; font-size: 16px; font-weight: 500; text-align: center;
    margin-top: 40px; max-width: 680px; line-height: 1.6; }

  .offer-body { flex: 1; display: flex; align-items: center; justify-content: center;
    background: #000; padding: 48px; }
  .offer-card { max-width: 600px; width: 100%; }
  .offer-category { font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; color: #a855f7; margin-bottom: 12px; }
  .offer-headline { color: #fff; font-size: 22px; font-weight: 600; margin: 0 0 28px;
    line-height: 1.3; }
  .offer-lines { display: flex; flex-direction: column; gap: 14px; }
  .offer-line { font-size: 15px; color: #ccc; line-height: 1.5; display: flex; gap: 10px;
    align-items: start; }
  .offer-check { color: #a855f7; font-size: 16px; flex-shrink: 0; margin-top: 1px; }

  .ob-slide { flex: 1; display: grid; grid-template-columns: 1fr 380px; min-height: 0; overflow: auto; }
  @media (max-width: 900px) { .ob-slide { grid-template-columns: 1fr; } }
  .ob-left { background: #000; padding: 32px 40px; overflow: auto; }
  .ob-right { background: #111; padding: 32px 36px; border-left: 1px solid #222; overflow: auto; }
  @media (prefers-color-scheme: dark) { .ob-right { background: #111; } }
  .ob-headline { color: #fff; font-size: 22px; font-weight: 600; margin: 0 0 14px; line-height: 1.3; }
  .ob-intro { color: #999; font-size: 13px; line-height: 1.6; margin: 0 0 20px; }
  .ob-points { display: flex; flex-direction: column; gap: 12px; }
  .ob-point { font-size: 13px; color: #ccc; line-height: 1.5; padding-left: 16px;
    border-left: 2px solid #a855f7; }
  .ob-section-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; color: #a855f7; margin-bottom: 14px; }
  .ob-models { display: flex; flex-direction: column; gap: 12px; }
  .ob-model { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 14px 16px; }
  .ob-model-name { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 4px; }
  .ob-model-desc { font-size: 12px; color: #999; line-height: 1.4; }
  .ob-infra { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .ob-infra-item { font-size: 13px; color: #ccc; padding: 8px 12px;
    background: #1a1a1a; border-radius: 4px; }
  .ob-cta { background: #a855f7; color: #fff; font-size: 13px; font-weight: 600;
    padding: 12px 16px; border-radius: 6px; text-align: center; }

  .ob-model-active { border-color: #a855f7; background: #1a0f2e; }
  .ob-model-badge { font-size: 10px; font-weight: 700; color: #a855f7; text-transform: uppercase;
    letter-spacing: 1px; margin-bottom: 4px; }
  .ob-infra-included { border-left: 2px solid #a855f7; }
  .ob-extras { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
  .ob-extra { font-size: 11px; color: #777; padding-left: 12px; }
  .ob-pricing { }
  .ob-price-card { background: #1a0f2e; border: 1px solid #a855f7; border-radius: 8px;
    padding: 16px; text-align: center; }
  .ob-price-market { font-size: 11px; font-weight: 600; color: #a855f7; text-transform: uppercase;
    letter-spacing: 1px; margin-bottom: 4px; }
  .ob-price-amount { font-size: 28px; font-weight: 700; color: #fff; }

  .ob-bottom { margin-top: auto; padding-top: 20px; }
  .ob-bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 900px) { .ob-bottom-grid { grid-template-columns: 1fr; } }

  .prop-stages { display: flex; align-items: center; gap: 0; margin-bottom: 24px; padding: 16px 0; }
  .prop-stage-dot { display: flex; flex-direction: column; align-items: center; gap: 4px; z-index: 1; }
  .prop-stage-num { width: 28px; height: 28px; border-radius: 50%; background: var(--border);
    color: var(--text-muted); display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; }
  .prop-stage-dot.done .prop-stage-num { background: #a855f7; color: #fff; }
  .prop-stage-dot.current .prop-stage-num { box-shadow: 0 0 0 3px #e9d5ff; }
  .prop-stage-label { font-size: 10px; color: var(--text-muted); font-weight: 500; white-space: nowrap; }
  .prop-stage-dot.done .prop-stage-label { color: #a855f7; }
  .prop-stage-line { flex: 1; height: 2px; background: var(--border); min-width: 20px; margin-top: -18px; }
  .prop-stage-line.done { background: #a855f7; }

  .prop-section { margin-top: 8px; }
  .prop-h3 { font-size: 14px; font-weight: 600; margin: 0 0 10px; }
  .prop-preview { background: var(--surface-1); border: 0.5px solid var(--border); border-radius: 6px;
    padding: 16px; font-family: monospace; font-size: 12px; line-height: 1.6; max-height: 400px; overflow: auto; }
  .prop-line { white-space: pre-wrap; }

  .prop-checklist { display: flex; flex-direction: column; gap: 8px; }
  .prop-check-item { display: flex; align-items: center; gap: 8px; font-size: 13px;
    padding: 8px 12px; background: var(--surface-1); border-radius: 4px; cursor: pointer; }
  .prop-check-item input { margin: 0; }

  .prop-pdf-preview { background: #fff; border: 0.5px solid var(--border); border-radius: 8px;
    padding: 32px; color: #1c1917; font-size: 12px; line-height: 1.5; max-height: 500px; overflow: auto; }
  .prop-pdf-preview .cover { background: #1c1917; color: #fff; padding: 32px 28px; border-radius: 8px; margin-bottom: 20px; }
  .prop-pdf-preview .cover h1 { font-size: 22px; font-weight: 700; margin: 0 0 8px; line-height: 1.1; }
  .prop-pdf-preview .cover .sub { color: #a8a29e; font-size: 11px; line-height: 1.5; }
  .prop-pdf-preview .cover .logo { font-size: 14px; font-weight: 700; margin-bottom: 16px; }
  .prop-pdf-preview .cover .logo span { color: #a855f7; }
  .prop-pdf-preview .meta-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: #e5e5e5; border: 1px solid #e5e5e5; border-radius: 6px; overflow: hidden; margin-bottom: 16px; }
  .prop-pdf-preview .meta-cell { background: #fff; padding: 10px 12px; }
  .prop-pdf-preview .meta-cell .label { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: #888; margin-bottom: 2px; }
  .prop-pdf-preview .meta-cell .val { font-size: 12px; font-weight: 600; }
  .prop-pdf-preview .invest { background: #1c1917; color: #fff; border-radius: 6px; padding: 12px 16px; margin-bottom: 20px; }
  .prop-pdf-preview .invest .il { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #a855f7; margin-bottom: 4px; }
  .prop-pdf-preview .invest .iv { font-size: 18px; font-weight: 700; }
  .prop-pdf-preview .sect { margin-bottom: 16px; }
  .prop-pdf-preview .sect-num { display: inline-block; background: #a855f7; color: #fff; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 3px; margin-right: 6px; }
  .prop-pdf-preview .sect h2 { font-size: 15px; font-weight: 700; margin: 0; display: inline; }
  .prop-pdf-preview .sect-line { height: 1px; background: #e5e5e5; margin: 6px 0 10px; }
  .prop-pdf-preview table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 12px; }
  .prop-pdf-preview th { text-align: left; font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .3px; color: #888; padding: 6px 10px; border-bottom: 1px solid #ddd; }
  .prop-pdf-preview td { padding: 6px 10px; border-bottom: 1px solid #eee; }
  .prop-pdf-preview .obligations { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .prop-pdf-preview .obl-col .obl-label { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: #888; margin-bottom: 6px; }
  .prop-pdf-preview .obl-col ul { margin: 0; padding-left: 14px; font-size: 11px; line-height: 1.6; }

  // Patch intake fields added after initial release
  if (!c.intake) c.intake = {};

  // Patch proposal
  if (!c.proposal) c.proposal = { stage: "draft", initialSentDate: "", initialNotes: "", scopeNotes: [], finalSentDate: "", finalNotes: "", approvedDate: "", approvalEmail: "", sowGenerated: false };
  if (!c.proposal.stage) c.proposal.stage = "draft";

  // Patch sow

  // Patch stages - always ensure full set
  var fullStages = [
    "Qualification","Scoping","Proposal","Commercial Handover","Onboarding",
    "ICP Fitment","TAM & List","Messaging","Campaign Build","Launch","First Review"
  ];
  if (!Array.isArray(c.stages) || c.stages.length === 0) {
    c.stages = fullStages.map(function(s) { return { stage: s, status: "Not Started", eta: "", notes: "" }; });
  } else if (c.stages.length < fullStages.length) {
    // Add any missing stages
    var existingNames = c.stages.map(function(s) { return s.stage; });
    fullStages.forEach(function(s) {
      if (!existingNames.includes(s)) c.stages.push({ stage: s, status: "Not Started", eta: "", notes: "" });

  }

  // Patch goals
  if (!c.goals) c.goals = {};
  if (!c.goals.m1) c.goals.m1 = { replies: "", meetings: "" };
  if (!c.goals.m2) c.goals.m2 = { replies: "", meetings: "" };

  // Patch outcomes

  return c;
}

        <div class="card">
          <div class="card-body">
            <h2>Dashboard access</h2>
            <div class="sub">GetGTM team only</div>
            <input id="pw" type="password" placeholder="Password" autofocus autocomplete="off" style="width:100%;padding:10px 12px;border:0.5px solid var(--border);border-radius:5px;background:var(--surface-2);color:var(--text-primary);margin-bottom:12px;font-size:14px">
            <div id="pw-error" style="display:none;color:#b91c1c;font-size:12px;font-weight:500;margin-bottom:10px">Wrong password. Try again.</div>
            <button class="btn" data-action="login" style="width:100%">Enter</button>
            <div class="small" style="margin-top:14px;color:var(--text-muted)">Clients get a direct link - no password needed.</div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderDashboard() {
  const clients = Object.values(state.clients).sort((a,b) => (b.createdAt||"").localeCompare(a.createdAt||""));
  const active = clients.filter(c => progressOf(c) > 0 && progressOf(c) < 100).length;
  const launched = clients.filter(c => progressOf(c) === 100).length;
  const atRisk = clients.filter(c => c.stages.some(s => s.status === "Blocked")).length;
  const dTab = ui.dashboardTab || "engagements";

  return `
    <div class="topbar">
      <div class="brand"><div class="logo">GTM</div> <strong>Engagement Tracker</strong></div>
      <div style="margin-left:auto;display:flex;gap:12px;align-items:center">
        <div class="meta">All engagements</div>
        <button class="btn ghost sm" data-action="logout">Logout</button>
      </div>
    </div>
    <div class="wrap">
      <div class="tabs" style="margin-bottom:16px">
        <button data-action="dtab" data-dtab="engagements" class="${dTab==='engagements'?'active':''}">Engagements</button>
        <button data-action="dtab" data-dtab="prospects" class="${dTab==='prospects'?'active':''}">Prospects</button>
      </div>
      ${dTab === "prospects" ? renderProspectsView() : renderEngagementsView(clients, active, launched, atRisk)}
    </div>
  `;
}

function renderEngagementsView(clients, active, launched, atRisk) {
  return `
      <div class="kpis">
        <div class="kpi"><div class="label">Total</div><div class="value">${clients.length}</div></div>
        <div class="kpi"><div class="label">In flight</div><div class="value">${active}</div></div>
        <div class="kpi"><div class="label">Launched</div><div class="value">${launched}</div></div>
        <div class="kpi"><div class="label">At risk</div><div class="value" style="color:${atRisk?'var(--danger)':'inherit'}">${atRisk}</div></div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>Engagements</h2>
          <button class="btn" data-action="new-client">+ New engagement</button>
        </div>
        <div class="card-body" style="padding:0">
          ${clients.length === 0 ? `<div style="padding:20px;text-align:center;color:var(--text-secondary)">No engagements yet. <button class="btn" style="margin-top:12px" data-action="new-client">Create one</button></div>` : `
            <table>
              <thead><tr>
                <th>Client</th><th>Path</th><th>Kickoff</th><th>Progress</th><th>Next step</th><th>SOW</th><th></th>
              </tr></thead>
              <tbody>
                ${clients.map(c => {
                  const prog = progressOf(c);
                  const next = c.stages.find(s => s.status !== "Complete");
                  const url = window.location.origin + window.location.pathname + "?client=" + c.id;
                  return `<tr>
                    <td><strong onclick="window.openClient('${c.id}')" style="cursor:pointer">${escapeHTML(c.name)}</strong></td>
                    <td><span class="badge pending">${PATHS[c.path].label}</span></td>
                    <td>${escapeHTML(c.kickoffDate || "-")}</td>
                    <td><div class="progress" style="width:120px"><div style="width:${prog}%"></div></div><div class="small">${prog}%</div></td>
                    <td><div class="small">${escapeHTML(next?.stage || "Done")}</div></td>
                    <td><span class="badge ${c.sow.status === 'Signed' ? 'done' : 'pending'}">${escapeHTML(c.sow.status || "-")}</span></td>
                    <td><div style="display:flex;gap:6px"><button class="btn ghost sm" onclick="navigator.clipboard.writeText('${escapeAttr(url)}');alert('Link copied!')">Share</button><button class="btn ghost sm" data-action="delete-client" data-id="${c.id}" style="color:var(--danger)">Delete</button></div></td>
                  </tr>`;
                }).join("")}
              </tbody>
            </table>
          `}
        </div>
      </div>
  `;
}

var PROSPECT_STATUSES = ["New", "Contacted", "Follow-up Sent", "In Conversation", "Objection Handling",
  "Proposal Requested", "Kickoff Scheduled", "Stalled", "Not a Fit", "Converted"];

function renderProspectsView() {
  const prospects = (state.prospects || []).slice().sort((a,b) => (b.dateContacted||"").localeCompare(a.dateContacted||""));
  const active = prospects.filter(p => !["Stalled","Not a Fit","Converted"].includes(p.status)).length;
  const stalled = prospects.filter(p => p.status === "Stalled").length;
  const converted = prospects.filter(p => p.status === "Converted").length;

  return `
      <div class="kpis">
        <div class="kpi"><div class="label">Total prospects</div><div class="value">${prospects.length}</div></div>
        <div class="kpi"><div class="label">Active</div><div class="value">${active}</div></div>
        <div class="kpi"><div class="label">Stalled</div><div class="value" style="color:${stalled?'var(--danger)':'inherit'}">${stalled}</div></div>
        <div class="kpi"><div class="label">Converted</div><div class="value" style="color:var(--success)">${converted}</div></div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>Prospects</h2>
          <div style="display:flex;gap:8px">
            <button class="btn ghost sm" data-action="refresh-prospects-note">Pulled from Gmail</button>
            <button class="btn" data-action="add-prospect">+ Add prospect</button>
          </div>
        </div>
        <div class="card-body" style="padding:0">
          <div class="small" style="padding:12px 16px;border-bottom:0.5px solid var(--border)">Seeded from Gmail on-demand - threads where Rajiv led, looped Vinay in, or Vinay reached out directly. Ask to refresh anytime.</div>
          ${prospects.length === 0 ? `<div style="padding:20px;text-align:center;color:var(--text-secondary)">No prospects yet.</div>` : `
            <table>
              <thead><tr>
                <th>Name / Company</th><th>Date contacted</th><th>Status</th><th>Next step</th><th>Source</th><th></th>
              </tr></thead>
              <tbody>
                ${prospects.map(p => `
                  <tr>
                    <td><strong>${escapeHTML(p.name)}</strong><div class="small">${escapeHTML(p.company)}</div></td>
                    <td><input type="date" data-prospect="${p.id}" data-key="dateContacted" value="${escapeAttr(p.dateContacted)}" style="border:none;background:transparent;padding:0;width:120px"></td>
                    <td>
                      <select data-prospect="${p.id}" data-key="status" class="del-select">
                        ${PROSPECT_STATUSES.map(s => `<option ${p.status===s?'selected':''}>${s}</option>`).join("")}
                      </select>
                    </td>
                    <td><input data-prospect="${p.id}" data-key="nextStep" value="${escapeAttr(p.nextStep)}" style="border:none;background:transparent;padding:0;width:220px"></td>
                    <td><div class="small">${escapeHTML(p.source)}</div></td>
                    <td><button class="btn ghost sm" data-action="delete-prospect" data-id="${p.id}">Remove</button></td>
                  </tr>
                  ${p.notes ? `<tr><td colspan="6" style="padding-top:0"><div class="small" style="color:var(--text-muted);padding:0 0 8px">${escapeHTML(p.notes)}</div></td></tr>` : ""}
                `).join("")}
              </tbody>
            </table>
          `}
        </div>
      </div>
  `;
}

function renderClient() {
  const c = state.clients[ui.clientId];
  if (!c) { ui.view = "dashboard"; return renderDashboard(); }
  const prog = progressOf(c);

  return `
    <div class="topbar">
      <div class="brand"><div class="logo">GTM</div> <strong>${escapeHTML(c.name)}</strong></div>
      ${isClientView ? '<div class="badge" style="background:#15803d">Live - synced</div>' : '<div class="badge">Client view</div>'}
    </div>
    <div class="wrap">
      ${isClientView ? '' : '<div class="breadcrumb"><a data-action="back">← Back</a></div>'}
      
      ${isClientView ? '<div class="share-box" style="background:#dcfce7;border-color:#86efac;color:#15803d"><strong>Your engagement tracker</strong> - this page updates in real time as your project progresses.</div>' : '<div class="share-box">Share this link with your team:<div class="share-link"><input type="text" readonly value="' + window.location.origin + window.location.pathname + '?client=' + c.id + '"><button class="btn sm ghost" onclick="navigator.clipboard.writeText(\'' + window.location.origin + window.location.pathname + '?client=' + c.id + '\')">Copy</button></div></div>'}

      <div class="card" style="margin-bottom:16px">
        <div class="card-head">
          <div>
            <h2>${escapeHTML(c.name)}</h2>
            <div class="sub">${PATHS[c.path].tagline}</div>
          </div>
        </div>
        <div class="card-body">
          <div class="kpis">
            <div class="kpi"><div class="label">Path</div><div class="value" style="font-size:14px">${PATHS[c.path].label}</div></div>
            <div class="kpi"><div class="label">Progress</div><div class="value">${prog}%</div><div class="progress" style="margin-top:6px"><div style="width:${prog}%"></div></div></div>
            <div class="kpi"><div class="label">Kickoff</div><div class="value" style="font-size:14px">${escapeHTML(c.kickoffDate || "-")}</div></div>
            <div class="kpi"><div class="label">Target launch</div><div class="value" style="font-size:14px">${escapeHTML(c.targetLaunchDate || "-")}</div></div>
          </div>
        </div>
      </div>

      <div class="timeline-bar" id="timeline-bar">
        ${renderTimelineBar(c)}
      </div>

      <div class="tabs">
        ${isClientView ? '' : '<button data-action="tab" data-tab="offers" class="' + (ui.tab==='offers'?'active':'') + '">Offers</button>'}
        ${isClientView ? '' : '<button data-action="tab" data-tab="intake" class="' + (ui.tab==='intake'?'active':'') + '">Client Intake</button>'}
        <button data-action="tab" data-tab="overview" class="${ui.tab==='overview'?'active':''}">Overview</button>
        ${isClientView ? '' : '<button data-action="tab" data-tab="proposal" class="' + (ui.tab==='proposal'?'active':'') + '">Proposal</button>'}
        <button data-action="tab" data-tab="timeline" class="${ui.tab==='timeline'?'active':''}">Timeline</button>
        ${c.proposal && c.proposal.stage === 'approved' ? '<button data-action="tab" data-tab="delivery" class="' + (ui.tab==='delivery'?'active':'') + '">Delivery</button>' : ''}
        <button data-action="tab" data-tab="outcomes" class="${ui.tab==='outcomes'?'active':''}">Outcomes</button>
      </div>

      <div id="tab-body">${
        ui.tab === "offers" ? renderOffersTab(c)
        : ui.tab === "intake" ? renderIntakeTab(c)
        : ui.tab === "overview" ? renderOverviewTab(c)
        : ui.tab === "proposal" ? renderProposalTab(c)
        : ui.tab === "delivery" ? renderDeliveryTab(c)
        : ui.tab === "timeline" ? renderTimelineTab(c)
        : renderOutcomesTab(c)
      }</div>
    </div>
  `;
}

function renderOffersTab(c) {
  var page = ui.offerPage || 0;
  var slide = SLIDES[page];
  var total = SLIDES.length;

  var prevBtn = page === 0
    ? '<button class="ppt-btn ppt-btn-sec" disabled style="opacity:.3">\u2190</button>'
    : '<button class="ppt-btn ppt-btn-sec" data-action="offer-prev">\u2190</button>';
  var nextBtn = page < total - 1
    ? '<button class="ppt-btn" data-action="offer-next">Next \u2192</button>'
    : '<button class="ppt-btn" data-action="offer-next">Done \u2192</button>';

  var dotsHtml = SLIDES.map(function(s, i) {
    return '<div class="ppt-dot' + (i === page ? ' active' : '') + '"></div>';
  }).join("");

  var topbar = '<div class="ppt-topbar">' +
    '<div class="ppt-brand"><div class="logo">GTM</div> GetGTM</div>' +
    '<div class="ppt-counter">' + (page + 1) + ' / ' + total + '</div>' +
    '<div class="ppt-nav">' + (page === 0 ? '<button class="ppt-btn-sec" data-action="skip-ppt" style="margin-right:8px">Skip presentation</button>' : '') + prevBtn + nextBtn + '</div>' +
  '</div>';

  var footer = '<div class="ppt-footer">' +
    '<div class="ppt-category">' + escapeHTML(slide.category) + '</div>' +
    '<div class="ppt-dots">' + dotsHtml + '</div>' +
    '<div class="ppt-hint">Prospect view</div>' +
  '</div>';

  if (slide.type === "problem") {
    return renderProblemSlide(slide, topbar, footer);
  }
  if (slide.type === "problem-summary") {
    return renderProblemSummary(slide, topbar, footer);
  }
  if (slide.type === "outbound-detail") {
    return renderOutboundSlide(slide, topbar, footer, c);
  }
  if (slide.type === "offer") {
    return renderOfferSlide(slide, topbar, footer);
  }

  return '<div class="ppt-fullscreen">' + topbar +
    '<div style="flex:1;display:flex;align-items:center;justify-content:center;background:#000;color:#888">' +
    'Unknown slide type</div>' + footer + '</div>';
}

function renderProblemSlide(s, topbar, footer) {
  var leftLines = s.left.lines.map(function(l) {
    return '<div class="ppt-line">' + escapeHTML(l) + '</div>';
  }).join("");

  var centerLines = s.center.lines.map(function(pair) {
    return '<div class="gap-item">' +
      '<div class="gap-title">' + escapeHTML(pair[0]) + '</div>' +
      '<div class="gap-desc">' + escapeHTML(pair[1]) + '</div>' +
    '</div>';
  }).join("");

  var rightLines = s.right.lines.map(function(l) {
    return '<div class="ppt-line ppt-line-check">\u2713 ' + escapeHTML(l) + '</div>';
  }).join("");

  var tableRows = s.table.map(function(row) {
    return '<tr><td class="tbl-before">' + escapeHTML(row[0]) + '</td>' +
      '<td class="tbl-after">' + escapeHTML(row[1]) + '</td></tr>';
  }).join("");

  return '<div class="ppt-fullscreen">' + topbar +
    '<div class="problem-header">' +
      '<h1 class="problem-headline">' + escapeHTML(s.headline) + '</h1>' +
      '<p class="problem-subline">' + escapeHTML(s.subline) + '</p>' +
    '</div>' +
    '<div class="problem-grid">' +
      '<div class="problem-col problem-left">' +
        '<div class="ppt-label">' + escapeHTML(s.left.label) + '</div>' +
        '<div class="ppt-lines">' + leftLines + '</div>' +
        '<div class="problem-col-stat">' + escapeHTML(s.left.stat) + '</div>' +
        '<div class="problem-col-statsub">' + escapeHTML(s.left.statSub) + '</div>' +
      '</div>' +
      '<div class="problem-col problem-center">' +
        '<div class="gap-label">' + escapeHTML(s.center.label) + '</div>' +
        '<div class="gap-line"></div>' +
        '<div class="gap-items">' + centerLines + '</div>' +
        '<div class="gap-line"></div>' +
      '</div>' +
      '<div class="problem-col problem-right">' +
        '<div class="ppt-label" style="color:#a855f7">' + escapeHTML(s.right.label) + '</div>' +
        '<div class="ppt-lines">' + rightLines + '</div>' +
        '<div class="problem-col-stat" style="color:#a855f7">' + escapeHTML(s.right.stat) + '</div>' +
        '<div class="problem-col-statsub">' + escapeHTML(s.right.statSub) + '</div>' +
      '</div>' +
    '</div>' +
    footer + '</div>';
}

function renderOutboundSlide(s, topbar, footer, c) {
  var clientPath = c ? c.path : "";
  var clientMarket = c && c.intake ? c.intake.outbound : "";
  var price = clientMarket === "outbound-india" ? "$1,599/mo" : clientMarket === "outbound-us" ? "$2,499/mo" : "";
  var marketLabel = clientMarket === "outbound-india" ? "India" : clientMarket === "outbound-us" ? "US & Other" : "";

  var pointsHtml = s.points.map(function(p) {
    return '<div class="ob-point">' + escapeHTML(p) + '</div>';
  }).join("");

  var modelsHtml = s.models.map(function(m) {
    var isActive = (m.name === "7-day sprint" && clientPath === "7-day") || (m.name === "14-day buildout" && clientPath === "14-day");
    return '<div class="ob-model' + (isActive ? ' ob-model-active' : '') + '">' +
      (isActive ? '<div class="ob-model-badge">Your plan</div>' : '') +
      '<div class="ob-model-name">' + escapeHTML(m.name) + '</div>' +
      '<div class="ob-model-desc">' + escapeHTML(m.desc) + '</div>' +
    '</div>';
  }).join("");

  var infraHtml = s.infra.items.map(function(item) {
    return '<div class="ob-infra-item">' + escapeHTML(item) + '</div>';
  }).join("");

  var addOnHtml = s.addOnInfra.items.map(function(item) {
    return '<div class="ob-infra-item ob-infra-included">' + escapeHTML(item) + '</div>';
  }).join("");

  var extrasHtml = s.addOnInfra.extras.map(function(item) {
    return '<div class="ob-extra">' + escapeHTML(item) + '</div>';
  }).join("");

  var pricingHtml = price ? (
    '<div class="ob-pricing">' +
      '<div class="ob-section-label" style="margin-top:28px">Pricing</div>' +
      '<div class="ob-price-card">' +
        '<div class="ob-price-market">' + escapeHTML(marketLabel) + '</div>' +
        '<div class="ob-price-amount">' + escapeHTML(price) + '</div>' +
      '</div>' +
    '</div>'
  ) : '';

  return '<div class="ppt-fullscreen">' + topbar +
    '<div class="ob-slide">' +
      '<div class="ob-left">' +
        '<div class="offer-category">' + escapeHTML(s.category) + '</div>' +
        '<h2 class="ob-headline">' + escapeHTML(s.headline) + '</h2>' +
        '<p class="ob-intro">' + escapeHTML(s.intro) + '</p>' +
        '<div class="ob-points">' + pointsHtml + '</div>' +
        '<div class="ob-bottom">' +
          '<div class="ob-bottom-grid">' +
            '<div>' +
              '<div class="ob-section-label" style="margin-top:24px">' + escapeHTML(s.addOnInfra.title) + '</div>' +
              '<div class="ob-infra">' + addOnHtml + '</div>' +
              '<div class="ob-extras">' + extrasHtml + '</div>' +
            '</div>' +
            (price ? '<div>' +
              '<div class="ob-section-label" style="margin-top:24px">Pricing</div>' +
              '<div class="ob-price-card">' +
                '<div class="ob-price-market">' + escapeHTML(marketLabel) + '</div>' +
                '<div class="ob-price-amount">' + escapeHTML(price) + '</div>' +
              '</div>' +
            '</div>' : '') +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="ob-right">' +
        '<div class="ob-section-label">Onboarding models</div>' +
        '<div class="ob-models">' + modelsHtml + '</div>' +
        '<div class="ob-section-label" style="margin-top:28px">' + escapeHTML(s.infra.title) + '</div>' +
        '<div class="ob-infra">' + infraHtml + '</div>' +

      '</div>' +
    '</div>' + footer + '</div>';
}

function renderOfferSlide(s, topbar, footer) {
  var linesHtml = s.lines.map(function(l) {
    return '<div class="offer-line"><span class="offer-check">\u2713</span> ' + escapeHTML(l) + '</div>';
  }).join("");

  return '<div class="ppt-fullscreen">' + topbar +
    '<div class="offer-body">' +
      '<div class="offer-card">' +
        '<div class="offer-category">' + escapeHTML(s.category) + '</div>' +
        '<h2 class="offer-headline">' + escapeHTML(s.headline) + '</h2>' +
        '<div class="offer-lines">' + linesHtml + '</div>' +
      '</div>' +
    '</div>' + footer + '</div>';
}

function renderProblemSummary(s, topbar, footer) {
  var tableRows = s.table.map(function(row) {
    return '<tr><td class="tbl-before">' + escapeHTML(row[0]) + '</td>' +
      '<td class="tbl-after">' + escapeHTML(row[1]) + '</td></tr>';
  }).join("");

  return '<div class="ppt-fullscreen">' + topbar +
    '<div class="summary-body">' +
      '<div class="summary-table">' +
        '<table><thead><tr><th>Traditional agencies</th><th>GetGTM</th></tr></thead>' +
        '<tbody>' + tableRows + '</tbody></table>' +
      '</div>' +
      '<div class="summary-closing">' + escapeHTML(s.closing) + '</div>' +
    '</div>' +
    footer + '</div>';
}

function renderIntakeTab(c) {
  const it = c.intake;
  return `
    <div class="card">
      <div class="card-head">
        <div><h2>Client intake</h2><div class="sub">Capture the basics first - POC details flow into the Overview</div></div>
      </div>
      <div class="card-body">
        <div class="grid-2">
          <div class="field"><label>Client name</label><input data-intake="clientName" value="${escapeAttr(it.clientName)}" placeholder="Company name"></div>
          <div class="field"><label>Website</label><input data-intake="website" value="${escapeAttr(it.website)}" placeholder="https://company.com"></div>
          <div class="field"><label>POC name</label><input data-intake="pocName" value="${escapeAttr(it.pocName)}" placeholder="Name, title"></div>
          <div class="field"><label>POC email</label><input data-intake="pocEmail" type="email" value="${escapeAttr(it.pocEmail)}" placeholder="name@company.com"></div>
        </div>
        <div class="small" style="margin-top:8px">POC name and email auto-fill the Client POC fields in the Overview tab.</div>

        <h3 style="margin:20px 0 6px;font-size:13px;font-weight:600">Outbound <span style="color:var(--danger);font-weight:500">· required, pick one</span></h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          ${OUTBOUND_PLANS.map(pkg => {
            const sel = it.outbound === pkg.id;
            return `
              <div data-outbound-card="${pkg.id}" style="border:${sel?'2px solid var(--brand)':'0.5px solid var(--border)'};border-radius:8px;padding:12px 14px;cursor:pointer;background:${sel?'var(--surface-1)':'var(--surface-2)'}">
                <div style="display:flex;justify-content:space-between;align-items:start;gap:8px">
                  <div style="font-weight:600;font-size:13px">${escapeHTML(pkg.name)}</div>
                  <div style="font-weight:600;font-size:13px;color:var(--brand);white-space:nowrap">${escapeHTML(pkg.price)}</div>
                </div>
                <div class="small" style="margin-top:4px">${escapeHTML(pkg.desc)}</div>
              </div>`;
          }).join("")}
        </div>

        <h3 style="margin:18px 0 6px;font-size:13px;font-weight:600">AEO / GEO / Inbound <span style="color:var(--text-muted);font-weight:500">· optional, pick one</span></h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          ${AEO_PLANS.map(pkg => {
            const sel = it.aeo === pkg.id;
            return `

function buildGmailLink(to, subject, bodyLines) {
  var body = bodyLines.join("\n");
  return "https://mail.google.com/mail/?view=cm&to=" + encodeURIComponent(to) +

}

  // Footer

function syncTimelineFromDelivery(c) {
  if (!c.stages) return;
  var del = (c.delivery && c.delivery.onboarding) || [];
  var stageMap = {};
  del.forEach(function(item) { stageMap[item.item] = item.status; });

  function allDone() {
    var items = Array.prototype.slice.call(arguments);
    return items.length > 0 && items.every(function(name) { return stageMap[name] === "Complete"; });
  }
  function anyBlocked() {
    var items = Array.prototype.slice.call(arguments);
    return items.some(function(name) { return stageMap[name] === "Blocked"; });
  }
  function anyStarted() {
    var items = Array.prototype.slice.call(arguments);
    return items.some(function(name) { return stageMap[name] === "In Progress" || stageMap[name] === "Complete"; });
  }

  var propStage = c.proposal ? c.proposal.stage : "";

  c.stages.forEach(function(stage) {
    var s = stage.stage;
    var newStatus = stage.status;

    // Qualification: moves as soon as any package is selected in intake
    if (s === "Qualification") {
      if (c.intake && c.intake.outbound) newStatus = "Complete";
    }

    // Scoping: in progress once overview/goals/ICP started, complete once proposal drafted
    if (s === "Scoping") {
      var hasGoals = c.goals && (c.goals.m1.replies || c.goals.m2.replies);
      var hasICP = c.icp && (c.icp.geography || c.icp.industry);
      if (propStage) newStatus = "Complete";
      else if (hasGoals || hasICP) newStatus = "In Progress";
    }

    // Proposal stage tracks the proposal workflow directly
    if (s === "Proposal" || s === "Proposal / Scoping") {
      if (propStage === "draft") newStatus = "In Progress";
      else if (propStage === "sent" || propStage === "final") newStatus = "In Progress";
      else if (propStage === "approved") newStatus = "Complete";
    }

    // Commercial Handover: in progress once approved, complete once SOW+invoice done
    if (s === "Commercial Handover") {
      if (propStage === "approved") {
        if (allDone("SOW signed and filed", "Invoice sent (Part 1)")) newStatus = "Complete";
        else newStatus = "In Progress";
      }
    }

    if (s === "Onboarding" || s === "Onboarding Call") {
      if (allDone("Kickoff call completed")) newStatus = "Complete";
      else if (anyStarted("Kickoff call completed", "Shared Slack/Teams channel created")) newStatus = "In Progress";
      if (anyBlocked("Kickoff call completed")) newStatus = "Blocked";
    }

    if (s === "Infrastructure") {
      if (allDone("Email domains purchased", "Email domains warming")) newStatus = "Complete";
      else if (anyStarted("Email domains purchased", "Email domains warming")) newStatus = "In Progress";
      if (anyBlocked("Email domains purchased", "Email domains warming")) newStatus = "Blocked";
    }

    if (s === "Connecting Accounts") {
      if (allDone("LinkedIn accounts connected", "Sales Navigator access confirmed", "CRM access granted or tracking sheet created")) newStatus = "Complete";
      else if (anyStarted("LinkedIn accounts connected", "Sales Navigator access confirmed")) newStatus = "In Progress";
      if (anyBlocked("LinkedIn accounts connected", "Sales Navigator access confirmed")) newStatus = "Blocked";
    }

    if (s === "ICP Fitment") {
      if (allDone("ICP fitment document approved")) newStatus = "Complete";
      else if (anyStarted("ICP fitment document approved")) newStatus = "In Progress";
      if (anyBlocked("ICP fitment document approved")) newStatus = "Blocked";
    }

    if (s === "TAM & List" || s === "Target List Research") {
      if (allDone("TAM & launch list built")) newStatus = "Complete";
      else if (anyStarted("TAM & launch list built")) newStatus = "In Progress";
      if (anyBlocked("TAM & launch list built")) newStatus = "Blocked";
    }

    if (s === "Messaging") {
      if (allDone("Messaging approved")) newStatus = "Complete";
      else if (anyStarted("Messaging approved")) newStatus = "In Progress";
      if (anyBlocked("Messaging approved")) newStatus = "Blocked";
    }

    if (s === "Campaign Build" || s === "QA & Test" || s === "QA & Validation") {
      if (allDone("Campaign built and QA passed")) newStatus = "Complete";
      else if (anyStarted("Campaign built and QA passed")) newStatus = "In Progress";
      if (anyBlocked("Campaign built and QA passed")) newStatus = "Blocked";
    }

    if (s === "Launch") {
      if (allDone("First campaign launched")) newStatus = "Complete";
      else if (anyStarted("First campaign launched")) newStatus = "In Progress";
      if (anyBlocked("First campaign launched")) newStatus = "Blocked";
    }

    if (s === "First Review" || s === "Post-launch") {
      if (allDone("MSP signed off by both parties", "First campaign launched")) newStatus = "Complete";
      else if (allDone("First campaign launched")) newStatus = "In Progress";
    }

    // Deep Discovery (niche path)
    if (s === "Deep Discovery") {
      if (allDone("Kickoff call completed")) newStatus = "Complete";
      else if (anyStarted("Kickoff call completed")) newStatus = "In Progress";
    }

    // GTM Play Design (niche path)
    if (s === "GTM Play Design") {
      if (allDone("ICP fitment document approved", "TAM & launch list built")) newStatus = "Complete";
      else if (anyStarted("ICP fitment document approved")) newStatus = "In Progress";
    }

    // Update date if completing
    if (newStatus === "Complete" && stage.status !== "Complete" && !stage.eta) {
      stage.eta = new Date().toISOString().slice(0, 10);
    }

    stage.status = newStatus;
  });
}

function renderTimelineBar(c) {
  var stages = c.stages || [];
  var total = stages.length;
  var done = stages.filter(function(s) { return s.status === "Complete"; }).length;
  var current = stages.find(function(s) { return s.status !== "Complete"; });

  var dots = stages.map(function(s, i) {
    var st = s.status;
    var cls = st === "Complete" ? "tl-done" : st === "In Progress" ? "tl-active" : st === "Blocked" ? "tl-blocked" : "tl-pending";
    var dateStr = s.eta ? new Date(s.eta).toLocaleDateString("en-US", {month:"short",day:"numeric"}) : "";
    return '<div class="tl-node ' + cls + '" title="' + escapeAttr(s.stage + ': ' + st) + '">' +
      '<div class="tl-dot"></div>' +
      '<div class="tl-label">' + escapeHTML(s.stage.length > 12 ? s.stage.substring(0,11) + '..' : s.stage) + '</div>' +
      (dateStr ? '<div class="tl-date">' + dateStr + '</div>' : '') +
    '</div>';
  }).join('<div class="tl-connector' + '"></div>');

  return '<div class="tl-track">' + dots + '</div>' +
    '<div class="tl-summary">' + done + ' of ' + total + ' complete' +
    (current ? ' - Current: ' + escapeHTML(current.stage) : ' - All complete') + '</div>';
}

        { item: "Shared Slack/Teams channel created", status: "Not Started", date: "", owner: "CS", notes: "" },
        { item: "Drive folder + Assets subfolder created", status: "Not Started", date: "", owner: "CS", notes: "" },
        { item: "CRM access granted or tracking sheet created", status: "Not Started", date: "", owner: "Client", notes: "" },
        { item: "LinkedIn accounts connected", status: "Not Started", date: "", owner: "Client", notes: "" },
        { item: "Sales Navigator access confirmed", status: "Not Started", date: "", owner: "Client", notes: "" },
        { item: "Email domains purchased", status: "Not Started", date: "", owner: "GTME", notes: "" },
        { item: "Email domains warming", status: "Not Started", date: "", owner: "GTME", notes: "" },
        { item: "Kickoff call completed", status: "Not Started", date: "", owner: "CS / GTME", notes: "" },
        { item: "ICP fitment document approved", status: "Not Started", date: "", owner: "Strategist / Client", notes: "" },
        { item: "TAM & launch list built", status: "Not Started", date: "", owner: "Research", notes: "" },
        { item: "Messaging approved", status: "Not Started", date: "", owner: "Content / Client", notes: "" },
        { item: "Campaign built and QA passed", status: "Not Started", date: "", owner: "GTME", notes: "" },
        { item: "First campaign launched", status: "Not Started", date: "", owner: "GTME", notes: "" },
        { item: "MSP signed off by both parties", status: "Not Started", date: "", owner: "CS / Client", notes: "" },
      ],
      weeklyUpdates: []
    };
  }
  var del = c.delivery;
  var onDone = del.onboarding.filter(function(o) { return o.status === "Complete"; }).length;
  var onTotal = del.onboarding.length;
  var onProg = Math.round((onDone / onTotal) * 100);

  var html = '<div class="card" style="margin-bottom:16px">';
  html += '<div class="card-head"><div><h2>Delivery</h2><div class="sub">SOW signed. Track onboarding through first campaign launch.</div></div></div>';
  html += '<div class="card-body">';

  // Progress
  html += '<div class="kpis" style="margin-bottom:16px"><div class="kpi"><div class="label">Onboarding</div><div class="value">' + onProg + '%</div>';
  html += '<div class="progress" style="margin-top:6px"><div style="width:' + onProg + '%"></div></div></div>';
  html += '<div class="kpi"><div class="label">Items done</div><div class="value">' + onDone + ' / ' + onTotal + '</div></div>';
  html += '<div class="kpi"><div class="label">SOW Signed</div><div class="value" style="font-size:14px">' + escapeHTML(del.sowSignedDate || "Pending") + '</div></div></div>';

  // Onboarding checklist
  html += '<h3 style="font-size:14px;font-weight:600;margin:0 0 12px">Onboarding & launch checklist</h3>';

  del.onboarding.forEach(function(item, i) {
    var statusClass = item.status === "Complete" ? "done" : item.status === "In Progress" ? "pending" : item.status === "Blocked" ? "at-risk" : "";
    html += '<div class="del-row">';
    html += '<div class="del-item"><strong>' + escapeHTML(item.item) + '</strong><div class="small">' + escapeHTML(item.owner) + '</div></div>';
    html += '<select data-delivery="' + i + '" data-key="status" class="del-select">';
    ["Not Started","In Progress","Blocked","Complete"].forEach(function(s) {
      html += '<option' + (item.status === s ? ' selected' : '') + '>' + s + '</option>';
    });
    html += '</select>';
    html += '<input type="date" data-delivery="' + i + '" data-key="date" value="' + escapeAttr(item.date) + '" class="del-date">';
    html += '<input data-delivery="' + i + '" data-key="notes" value="' + escapeAttr(item.notes) + '" placeholder="Notes" class="del-notes">';
    html += '</div>';
  });

  // Weekly updates log
  html += '<h3 style="font-size:14px;font-weight:600;margin:20px 0 12px">Weekly updates</h3>';
  html += '<button class="btn sm" data-action="add-weekly-update" style="margin-bottom:12px">+ Add update</button>';

  (del.weeklyUpdates || []).forEach(function(u, i) {
    html += '<div class="del-update">';
    html += '<input type="date" data-weekly="' + i + '" data-key="date" value="' + escapeAttr(u.date) + '" style="width:130px">';
    html += '<textarea data-weekly="' + i + '" data-key="note" placeholder="What happened this week?" style="flex:1;min-height:40px">' + escapeHTML(u.note) + '</textarea>';
    html += '<button class="btn ghost sm" data-action="delete-weekly" data-i="' + i + '">x</button>';
    html += '</div>';
  });

  html += '</div></div>';
  return html;
}


function renderTimelineTab(c) {
  return `
    <div class="card">
      <div class="card-head"><h2>What's moving</h2></div>
      <div class="card-body">
        ${c.stages.map((s, i) => `
          <div style="padding:12px 0;border-bottom:0.5px solid var(--border);${i===c.stages.length-1?'border-bottom:none':''}">
            <div style="display:flex;gap:12px;align-items:start">
              <div style="flex:1">
                <div style="font-weight:500;font-size:13px">${escapeHTML(s.stage)}</div>
                <div class="small">${escapeHTML(s.notes || '')}</div>
              </div>
              <select data-stage="${i}" data-key="status" style="padding:5px 8px;border:0.5px solid var(--border);border-radius:4px;background:var(--surface-1);font-size:11px">
                <option ${s.status==='Not Started'?'selected':''}>Not Started</option>
                <option ${s.status==='In Progress'?'selected':''}>In Progress</option>
                <option ${s.status==='Blocked'?'selected':''}>Blocked</option>
                <option ${s.status==='Complete'?'selected':''}>Complete</option>
              </select>
            </div>
            <input type="date" data-stage="${i}" data-key="eta" value="${escapeAttr(s.eta)}" style="margin-top:6px;padding:4px 8px;border:0.5px solid var(--border);border-radius:4px;background:var(--surface-1);font-size:11px;width:100%">
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function renderOutcomesTab(c) {
  return `
    <div class="card">
      <div class="card-head">
        <h2>Weekly outcomes</h2>
        <button class="btn sm" data-action="add-outcome">+ Add row</button>
      </div>
      <div class="card-body">
        ${c.outcomes.length === 0 ? `<div class="empty" style="padding:20px"><div>No outcomes logged yet.</div></div>` : `
        <table>
          <thead><tr><th>Date</th><th>Metric</th><th>Target</th><th>Actual</th><th></th></tr></thead>
          <tbody>
            ${c.outcomes.map((o, i) => `
              <tr>
                <td><input type="date" data-out="${i}" data-key="date" value="${escapeAttr(o.date)}" style="padding:4px;border:0.5px solid var(--border);border-radius:3px;width:100%;background:var(--surface-1)"></td>
                <td><input data-out="${i}" data-key="metric" value="${escapeAttr(o.metric)}" placeholder="Meetings, replies, etc." style="padding:4px;border:0.5px solid var(--border);border-radius:3px;width:100%;background:var(--surface-1)"></td>
                <td><input data-out="${i}" data-key="target" value="${escapeAttr(o.target)}" placeholder="10" style="padding:4px;border:0.5px solid var(--border);border-radius:3px;width:100%;background:var(--surface-1)"></td>
                <td><input data-out="${i}" data-key="actual" value="${escapeAttr(o.actual)}" placeholder="12" style="padding:4px;border:0.5px solid var(--border);border-radius:3px;width:100%;background:var(--surface-1)"></td>
                <td><button class="btn ghost sm" data-action="delete-out" data-i="${i}">×</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        `}
      </div>
    </div>
  `;
}

function renderModal() {
  document.querySelectorAll(".modal-backdrop").forEach(el => el.remove());
  const div = document.createElement("div");
  div.className = "modal-backdrop";
  if (ui.modal.type === "new-client") {
    div.innerHTML = `
      <div class="modal">
        <div class="card-head"><h2>New engagement</h2></div>
        <div class="card-body">
          <div class="field"><label>Client name</label><input id="nc-name" placeholder="e.g. Acme Corp" autofocus></div>
          <div class="field">
            <label>Delivery path</label>
            <select id="nc-path">
              <option value="7-day">7-day sprint (pre-warmed)</option>
              <option value="14-day">14-day buildout (infrastructure)</option>
              <option value="niche">Niche GTM (deep research)</option>
            </select>
          </div>
          <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
            <button class="btn secondary" data-action="modal-close">Cancel</button>
            <button class="btn" data-action="modal-create">Create</button>
          </div>
        </div>
      </div>
    `;
  }
  div.addEventListener("click", (e) => { if (e.target === div) { ui.modal = null; render(); } });
  document.body.appendChild(div);
  const firstInput = div.querySelector("input");
  if (firstInput) firstInput.focus();
}

function attachHandlers() {
  window.openClient = (id) => { ui.view = "client"; ui.clientId = id; ui.tab = "offers"; ui.offerPage = 0; render(); };

  const doLogin = () => {
    const el = document.getElementById("pw");
    if (!el) return;
    if (el.value === PW) { ui.isAuth = true; ui.view = "dashboard"; render(); }
    else { el.style.borderColor = "var(--danger)"; el.value = ""; el.focus(); var err = document.getElementById("pw-error"); if (err) { err.style.display = "block"; setTimeout(function(){ err.style.display = "none"; }, 2000); } }
  };
  const pwEl = document.getElementById("pw");
  if (pwEl) {
    pwEl.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); doLogin(); } });
  }

  if (window.__actionHandler) {
    document.removeEventListener("click", window.__actionHandler);
    window.__actionHandler = null;
  }
  const actionHandler = async function(e) {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const action = el.dataset.action;
      if (action === "login") {
        doLogin();
      } else if (action === "logout") { if (isClientView) return; ui.isAuth = false; ui.view = "login"; render(); }
      else if (action === "new-client") { ui.modal = { type: "new-client" }; render(); }
      else if (action === "delete-client") {
        var cl = state.clients[el.dataset.id];
        var clName = cl ? cl.name : "this engagement";
        if (confirm("Delete " + clName + "? This removes all data for this engagement - intake, overview, proposal, timeline, delivery, outcomes. This cannot be undone.")) {
          delete state.clients[el.dataset.id];
          await saveState();
          render();
        }
      }
      else if (action === "dtab") { ui.dashboardTab = el.dataset.dtab; render(); }
      else if (action === "add-prospect") {
        state.prospects.push({
          id: "p_" + Math.random().toString(36).slice(2,10),
          name: "New prospect", company: "", email: "",
          dateContacted: new Date().toISOString().slice(0,10), status: "New",
          nextStep: "", source: "Manually added", notes: ""
        });
        saveState(); render();
      }
      else if (action === "delete-prospect") {
        var pr = state.prospects.find(function(x) { return x.id === el.dataset.id; });
        var prName = pr ? (pr.name + (pr.company ? " (" + pr.company + ")" : "")) : "this prospect";
        if (confirm("Remove " + prName + " from Prospects? This cannot be undone.")) {
          state.prospects = state.prospects.filter(p => p.id !== el.dataset.id);
          saveState(); render();
        }
      }
      else if (action === "refresh-prospects-note") {
        alert("Ask Claude to pull the latest prospects from Gmail and I'll refresh this list with real threads.");
      }
      else if (action === "modal-close") { ui.modal = null; render(); }
      else if (action === "modal-create") {
        const nameEl = document.getElementById("nc-name");
        const name = nameEl.value.trim();
        const path = document.getElementById("nc-path").value;
        if (!name) { nameEl.style.borderColor = "var(--danger)"; nameEl.focus(); return; }
        const c = newClient(name, path);
        state.clients[c.id] = c;
        await saveState();
        ui.modal = null;
        ui.view = "client";
        ui.clientId = c.id;
        ui.tab = "offers";
        ui.offerPage = 0;
        render();
      } else if (action === "back") { ui.view = "dashboard"; render(); }
      else if (action === "tab") { if (isClientView && (el.dataset.tab === "offers" || el.dataset.tab === "intake" || el.dataset.tab === "proposal")) return; ui.tab = el.dataset.tab; render(); }
      else if (action === "skip-ppt") { ui.tab = "intake"; render(); }
      else if (action === "offer-prev") {
        ui.offerPage = Math.max(0, (ui.offerPage || 0) - 1);
        render();
      } else if (action === "offer-next") {
        if ((ui.offerPage || 0) < SLIDES.length - 1) {
          ui.offerPage = (ui.offerPage || 0) + 1; render();
        } else {
          ui.tab = "intake"; render();
        }
      }
      else if (action === "generate-pdf") {
        generateProposalPDF(state.clients[ui.clientId]);
      } else if (action === "go-to-proposal") {
        await saveState();
        ui.tab = "proposal";
        render();
      } else if (action === "mark-initial-sent") {
        const cl = state.clients[ui.clientId];
        cl.proposal.stage = "sent";
        cl.proposal.initialSentDate = new Date().toISOString().slice(0,10);
        await saveState(); render();
      } else if (action === "mark-final-sent") {
        const cl = state.clients[ui.clientId];
        cl.proposal.stage = "final";
        cl.proposal.finalSentDate = new Date().toISOString().slice(0,10);
        await saveState(); render();
      } else if (action === "mark-approved") {
        const cl = state.clients[ui.clientId];
        cl.proposal.stage = "approved";
        cl.proposal.approvedDate = new Date().toISOString().slice(0,10);
        cl.sow.status = "Drafting";
        syncTimelineFromDelivery(cl);
        await saveState(); render();
      }
      else if (action === "save-intake") {
        const cl = state.clients[ui.clientId];
        if (!cl.intake.outbound) {
          const btn = el;
          btn.textContent = "Select an Outbound plan first";
          btn.style.background = "var(--danger)";
          setTimeout(() => { btn.textContent = "Save & continue to Overview →"; btn.style.background = ""; }, 1800);
          return;
        }
        cl.name = cl.intake.clientName || cl.name;
        if (!cl.people.clientPoc) cl.people.clientPoc = cl.intake.pocName;
        if (!cl.people.clientPocEmail) cl.people.clientPocEmail = cl.intake.pocEmail;
        await saveState();
        ui.tab = "overview";
        render();
      }
      else if (action === "add-weekly-update") {
        const cl = state.clients[ui.clientId];
        if (!cl.delivery) cl.delivery = { onboarding: [], weeklyUpdates: [] };
        cl.delivery.weeklyUpdates.push({ date: new Date().toISOString().slice(0,10), note: "" });
        await saveState(); render();
      } else if (action === "delete-weekly") {
        const cl = state.clients[ui.clientId];
        cl.delivery.weeklyUpdates.splice(+el.dataset.i, 1);
        await saveState(); render();
      }
      else if (action === "add-outcome") {
        const c = state.clients[ui.clientId];
        c.outcomes.push({ date: new Date().toISOString().slice(0,10), metric: "", target: "", actual: "" });
        await saveState();
        render();
      } else if (action === "delete-out") {
        const c = state.clients[ui.clientId];
        c.outcomes.splice(+el.dataset.i, 1);
        await saveState();
        render();
      }
  };
  window.__actionHandler = actionHandler;
  document.addEventListener("click", actionHandler);

  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  const save = debounce(saveState, 300);

  const simpleGroups = ["people", "channel", "icp", "drive", "integration", "intake"];
  simpleGroups.forEach(group => {
    document.querySelectorAll(`[data-${group}]`).forEach(el => {
      const commit = () => { state.clients[ui.clientId][group][el.dataset[group]] = el.value; };
      el.addEventListener("input", () => { commit(); save(); });
      if (el.tagName === "SELECT") el.addEventListener("change", () => { commit(); saveState(); render(); });
    });
  });

  document.querySelectorAll("[data-outbound-card]").forEach(el => {
    el.addEventListener("click", () => {
      state.clients[ui.clientId].intake.outbound = el.dataset.outboundCard;
      saveState(); render();
    });
  });
  document.querySelectorAll("[data-aeo-card]").forEach(el => {
    el.addEventListener("click", () => {
      const cl = state.clients[ui.clientId];
      cl.intake.aeo = cl.intake.aeo === el.dataset.aeoCard ? "" : el.dataset.aeoCard;
      saveState(); render();
    });
  });
  document.querySelectorAll("[data-delight-card]").forEach(el => {
    el.addEventListener("click", () => {
      const cl = state.clients[ui.clientId];
      cl.intake.delight = cl.intake.delight === el.dataset.delightCard ? "" : el.dataset.delightCard;
      saveState(); render();
    });
  });
  document.querySelectorAll("[data-addon-card]").forEach(el => {
    el.addEventListener("click", () => {
      const arr = state.clients[ui.clientId].intake.addons;
      const id = el.dataset.addonCard;
      const i = arr.indexOf(id);
      if (i >= 0) arr.splice(i, 1); else arr.push(id);
      saveState(); render();
    });
  });

  document.querySelectorAll("[data-delivery]").forEach(el => {
    var handler = function() {
      var cl = state.clients[ui.clientId];
      if (!cl.delivery) return;
      var idx = parseInt(el.dataset.delivery);
      cl.delivery.onboarding[idx][el.dataset.key] = el.value;
      if (el.dataset.key === "status") { syncTimelineFromDelivery(cl); saveState(); render(); } else { save(); }
    };
    el.addEventListener("input", handler);
    el.addEventListener("change", handler);
  });
  document.querySelectorAll("[data-weekly]").forEach(el => {
    el.addEventListener("input", function() {
      var cl = state.clients[ui.clientId];
      if (!cl.delivery) return;
      cl.delivery.weeklyUpdates[parseInt(el.dataset.weekly)][el.dataset.key] = el.value;
      save();
    });
  });

  document.querySelectorAll("[data-prospect]").forEach(el => {
    var handler = function() {
      var p = state.prospects.find(function(x) { return x.id === el.dataset.prospect; });
      if (!p) return;
      p[el.dataset.key] = el.value;
      if (el.dataset.key === "status") { saveState(); render(); } else { save(); }
    };
    el.addEventListener("input", handler);
    el.addEventListener("change", handler);
  });

  document.querySelectorAll("[data-proposal]").forEach(el => {
    el.addEventListener("input", () => {
      if (!state.clients[ui.clientId].proposal) return;
      state.clients[ui.clientId].proposal[el.dataset.proposal] = el.value;
      save();
    });
  });

  document.querySelectorAll("[data-gtme]").forEach(el => {
    el.addEventListener("change", () => {
      const match = GTME_ROSTER.find(m => m.name === el.value);
      const cl = state.clients[ui.clientId];
      cl.people.gtme = el.value;
      cl.people.gtmeEmail = match ? match.email : "";
      saveState(); render();
    });
  });

  document.querySelectorAll("[data-goal]").forEach(el => {
    el.addEventListener("input", () => {
      const [month, metric] = el.dataset.goal.split(".");
      state.clients[ui.clientId].goals[month][metric] = el.value;
      save();
    });
  });
  document.querySelectorAll("[data-stage]").forEach(el => {
    el.addEventListener("change", () => {
      const s = state.clients[ui.clientId].stages[+el.dataset.stage];
      s[el.dataset.key] = el.value;
      saveState(); render();
    });
    el.addEventListener("input", () => {
      const s = state.clients[ui.clientId].stages[+el.dataset.stage];
      s[el.dataset.key] = el.value;
      save();
    });
  });
  document.querySelectorAll("[data-out]").forEach(el => {
    el.addEventListener("input", () => {
      const o = state.clients[ui.clientId].outcomes[+el.dataset.out];
      o[el.dataset.key] = el.value;
      save();
    });
  });
}

function escapeHTML(s) { return String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function escapeAttr(s) { return escapeHTML(s); }

(async function init() {
  initFirebase();
  if (!useFirebase) await loadState();
  else {
    // Give Firebase a moment to load
    await new Promise(function(r) { setTimeout(r, 500); });
    if (!state.clients || Object.keys(state.clients).length === 0) {
      await loadState();
    }
  }

  // Detect client view from URL
  var params = new URLSearchParams(window.location.search);
  clientViewId = params.get("client");
  if (clientViewId && state.clients[clientViewId]) {
    isClientView = true;
    ui.clientId = clientViewId;
    ui.view = "client";
    ui.tab = "overview";
  }

  render();
})();
</script>
</body>
</html>
